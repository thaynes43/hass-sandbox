name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "appdaemon/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for appdaemon changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- appdaemon/ .github/workflows/unit-tests.yml)
          else
            CHANGED=$(git diff --name-only HEAD~1 -- appdaemon/)
          fi
          if [ -n "$CHANGED" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No appdaemon changes detected, skipping tests"
          fi

      - name: Set up Python
        if: steps.changes.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: appdaemon/requirements.txt

      - name: Install dependencies
        if: steps.changes.outputs.should_run == 'true'
        run: pip install -r appdaemon/requirements.txt

      - name: Run unit tests
        if: steps.changes.outputs.should_run == 'true'
        working-directory: appdaemon
        run: python -m pytest tests/ -v --tb=short --junitxml=../test-results.xml

      - name: Upload test results
        if: always() && steps.changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
