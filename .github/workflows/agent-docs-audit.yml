name: Agent Docs Audit

on:
  pull_request:
    types: [ready_for_review, reopened]

jobs:
  agent-docs-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for appdaemon changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- appdaemon/)
          if [ -n "$CHANGED" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No appdaemon changes detected, skipping audit"
          fi

      - name: Audit documentation with Claude
        if: steps.changes.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "haynes-dev-bot"
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review the PR diff and check documentation consistency. Focus on:

            1. **README coverage**: If a new app or provider was added under `appdaemon/apps/` or
               `appdaemon/providers/`, verify it has a README.md following the requirements in
               `.agents/rules/appdaemon-documentation.md`.

            2. **Documentation map**: If a new app/provider was added, check that
               `.agents/rules/appdaemon-documentation.md` was updated with the new entry
               in the documentation map table.

            3. **Config sync**: If app behavior changed (new config keys, removed keys, changed
               defaults), verify the app's README.md config reference table matches.

            4. **Dependency graph**: If app dependencies changed (new imports, new event
               listeners/publishers), verify the dependency graph in
               `.agents/rules/appdaemon-documentation.md` was updated.

            5. **YAML configs**: If a new app was added, verify entries exist in both
               `appdaemon/apps/apps-dev.yaml` and `appdaemon/apps/apps-prod.yaml`.

            Post your findings as a PR comment using `gh pr comment`.
            If everything is in sync, post a brief approval comment.
            If issues are found, list them as actionable items.

            Only review files changed in this PR — do not audit the entire codebase.