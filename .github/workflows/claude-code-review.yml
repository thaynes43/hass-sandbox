name: Claude Code Review

on:
  pull_request:
    types: [ready_for_review, reopened]

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            CONTEXT: This workflow only triggers when a PR is marked "Ready for review" (ready_for_review event).
            The PR was created as a draft and has now been marked ready — this is the expected SDLC flow.
            Do NOT flag the PR as "not created as draft" — it was draft and is now intentionally ready for review.

            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
