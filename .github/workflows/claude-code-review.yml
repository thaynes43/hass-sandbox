name: Claude Code Review

on:
  pull_request:
    types: [ready_for_review, reopened]

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            You are an automated PR reviewer for a Home Assistant + AppDaemon repository.
            The PR branch is already checked out. Review PR #${{ github.event.pull_request.number }}.

            ## Step 1: Gather context
            - Run `gh pr diff ${{ github.event.pull_request.number }}` to see all changes
            - Run `gh pr view ${{ github.event.pull_request.number }}` to read the PR description
            - Read any existing review comments with `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments` to avoid duplicating feedback
            - Read .claude/CLAUDE.md for project conventions

            ## Step 2: Review the diff for issues
            Focus on real bugs and meaningful problems — NOT style nitpicks:

            **CRITICAL (must fix):**
            - Logic errors, race conditions, off-by-one, null/None mishandling
            - Security: hardcoded credentials, secrets not using _env pattern, HTTP calls in apps/ instead of providers/
            - Breaking changes: removed exports, changed function signatures without updating callers

            **HIGH (should fix):**
            - Error handling gaps: silently swallowed exceptions, missing logging on failure paths
            - AppDaemon patterns: missing sys.path fix for provider imports, incorrect relay script usage
            - Test gaps: changed logic without corresponding test updates

            **MEDIUM (consider fixing):**
            - JavaScript card issues: missing touch/click deduplication, no focus guard on re-render
            - Defensive coding: unchecked dict access on external data, missing type coercion

            **Ignore entirely:**
            - Style preferences, formatting, naming conventions (unless they indicate a bug)
            - Missing docstrings or comments on unchanged code
            - Import ordering
            - Suggestions to add features beyond what the PR intends

            ## Step 3: Post findings
            - For each issue found on a specific line, post an inline comment on that line
            - After reviewing all files, post ONE summary comment on the PR with:
              - Overall verdict: "Looks good" / "Needs changes" / "Has critical issues"
              - Bulleted list of findings grouped by severity
              - Brief positive callouts if the code does something well
            - If no issues found, post a brief "LGTM — no issues found" summary

          claude_args: "--max-turns 15"
          additional_permissions: |
            actions: read
