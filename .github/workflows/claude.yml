name: Claude Code

# Interactive "@claude" handler: mention @claude in an issue, a PR comment or a
# review and Claude picks the work up from there.
# Public repos: anyone can comment, so the job's `if:` also gates on who wrote the
# text: the owner, a member or a collaborator (`author_association`), or the dev bot
# `haynes-dev-bot[bot]` (agent-authored issues and PRs). A stranger's @claude starts
# no job, and a stranger's issue stays unanswered even when someone trusted assigns
# it later (the gate reads the issue's author). Added 2026-10-07 (dev-env #56).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
         github.actor == 'haynes-dev-bot[bot]')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
         github.actor == 'haynes-dev-bot[bot]')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) ||
         github.actor == 'haynes-dev-bot[bot]')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
         github.actor == 'haynes-dev-bot[bot]'))
    # One @claude run per thread: a follow-up mention waits for the run in flight.
    # Job-level, so a skipped (ungated) event never enters the group and cannot
    # displace a pending run.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # OIDC exchange for the Claude GitHub App token (used to comment)
      actions: read # lets Claude read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent-authored issues/PRs come from the dev bot; allow it to summon Claude.
          allowed_bots: "haynes-dev-bot"
          # Automated surfaces are pinned to the newest Opus explicitly — never an
          # alias, which resolves client-side and can silently serve an older tier.
          claude_args: "--model claude-opus-5"
          additional_permissions: |
            actions: read
