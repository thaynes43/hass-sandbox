name: Docs Site Audit

on:
  pull_request:
    types: [ready_for_review, reopened]

jobs:
  docs-site-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- appdaemon/ home-assistant/ docs/ mkdocs.yml)
          if [ -n "$CHANGED" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes detected, skipping audit"
          fi

      - name: Audit docs site with Claude
        if: steps.changes.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "haynes-dev-bot"
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review the PR diff and check if the mkdocs documentation site (docs/) needs updating.
            Focus on:

            1. **Feature pages**: If AppDaemon app behavior changed significantly (new features,
               renamed apps, changed architecture), check if the relevant feature page in
               `docs/features/` should be updated.

            2. **Architecture page**: If the system architecture changed (new apps, new providers,
               changed data flows), check if `docs/architecture/overview.md` needs updates.

            3. **Navigation**: If new docs pages were added to `docs/`, verify they are included
               in the `nav:` section of `mkdocs.yml`.

            4. **Broken links**: Check for any internal links in `docs/` that point to
               non-existent pages or moved files.

            5. **Image references**: If images were added, moved, or deleted, verify that
               `docs/` pages referencing them are updated.

            This audit covers the human-facing documentation site only (docs/ + mkdocs.yml),
            not the agent-facing docs (agent-docs/) which are covered by a separate workflow.

            Post your findings as a PR comment using `gh pr comment`.
            If everything is in sync, post a brief approval comment.
            If issues are found, list them as actionable items.

            Only review files changed in this PR — do not audit the entire codebase.