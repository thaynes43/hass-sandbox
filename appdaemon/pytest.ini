# Pytest configuration for the AppDaemon suite.
#
# CI runs `python -m pytest tests/ ...` from this directory (see
# .github/workflows/unit-tests.yml), so this file is picked up automatically
# and the gate below applies to CI as well as to local runs.

[pytest]
# Test-hygiene gate: a coroutine that is created and never awaited is a test
# defect, not noise. It used to be suppressed wholesale in tests/conftest.py,
# which hid ~50 leaks; the warning is now an error.
#
# The two filters work as a pair. The RuntimeWarning is raised from the
# coroutine's __del__, so under an "error" filter it surfaces as an unraisable
# exception rather than a normal test failure — hence the second entry. The
# autouse gc.collect() fixture in tests/conftest.py is what makes it land on
# the test that actually leaked; do not remove it.
#
# Fix a failure, never silence it: drive the coroutine, or build the
# create_task double with conftest.closing_create_task().
#
# Note the second filter is broader than the first on purpose: it fails the run
# for ANY exception escaping ANY __del__, not just coroutine leaks. Read the
# reported cause before assuming a leak — if it is not "coroutine ... was never
# awaited", you have a different finalizer bug and the two coroutine fixes above
# do not apply.
filterwarnings =
    error:coroutine .* was never awaited:RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
