# ComfyUI workflow-based image generation.
#
# The graph that actually gets sent is chosen by *workflow profile* at runtime,
# not here: see ../comfyui/workflow_profiles.yaml for the registry and
# ../comfyui/README.md for how an operator switches, trials and promotes one.
#
# Leave `workflow_profile` unset to follow the registry's default_profile.
# Setting it here pins the bundle to one profile and fails the build if that
# profile is not registered.
#
# No timeout is set on purpose: the render budget belongs to the profile
# (a cold ComfyUI takes ~10.5 min to load the model from NFS before the first
# image, which the old 300s default could never survive). Setting
# `image_timeout_s` here overrides every profile — do that only to shorten a
# specific bundle deliberately.

defaults:
  base_url_env: COMFYUI_URL

bundles:
  comfyui-qwen-edit:
    image_model: qwen-image-edit-2509
    provider_options:
      # Warn when an input image is below this total pixel count.
      # 921600 = 1280*720 (expected medium-channel minimum).
      min_input_pixels: 921600
