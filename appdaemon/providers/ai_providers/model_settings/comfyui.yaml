# ComfyUI workflow-based image generation.
#
# The graph that gets sent is chosen BY NAME from the workflow registry in
# ../comfyui/workflow_registry.yaml. Two levels, both config:
#
#   * `provider_options.workflow` here — the default for every app on this
#     bundle. Omit it to follow the registry's own `default_workflow`.
#   * `ai_provider_conf.image_workflow: <name>` on a single app — overrides
#     this bundle for that app only.
#
# Either way an unregistered name stops the app at startup with the registered
# names listed; see ../comfyui/README.md for the table and how to roll back.
#
# No timeout is set on purpose: the render budget belongs to the workflow
# (a cold ComfyUI takes ~10.5 min to load the model from NFS before the first
# image, which the old 300s default could never survive). Setting
# `image_timeout_s` here overrides every workflow — do that only to shorten a
# specific bundle deliberately.

defaults:
  base_url_env: COMFYUI_URL

bundles:
  comfyui-qwen-edit:
    image_model: qwen-image-2.1
    provider_options:
      # The three-frame graph pinned to the host's second GPU, which sits in
      # the cooler slot and throttles far less (55-60 s back-to-back against
      # ~115 s on a hot gpu:0). The registry's own `default_workflow` stays the
      # GPU-agnostic `qwen-image-2.1-2609-25step-edit-3frame`, because that is
      # what a rejected graph falls back TO — if `gpu:1` ever leaves the bus,
      # ComfyUI 400s this graph and the fallback renders on gpu:0 instead.
      # To go back, set this to qwen-image-2.1-2609-25step-edit-3frame.
      workflow: qwen-image-2.1-2609-25step-edit-3frame-gpu1
      # Warn when an input image is below this total pixel count.
      # 921600 = 1280*720 (expected medium-channel minimum).
      min_input_pixels: 921600
