# AppDaemon main configuration - local dev
# Production: appdaemon.yaml and secrets.yaml come from Kubernetes Secret mounts; never baked into the Docker image.
# See: https://appdaemon.readthedocs.io/en/latest/CONFIGURE.html
#
# Dev uses apps: apps/apps-dev.yaml to load the dev app list (path relative to config dir).

appdaemon:
  time_zone: America/New_York
  latitude: 0
  longitude: 0
  elevation: 0
  plugins:
    HASS:
      type: hass
      ha_url: !secret ha_url
      token: !secret token
      ws_max_msg_size: 8388608
      ws_timeout: 60
    MQTT:
      type: mqtt
      namespace: mqtt
      client_host: !secret mqtt_host
      client_port: 1883
      client_user: !secret mqtt_user
      client_password: !secret mqtt_password
      client_topics:
        - zigbee2mqtt/#
        - appdaemon/health_check/#
http:
  url: http://0.0.0.0:5050

api:
admin: