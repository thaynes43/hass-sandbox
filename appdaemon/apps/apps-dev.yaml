# Local dev app list (AppDaemon reads this via `appdaemon/appdaemon.yaml`).
# Keep this file scoped to ONLY the app you're actively iterating on so local runs stay quiet.

calendar_hot_tub_maintenance_dev:
  module: calendar_from_schedule_app.calendar_schedule_app
  class: CalendarScheduleApp
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  schedule_dir: /mnt/cephfs-hdd/misc/hass-media/calendar-schedules
  schedule_file: hot-tub-maintenance.yaml
  calendar_entity_id: calendar.hot_tub_maintenance
  state_dir: /mnt/cephfs-hdd/misc/hass-media/calendar-schedules/sync-state
  horizon_days: 90
  sync_interval_hours: 6
