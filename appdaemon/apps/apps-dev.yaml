# Local dev app list (AppDaemon reads this via `appdaemon/appdaemon.yaml`).
# Keep this file scoped to ONLY the app you're actively iterating on so local runs stay quiet.

countdown_app_dev:
  module: countdown_app.countdown_app
  class: CountdownApp
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  ai_provider_conf:
    image: openai-default
  # Filesystem — NFS mount
  media_fs_root: /Volumes/cephfs-hdd/misc/hass-media
  media_subdir: countdown-app
  www_subdir: countdown/images
  image_sync_shell_command: countdown_sync_images
  rotation_interval_s: 15
  countdown_refresh_s: 60
