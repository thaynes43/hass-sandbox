# Local dev app list (AppDaemon reads this via `appdaemon/appdaemon.yaml`).
# Keep this file scoped to ONLY the app you're actively iterating on so local runs stay quiet.

dashboard_notify_dev:
  module: dashboard_notify.dashboard_notify_app
  class: DashboardNotify
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  media_fs_root: /mnt/cephfs-hdd/misc/hass-media
  www_subdir: dashboard-notify
  stage_shell_command: dashboard_notify_stage
  carousel_interval_s: 10
  default_ttl_s: 3600
  no_notification_refresh_s: 3600
  ai_provider_conf:
    image: gemini-default
  notifications:
    - id: school_bus_pickup
      class: BasicTextImage
      text: "Time to catch the school bus!"
      prompt_hint: "children waiting for a yellow school bus at a suburban bus stop"
      schedule: { start: "07:30", end: "09:00" }
      ttl_s: 2400
    - id: go_to_work_tom
      class: BasicTextImage
      text: "Time to head to work, Tom!"
      prompt_hint: "person getting ready for work in the morning"
      schedule: { start: "07:30", end: "08:30", days: [mon, tue, wed, thu] }
      ttl_s: 3600
  detection_summary_hook:
    enabled: true
    ttl_s: 7200
    bundle_keys: [garage, bulkhead, front_door, package, back_deck_pets, back_yard_pets, shed]
