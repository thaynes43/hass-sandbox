# Local dev app list (AppDaemon reads this via `appdaemon/appdaemon.yaml`).
# Keep this file scoped to ONLY the app you're actively iterating on so local runs stay quiet.

# --- Vestaboard Controller (no more automations: block) ---
vestaboard_controller_dev:
  module: vestaboard_apps.vestaboard_controller.vestaboard_controller_app
  class: VestaboardControllerApp
  ha_url_env: HA_URL
  ha_token_env: TOKEN
  vestaboard_ip_env: VESTABOARD_IP
  vestaboard_api_key_env: VESTABOARD_API_KEY
  tick_interval_s: 15
  frame_library_path: /mnt/cephfs-hdd/misc/hass-media/vestaboard/frame-library.json
  automation_config_path: /mnt/cephfs-hdd/misc/hass-media/vestaboard/automation-config.yaml
  sleep_window:
    enabled: true
    start: "01:00:00"
    end: "06:45:00"

# --- Configuration App ---
vestaboard_configuration_dev:
  module: vestaboard_apps.vestaboard_configuration.vestaboard_configuration_app
  class: VestaboardConfigurationApp
  dependencies:
    - vestaboard_controller_dev
  ha_url_env: HA_URL
  ha_token_env: TOKEN
  frame_library_path: /mnt/cephfs-hdd/misc/hass-media/vestaboard/frame-library.json
  creators:
    - Mom
    - Dad
    - Jackson
    - Penelope
    - Anonymous

# --- Individual Automation Apps ---
calendar_clock_dev:
  module: vestaboard_apps.automations.calendar_clock.calendar_clock_app
  class: CalendarClockApp

messages_from_library_dev:
  module: vestaboard_apps.automations.messages_from_library.messages_from_library_app
  class: MessagesFromLibraryApp
  frame_library_path: /mnt/cephfs-hdd/misc/hass-media/vestaboard/frame-library.json

art_from_library_dev:
  module: vestaboard_apps.automations.art_from_library.art_from_library_app
  class: ArtFromLibraryApp

art_generated_by_ai_dev:
  module: vestaboard_apps.automations.ai_art_generator.ai_art_generator_app
  class: AiArtGeneratorApp
  ai_provider_conf:
    simple_text: openai-pixel-art
  art_prompt_bundles_path: /mnt/cephfs-hdd/misc/hass-media/vestaboard/art-prompt-bundles.yaml

message_generated_by_ai_dev:
  module: vestaboard_apps.automations.ai_message_generator.ai_message_generator_app
  class: AiMessageGeneratorApp
  ai_provider_conf:
    simple_text: openai-default
  prompt_data_bundles_path: /mnt/cephfs-hdd/misc/hass-media/vestaboard/prompt-data-bundles.yaml

calendar_summary_family_dev:
  module: vestaboard_apps.automations.calendar_summary.calendar_summary_app
  class: CalendarSummaryApp
  calendar_entity: calendar.hayneshome01886_gmail_com
  ha_url_env: HA_URL
  ha_token_env: TOKEN

calendar_summary_hot_tub_maintenance_dev:
  module: vestaboard_apps.automations.calendar_summary.calendar_summary_app
  class: CalendarSummaryApp
  calendar_entity: calendar.hot_tub_maintenance
  ha_url_env: HA_URL
  ha_token_env: TOKEN
  ai_provider_conf:
    simple_text: openai-default

calendar_summary_holidays_dev:
  module: vestaboard_apps.automations.calendar_summary.calendar_summary_app
  class: CalendarSummaryApp
  calendar_entity: calendar.holidays_for_united_states_ma
  ha_url_env: HA_URL
  ha_token_env: TOKEN

weather_schedule_dev:
  module: vestaboard_apps.automations.weather_schedule.weather_schedule_app
  class: WeatherScheduleApp
  weather_entity: weather.forecast_home
  ha_url_env: HA_URL
  ha_token_env: TOKEN
  time_list:
    - "07:30:00"
    - "15:00:00"

# --- Health Check Apps ---
health_check_controller_dev:
  module: health_checks.controller.health_check_controller
  class: HealthCheckController
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  heartbeat_interval_s: 60
  alert_history_max: 20

zigbee_health_checker_dev:
  module: health_checks.checker_apps.network_protocol_checker.network_protocol_checker
  class: NetworkProtocolChecker
  checker_id: zigbee
  checker_name: Zigbee
  entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
  entity_healthy_state: "on"
  entity_check_name: Integration Status
  radio_host: tubeszb-zigbee01.haynesnetwork
  radio_check_name: Coordinator Ping
  web_ui_url: https://zigbee.haynesops.com
  web_ui_check_name: Web UI
  check_interval_s: 180

zwave_health_checker_dev:
  module: health_checks.checker_apps.network_protocol_checker.network_protocol_checker
  class: NetworkProtocolChecker
  checker_id: zwave
  checker_name: Z-Wave
  entity_id: sensor.800_series_long_range_gpio_module_status
  entity_healthy_state: "ready"
  entity_check_name: Integration Status
  radio_host: tubeszb-zwave01.haynesnetwork
  radio_check_name: Radio Ping
  web_ui_url: https://zwave.haynesops.com
  web_ui_check_name: Web UI
  check_interval_s: 180

spa_health_checker_dev:
  module: health_checks.checker_apps.spa_health_checker.spa_health_checker
  class: SpaHealthChecker
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  checker_id: spa
  checker_name: Spa
  gateway_host: "192.168.0.163"
  connection_entities:
    - binary_sensor.haynes_spa_overall_connection
    - binary_sensor.haynes_spa_transport_connection
  staleness_entity: climate.haynes_spa_thermostat_1
  staleness_threshold_s: 300
  repair_switch: switch.power_distribution_hi_density_hot_tub
  repair_recovery_wait_s: 300
  check_interval_s: 120
  auto_repair_enabled_default: false
  auto_repair_delay_min_default: 5

vestaboard_health_checker_dev:
  module: health_checks.checker_apps.basic_device_checker.basic_device_checker
  class: BasicDeviceChecker
  checker_id: vestaboard
  checker_name: Vestaboard
  ping_host: "192.168.50.159"
  ping_check_name: Ping
  check_interval_s: 180
  entities:
    - entity_id: sensor.vestaboard_controller_status
      healthy_state: active
      name: Controller Status
    - entity_id: sensor.vestaboard_configuration_status
      healthy_state: ok
      name: Configuration Status

fan_health_checker_dev:
  module: health_checks.checker_apps.fan_health_checker.fan_health_checker
  class: FanHealthChecker
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  checker_id: fans
  checker_name: Fans
  check_interval_s: 180
  repair_recovery_wait_s: 300
  auto_repair_enabled_default: false
  auto_repair_delay_min_default: 5
  repair_script: script.zen32_hard_reset
  fans:
    - name: Pink Room
      entity_id: fan.pink_room_fan_fan
      ip: "192.168.50.112"
      power_switch: switch.upstairs_pink_room_scene_controller
      relay_control: select.upstairs_pink_room_scene_controller_relay_control
      scene_control: select.upstairs_pink_room_scene_controller_scene_control_relay
    - name: Blue Room
      entity_id: fan.blue_room_fan_fan
      ip: "192.168.50.134"
      power_switch: switch.upstairs_blue_room_scene_controller
      relay_control: select.upstairs_blue_room_scene_controller_relay_control
      scene_control: select.upstairs_blue_room_scene_controller_scene_control_relay
    - name: White Room
      entity_id: fan.white_room_fan_fan
      ip: "192.168.50.187"
      power_switch: switch.upstairs_white_room_scene_controller
      relay_control: select.upstairs_white_room_scene_controller_relay_control
      scene_control: select.upstairs_white_room_scene_controller_scene_control_relay
    - name: Primary Bedroom
      entity_id: fan.primary_bedroom_fan_fan
      ip: "192.168.50.146"
      power_switch: switch.upstairs_primary_bedroom_scene_controller
      relay_control: select.upstairs_primary_bedroom_scene_controller_relay_control
      scene_control: select.upstairs_primary_bedroom_scene_controller_scene_control_relay
    - name: Living Room
      entity_id: fan.livingroom_fan_fan
      ip: "192.168.50.148"
      power_switch: switch.downstairs_livingroom_scene_controller
      relay_control: select.downstairs_livingroom_scene_controller_relay_control
      scene_control: select.downstairs_livingroom_scene_controller_scene_control_relay
    - name: Study
      entity_id: fan.study_fan_fan
      ip: "192.168.50.179"
      power_switch: switch.downstairs_study_scene_controller
      relay_control: select.downstairs_study_scene_controller_relay_control
      scene_control: select.downstairs_study_scene_controller_scene_control_relay
