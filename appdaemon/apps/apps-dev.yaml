# Local dev app list (AppDaemon reads this via `appdaemon/appdaemon.yaml`).
# Keep this file scoped to ONLY the app you're actively iterating on so local runs stay quiet.

immich_fetcher_dev:
  module: immich_fetcher.immich_fetcher_app
  class: ImmichFetcherApp
  ha_url: !secret ha_url
  ha_token: !secret token
  immich_url: !secret immich_url
  immich_api_key: !secret immich_api_key
  output_dir: /mnt/cephfs-hdd/misc/hass-media/immich-photos
  config_file: /mnt/cephfs-hdd/misc/hass-media/immich-fetcher/config.json
  update_interval_minutes: 60
  num_photos: 10
  download_quality: preview
  default_filters:
    - name: Random
      selection: all_photos

photo_frame_viewer_wall_display_dev:
  module: photo_frame_viewer.photo_frame_viewer_app
  class: PhotoFrameViewerApp
  ha_url: !secret ha_url
  ha_token: !secret token
  source_dir: /mnt/cephfs-hdd/misc/hass-media/immich-photos
  ha_source_dir: /media/immich-photos
  ha_local_url_base: /local/photo-frame/live
  stage_shell_command: photo_frame_stage_gen
  cleanup_shell_command: photo_frame_cleanup_gen
  source_poll_interval_s: 30
  stage_settle_delay_s: 3
  fallback_image_path: /mnt/cephfs-hdd/misc/hass-media/immich-photos/no-image.jpg
  options_max: 50
  refresh_options_every_s: 60
  auto_cycle: true
  default_interval_s: 10
  state_dir: /mnt/cephfs-hdd/misc/hass-media/photo-frame-viewer/wall_display
