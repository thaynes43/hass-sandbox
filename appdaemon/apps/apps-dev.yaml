# Local dev app list (AppDaemon reads this via `appdaemon/appdaemon.yaml`).
# Keep this file scoped to ONLY the app you're actively iterating on so local runs stay quiet.

garage_door_notify_dev:
  module: door_notify
  class: DoorNotify
  notify_services:
    - notify.mobile_app_toms_iphone_15_pro
    - notify.mobile_app_toms_iphone_air
    - notify.mobile_app_kellies_iphone_air
  doors:
    - cover.ratgdov25i_4a0325_door
    - cover.ratgdov25i_dbfa50_door
  # door_open_state/door_closed_state default to "open"/"closed" for cover entities
  ai_enabled: true
  ai_bundle_key: garage
  ai_wait_timeout_s: 180
  ai_max_bundle_age_s: 900

detection_summary_garage_dev:
  module: detection_summary_app.manager
  class: DetectionSummary
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  bundle_key: garage
  snapshot_ha_dir: /media/detection-summary/garage
  media_fs_root: !secret media_fs_root
  hass_entities:
    camera_entity_id: camera.garage_g5_dome_medium_resolution_channel
    trigger_entity_id: binary_sensor.g5_dome_motion
    best_image_camera_entity_id: camera.garage_detection_summary_best
    generated_image_camera_entity_id: camera.garage_detection_summary_generated
  data_instructions: >
    You are analyzing ONE security camera snapshot for a push notification.
    Focus ONLY on the people and any animals (ignore the environment/vehicles/objects
    unless it is directly relevant).
    The summary should be short and notification-friendly: 1 sentence, <= 140 characters.
    Include only: person/animal count, what they are doing, and where they are in
    frame (e.g. "near left", "center", "back").
    Also return male_count and female_count as integer counts of people by gender
    (0 if none).
    Also return animal_count as an integer count of visible animals/pets (0 if none).
    Return scores on a 0-10 scale (integers preferred) with enough spread to rank
    frames.
    Heavily favor frames where at least one person's FACE is clearly visible (front/3-4
    view, not fully occluded).
    If no face is visible, the frame should score significantly lower than a similar
    frame with a visible face.
    face_score meaning: 0=no face visible, 10=clear unobstructed face (ideally looking
    toward camera).
    Prefer frames where the person is clearly visible and stationary (standing/sitting),
    not partially occluded or blurred in motion.
    If animals are present and clearly visible, increase frame_score appropriately.
  image_instructions: >
    Create a simple, clean illustration representing the scene for a notification.
  ai_provider_conf:
    simple_text: openai-default
    multimodal: openai-default
    image: openai-default

detection_viewer_garage_dev:
  module: detection_summary_viewer.detection_summary_viewer_app
  class: DetectionSummaryViewer
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  bundle_key: garage
  snapshot_ha_dir: /media/detection-summary/garage
  media_fs_root: !secret media_fs_root
  hass_entities:
    selected_best_image_camera_entity_id: camera.garage_detection_summary_selected_best
    selected_generated_image_camera_entity_id: camera.garage_detection_summary_selected_generated
  notification_action_prefix: "GARAGE_DS_VIEW"

bulkhead_door_notify_dev:
  module: door_notify
  class: DoorNotify
  notify_services:
    - notify.mobile_app_toms_iphone_air
  doors:
    - binary_sensor.usl_entry_contact
  door_open_state: "on"
  door_closed_state: "off"
  ai_enabled: true
  ai_bundle_key: bulkhead
  ai_wait_timeout_s: 180
  ai_max_bundle_age_s: 900
  notification_url: "/detection-summary/bulkhead"

detection_summary_bulkhead_dev:
  module: detection_summary_app.manager
  class: DetectionSummary
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  bundle_key: bulkhead
  snapshot_ha_dir: /media/detection-summary/bulkhead
  media_fs_root: !secret media_fs_root
  hass_entities:
    camera_entity_id: camera.basement_g5_dome_ultra_medium_resolution_channel
    trigger_entity_id: binary_sensor.basement_g5_dome_ultra_motion
    best_image_camera_entity_id: camera.bulkhead_detection_summary_best
    generated_image_camera_entity_id: camera.bulkhead_detection_summary_generated
  data_instructions: >
    You are analyzing ONE security camera snapshot from a basement bulkhead entrance.
    Focus ONLY on the people and any animals (ignore the environment/vehicles/objects
    unless it is directly relevant).
    The summary should be short and notification-friendly: 1 sentence, <= 140 characters.
    Include only: person/animal count, what they are doing, and where they are in
    frame (e.g. "near left", "center", "back").
    Do NOT describe or name any branded merchandise, collectible figurines, licensed
    characters, or copyrighted items visible in the background. Treat them as generic
    "decorative items" or "shelf items" if you must reference them at all.
    Also return male_count and female_count as integer counts of people by gender
    (0 if none).
    Also return animal_count as an integer count of visible animals/pets (0 if none).
    Return scores on a 0-10 scale (integers preferred) with enough spread to rank
    frames.
    Heavily favor frames where at least one person's FACE is clearly visible (front/3-4
    view, not fully occluded).
    If no face is visible, the frame should score significantly lower than a similar
    frame with a visible face.
    face_score meaning: 0=no face visible, 10=clear unobstructed face (ideally looking
    toward camera).
    Prefer frames where the person is clearly visible and stationary (standing/sitting),
    not partially occluded or blurred in motion.
    If animals are present and clearly visible, increase frame_score appropriately.
  image_instructions: >
    Create a simple, clean illustration representing the scene at a basement entrance.
    IMPORTANT: The background may contain collectible figurines, branded merchandise, or
    licensed characters on shelves. You MUST NOT reproduce any recognizable branded,
    trademarked, or copyrighted characters, logos, or products. Replace any such items
    with generic alternatives (plain toys, abstract shapes, unlabeled objects). Focus
    the illustration on the PEOPLE and their actions, not background objects.
  debug_preserve_run_dirs: true
  ai_provider_conf:
    simple_text: gemini-default
    multimodal: gemini-default
    image: gemini-default

detection_viewer_bulkhead_dev:
  module: detection_summary_viewer.detection_summary_viewer_app
  class: DetectionSummaryViewer
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  bundle_key: bulkhead
  snapshot_ha_dir: /media/detection-summary/bulkhead
  media_fs_root: !secret media_fs_root
  hass_entities:
    selected_best_image_camera_entity_id: camera.bulkhead_detection_summary_selected_best
    selected_generated_image_camera_entity_id: camera.bulkhead_detection_summary_selected_generated
  notification_action_prefix: "BULKHEAD_DS_VIEW"

