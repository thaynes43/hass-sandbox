# Local dev app list (AppDaemon reads this via `appdaemon/appdaemon.yaml`).
# Keep this file scoped to ONLY the app you're actively iterating on so local runs stay quiet.

# --- Health Check Apps ---
health_check_controller_dev:
  module: health_checks.controller.health_check_controller
  class: HealthCheckController
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  heartbeat_interval_s: 60
  alert_history_max: 50
  alert_retention: "1:12:00:00"

zigbee_health_checker_dev:
  module: health_checks.checker_apps.network_protocol_checker.network_protocol_checker
  class: NetworkProtocolChecker
  checker_id: zigbee
  checker_name: Zigbee
  entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
  entity_healthy_state: "on"
  entity_check_name: Integration Status
  radio_host: tubeszb-zigbee01.haynesnetwork
  radio_check_name: Coordinator Ping
  web_ui_url: https://zigbee.haynesops.com
  web_ui_check_name: Web UI
  check_interval_s: 180
  health_dependencies:
    - checker_id: mqtt_broker

zwave_health_checker_dev:
  module: health_checks.checker_apps.network_protocol_checker.network_protocol_checker
  class: NetworkProtocolChecker
  checker_id: zwave
  checker_name: Z-Wave
  entity_id: sensor.800_series_long_range_gpio_module_status
  entity_healthy_state: "ready"
  entity_check_name: Integration Status
  radio_host: tubeszb-zwave01.haynesnetwork
  radio_check_name: Radio Ping
  web_ui_url: https://zwave.haynesops.com
  web_ui_check_name: Web UI
  check_interval_s: 180

spa_health_checker_dev:
  module: health_checks.checker_apps.spa_health_checker.spa_health_checker
  class: SpaHealthChecker
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  checker_id: spa
  checker_name: Spa
  gateway_host: "192.168.0.163"
  connection_entities:
    - binary_sensor.haynes_spa_overall_connection
  staleness_entity: climate.haynes_spa_thermostat_1
  staleness_threshold_s: 300
  repair_switch: switch.power_distribution_hi_density_hot_tub
  repair_recovery_wait_s: 300
  check_interval_s: 120
  auto_repair_enabled_default: false
  auto_repair_delay_min_default: 5
  health_dependencies:
    - checker_id: cloud

cielo_health_checker_dev:
  module: health_checks.checker_apps.device_group_checker.device_group_checker
  class: DeviceGroupChecker
  checker_id: cielo
  checker_name: Cielo
  check_interval_s: 180
  health_dependencies:
    - checker_id: cloud
  devices:
    - name: Movie Room
      ip: "192.168.50.102"
      entities:
        - entity_id: binary_sensor.movie_room_breeze_status
          healthy_state: "on"
          name: Status
    - name: Rumpus Room
      ip: "192.168.50.192"
      entities:
        - entity_id: binary_sensor.rumpus_room_breeze_status
          healthy_state: "on"
          name: Status

vestaboard_health_checker_dev:
  module: health_checks.checker_apps.device_checker.device_checker
  class: BasicDeviceChecker
  checker_id: vestaboard
  checker_name: Vestaboard
  ping_host: "192.168.50.159"
  ping_check_name: Ping
  check_interval_s: 180
  entities:
    - entity_id: sensor.vestaboard_controller_status
      healthy_state: active
      name: Controller Status
    - entity_id: sensor.vestaboard_configuration_status
      healthy_state: ok
      name: Configuration Status

printer_health_checker_dev:
  module: health_checks.checker_apps.device_checker.repairable_device_checker
  class: RepairableDeviceChecker
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  checker_id: printer
  checker_name: Printer
  ping_host: "192.168.0.211"
  ping_check_name: Ping
  check_interval_s: 180
  repair_switch: switch.downstairs_study_printer_switch
  repair_recovery_wait_s: 300
  repair_off_duration_s: 10
  auto_repair_enabled_default: false
  auto_repair_delay_min_default: 5
  entities:
    - entity_id: sensor.brother_mfc_l3780cdw_series
      name: Status

cigar_humidity_checker_dev:
  module: health_checks.checker_apps.temp_humidity_checker.temp_humidity_checker
  class: TempHumidityChecker
  checker_id: cigar_humidity
  checker_name: Cigars
  check_interval_s: 120
  humidity_low_warning: 62
  humidity_high_warning: 68
  humidity_low_critical: 60
  humidity_high_critical: 70
  sensors:
    - entity_id: sensor.cigar_humidity_sensor_01_humidity
      name: Tupperdor 01
      type: humidity
      dependency: zwave
    - entity_id: sensor.cigar_humidity_sensor_02_humidity
      name: Tupperdor 02
      type: humidity
      dependency: zwave
    - entity_id: sensor.cigar_humidity_sensor_03_humidity
      name: Jar 01
      type: humidity
      dependency: zwave
    - entity_id: sensor.cigar_humidity_sensor_04_humidity
      name: Jar 02
      type: humidity
      dependency: zwave
    - entity_id: sensor.cigar_humidity_sensor_05_humidity
      name: Cooler
      type: humidity
      dependency: zwave
    - entity_id: sensor.cigar_humidity_sensor_06_humidity
      name: Tupperdor 03
      type: humidity
      dependency: zwave
    - entity_id: sensor.cigar_humidity_sensor_07_humidity
      name: Tupperdor 04
      type: humidity
      dependency: zwave
    - entity_id: sensor.basement_aqara_w100_01_humidity
      name: MON1800
      type: humidity
      dependency: zigbee
    - entity_id: sensor.basement_aqara_w100_02_humidity
      name: MA50
      type: humidity
      dependency: zigbee

fan_health_checker_dev:
  module: health_checks.checker_apps.fan_health_checker.fan_health_checker
  class: FanHealthChecker
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  checker_id: fans
  checker_name: Ceiling Fans
  check_interval_s: 180
  repair_recovery_wait_s: 300
  auto_repair_enabled_default: false
  auto_repair_delay_min_default: 5
  repair_script: script.zen32_hard_reset
  fans:
    - name: Pink Room
      entity_id: fan.pink_room_fan_fan
      ip: "192.168.50.112"
      power_switch: switch.upstairs_pink_room_scene_controller
      relay_control: select.upstairs_pink_room_scene_controller_relay_control
      scene_control: select.upstairs_pink_room_scene_controller_scene_control_relay
    - name: Blue Room
      entity_id: fan.blue_room_fan_fan
      ip: "192.168.50.134"
      power_switch: switch.upstairs_blue_room_scene_controller
      relay_control: select.upstairs_blue_room_scene_controller_relay_control
      scene_control: select.upstairs_blue_room_scene_controller_scene_control_relay
    - name: White Room
      entity_id: fan.white_room_fan_fan
      ip: "192.168.50.187"
      power_switch: switch.upstairs_white_room_scene_controller
      relay_control: select.upstairs_white_room_scene_controller_relay_control
      scene_control: select.upstairs_white_room_scene_controller_scene_control_relay
    - name: Primary Bedroom
      entity_id: fan.primary_bedroom_fan_fan
      ip: "192.168.50.146"
      power_switch: switch.upstairs_primary_bedroom_scene_controller
      relay_control: select.upstairs_primary_bedroom_scene_controller_relay_control
      scene_control: select.upstairs_primary_bedroom_scene_controller_scene_control_relay
    - name: Living Room
      entity_id: fan.livingroom_fan_fan
      ip: "192.168.50.148"
      power_switch: switch.downstairs_livingroom_scene_controller
      relay_control: select.downstairs_livingroom_scene_controller_relay_control
      scene_control: select.downstairs_livingroom_scene_controller_scene_control_relay
    - name: Study
      entity_id: fan.study_fan_fan
      ip: "192.168.50.179"
      power_switch: switch.downstairs_study_scene_controller
      relay_control: select.downstairs_study_scene_controller_relay_control
      scene_control: select.downstairs_study_scene_controller_scene_control_relay

cloud_checker_dev:
  module: health_checks.checker_apps.cloud_checker.cloud_checker
  class: CloudChecker
  checker_id: cloud
  checker_name: Cloud
  check_interval_s: 120
  force_fail: false
  checks:
    - url: https://www.google.com
      name: Google

mqtt_broker_checker_dev:
  module: health_checks.checker_apps.mqtt_broker_checker.mqtt_broker_checker
  class: MqttBrokerChecker
  checker_id: mqtt_broker
  checker_name: MQTT Broker
  check_interval_s: 120
  ping_timeout_s: 10
  mqtt_namespace: mqtt
  ping_topic: appdaemon/health_check/ping

basement_lights_checker_dev:
  module: health_checks.checker_apps.mqtt_device_checker.mqtt_device_checker
  class: MqttDeviceChecker
  checker_id: basement_lights
  checker_name: Basement Lights
  check_interval_s: 300
  mqtt_stale_s: 21600
  mqtt_namespace: mqtt
  protocol_dependency_id: zigbee
  health_dependencies:
    - checker_id: mqtt_broker
  entity_patterns:
    - include: "(light|switch)\\.basement.*inovelli.*"
    - include: "light\\.basement.*hue.*\\d+$"
    - exclude: ".*night_light.*"

downstairs_lights_checker_dev:
  module: health_checks.checker_apps.mqtt_device_checker.mqtt_device_checker
