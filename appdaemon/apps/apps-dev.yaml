# Local dev app list (AppDaemon reads this via `appdaemon/appdaemon.yaml`).
# Keep this file scoped to ONLY the app you're actively iterating on so local runs stay quiet.

countdown_app_dev:
  module: countdown_app.countdown_app
  class: CountdownApp
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  ai_provider_conf:
    image: openai-countdown
  # Filesystem — NFS mount
  media_fs_root: /Volumes/cephfs-hdd/misc/hass-media
  media_subdir: countdown-app
  www_subdir: countdown/images
  image_sync_shell_command: countdown_sync_images
  rotation_interval_s: 15
  countdown_refresh_s: 60

shade_gateway_checker_dev:
  module: health_checks.checker_apps.shade_gateway_checker.shade_gateway_checker
  class: ShadeGatewayChecker
  ha_url: !secret ha_url
  ha_token_env: TOKEN
  checker_id: shade_gateway_dev
  checker_name: Shade Gateway (Dev)
  check_interval_s: 300
  entity_patterns:
    - include: "sensor\\..*shade.*_battery$"
  disconnect_low_threshold: 5
  healthy_floor: 40
  recovery_settle_s: 900
  repair_button: button.switch_pro_max_48_poe_port_32_power_cycle
  repair_settle_s: 180
  repair_recovery_wait_s: 900
  auto_repair_enabled_default: true
  auto_repair_delay_min_default: 120

ac_mains_checker_dev:
  module: health_checks.checker_apps.ac_mains_checker.ac_mains_checker
  class: AcMainsChecker
  checker_id: ac_mains_dev
  checker_name: AC Mains (Dev)
  check_interval_s: 300
  disconnected_status: critical
  health_dependencies:
    - checker_id: zwave
  entity_patterns:
    - include: "binary_sensor\\..*_ac_mains_disconnected$"
    - exclude: ".*qsensor.*"
    - exclude: ".*shed_indoor_motion_sensor.*"
