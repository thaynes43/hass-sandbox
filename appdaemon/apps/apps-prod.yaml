  stage_shell_command: dashboard_notify_stage
  carousel_interval_s: 10
  default_ttl_s: 3600
  no_notification_refresh_s: 3600
  notification_text_target_chars: 180
  notification_text_truncate_suffix: "..."
  ai_provider_conf:
    image: gemini-default
  notifications:
    - id: school_bus_pickup
      class: BasicTextImage
      text: "Time to catch the school bus!"
      prompt_hint: "children waiting for a yellow school bus at a suburban bus stop"
      schedule: { start: "08:20", end: "09:00" }
      ttl_s: 2400
    - id: go_to_work_tom
      class: BasicTextImage
      text: "Time to head to work, Tom!"
      prompt_hint: "person getting ready for work in the morning"
      schedule: { start: "07:30", end: "08:30", days: [mon, tue, wed, thu] }
      ttl_s: 3600
    - id: school_bus_dropoff
      class: BasicTextImage
      text: "School bus arriving soon!"
      prompt_hint: "school bus dropping off children in a neighborhood"
      schedule: { start: "15:00", end: "15:30" }
      ttl_s: 1800
    - id: no_more_snacks
      class: FunPictureImage
      text: "No more snacks! Kitchen is closed."
      prompt_hint: "funny closed kitchen sign with a padlock on the fridge"
      schedule: { start: "21:30", end: "01:00" }
      ttl_s: 12600
