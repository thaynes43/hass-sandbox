  - type: markdown
    content: |
      #### Mudroom mmWave Clear Timing
  - type: grid
    columns: 2
    square: false
    cards:
      - type: markdown
        content: >-
          **MmWave Hold Time**


          With Firmware Local Control **Disabled** this no longer drives the
          load — it now only governs how long the switch keeps **reporting
          occupancy** after presence stops.

          Value is in **seconds** (e.g. **5 = 5s**). Default is **10s**.
      - type: markdown
        content: >-
          **MmWave Stay Life**


          How long the “stay” area lingers after motion stops (affects how
          quickly the switch reports **cleared**).

          Default is **300** (≈15s). Lower values can be sub-second
          (e.g. **1 ≈ 50ms**, **20 ≈ 1s**).
      - type: tile
        entity: number.garage_interior_mudroom_inovelli_presence_mmwaveholdtime
        name: Hold Time (s)
        vertical: false
        hide_state: true
        tap_action:
          action: none
        hold_action:
          action: more-info
        features:
          - type: numeric-input
            style: buttons
        features_position: inline
      - type: tile
        entity: number.garage_interior_mudroom_inovelli_presence_mmwavestaylife
        name: Stay Life
        vertical: false
        hide_state: true
        tap_action:
          action: none
        hold_action:
          action: more-info
        features:
          - type: numeric-input
            style: buttons
        features_position: inline
      - type: entities
        entities:
          - entity: number.garage_interior_mudroom_inovelli_presence_mmwaveholdtime
            name: Hold Time (s)
      - type: entities
        entities:
          - entity: number.garage_interior_mudroom_inovelli_presence_mmwavestaylife
            name: Stay Life

