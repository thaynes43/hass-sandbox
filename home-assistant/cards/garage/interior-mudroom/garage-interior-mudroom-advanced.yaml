type: custom:bubble-card
card_type: pop-up
hash: "#garage-interior-mudroom-advanced"
button_type: name
width_desktop: 75vw
show_header: true
name: Return to Overview
show_icon: true
icon: mdi:arrow-left
show_name: true
margin: 7px
scrolling_effect: false
sub_button:
  main: []
  bottom:
    - name: Back
      icon: mdi:arrow-left
      show_name: true
      show_icon: true
      tap_action:
        action: navigate
        navigation_path: "#garage-interior-mudroom-history"
tap_action:
  action: navigate
  navigation_path: "#garage-interior-mudroom-history"
button_action:
  tap_action:
    action: navigate
    navigation_path: "#garage-interior-mudroom-history"
cards:
  - type: markdown
    content: |
      ## Garage - Sensors

  - type: markdown
    content: |
      ### Room behavior

      - **Mudroom** carries the load; **Side** (back yard door) reads **0 W** by design.
      - **Firmware Local Control**: **Disabled** on both — HA owns turn-off, not the switch.
      - **Min-On Floor**: 5 min from every turn-on; while *active* nothing turns the lights off.
      - Turn-off needs both mmWave clear, **G5 Dome** clear, floor *idle*, no hold — then the **Zone Off Delay**.
      - **Side** is outside the hold/LED machinery by design: parameters here, no hold buttons.

  - type: custom:bubble-card
    card_type: sub-buttons
    show_header_toggle: false
    sub_button:
      main: []
      bottom:
        - name: Lux
          buttons_layout: inline
          group:
            - entity: sensor.garage_interior_mudroom_inovelli_presence_illuminance
              name: Mudroom Lux
              icon: mdi:brightness-6
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
            - entity: sensor.garage_interior_side_inovelli_presence_illuminance
              name: Side Lux
              icon: mdi:brightness-6
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
        - name: Power
          buttons_layout: inline
          group:
            - entity: sensor.garage_interior_mudroom_inovelli_presence_power
              name: Mudroom Power
              icon: mdi:flash
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
            - entity: sensor.garage_interior_side_inovelli_presence_power
              name: Side Power
              icon: mdi:flash
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
        - name: Overheat
          buttons_layout: inline
          group:
            - entity: sensor.garage_interior_mudroom_inovelli_presence_overheat
              name: Mudroom Overheat
              icon: mdi:thermometer-alert
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
            - entity: sensor.garage_interior_side_inovelli_presence_overheat
              name: Side Overheat
              icon: mdi:thermometer-alert
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
        - name: Switch Temp
          buttons_layout: inline
          group:
            - entity: sensor.garage_interior_mudroom_inovelli_presence_internaltemperature
              name: Mudroom Temp
              icon: mdi:thermometer
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
            - entity: sensor.garage_interior_side_inovelli_presence_internaltemperature
              name: Side Temp
              icon: mdi:thermometer
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
      bottom_layout: rows
    rows: 4.5

  - type: markdown
    content: |
      ## HA Timing

  - type: grid
    columns: 2
    square: false
    cards:
      - type: markdown
        content: >-
          **Min-On Floor**


          A hard gate: while `timer.garage_interior_lights_floor` is **active**
          nothing turns the lights off.

          Armed for **5 minutes** on every off→on of the group and on every
          mmWave presence trigger, so walking back in restarts it rather than
          stacking another 5 minutes.
      - type: markdown
        content: >-
          **Zone Off Delay**


          The grace period the off automation waits *after* every gate has
          cleared, before it actually turns the group off.

          Shared by the whole garage zone (`input_select.garage_occupancy_off_delay`
          — no per-switch infix). Every gate is re-checked when it elapses.
      - type: entities
        entities:
          - entity: timer.garage_interior_lights_floor
            name: Min-On Floor
      - type: entities
        entities:
          - entity: input_select.garage_occupancy_off_delay
            name: Zone Off Delay

