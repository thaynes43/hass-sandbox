type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#wall-display-garage-doors"
    button_type: name
    width_desktop: 75vw
    show_header: true
    name: Wall Display - Return to Dashboard
    show_icon: true
    icon: mdi:arrow-left
    show_name: true
    margin: 7px
    scrolling_effect: false
    sub_button:
      main: []
      bottom:
        - name: Back
          icon: mdi:arrow-left
          show_name: true
          show_icon: true
          tap_action:
            action: navigate
            navigation_path: "#"
    tap_action:
      action: navigate
      navigation_path: "#"
    button_action:
      tap_action:
        action: navigate
        navigation_path: "#"

  - type: markdown
    text_only: true
    card_mod:
      style: |
        ha-card {
          padding: 8px 14px;
        }
        ha-markdown {
          color: rgba(240, 243, 255, 0.92) !important;
          font-size: 0.94rem;
          line-height: 1.45;
        }
    content: |
      {% set tesla = 'cover.ratgdov25i_4a0325_door' %}
      **Tesla Garage Door:** {% if is_state(tesla, 'closed') %}Closed {{ as_local(states[tesla].last_changed).strftime('%I:%M %p on %m/%d') }}{% elif is_state(tesla, 'open') %}Open for {{ relative_time(states[tesla].last_changed) }}{% else %}{{ states(tesla) }}{% endif %}

  - type: custom:bubble-card
    card_type: sub-buttons
    show_header_toggle: false
    rows: 1.3
    styles: |-
      @keyframes garageMovePulse {
        0% { opacity: 1; }
        50% { opacity: 0.78; }
        100% { opacity: 1; }
      }
      .bubble-sub-button-1 {
        background: ${(() => {
          const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
          if (s === 'closed') return 'rgba(76, 88, 132, 0.42)';
          if (s === 'closing') return 'rgba(75, 108, 160, 0.48)';
          return 'rgba(255, 255, 255, 0.08)';
        })()} !important;
        animation: ${(() => {
          const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
          return s === 'closing' ? 'garageMovePulse 1s ease-in-out infinite' : 'none';
        })()} !important;
      }
      .bubble-sub-button-2 {
        background: rgba(72, 72, 82, 0.28) !important;
      }
      .bubble-sub-button-3 {
        background: ${(() => {
          const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
          if (s === 'open') return 'rgba(138, 98, 76, 0.46)';
          if (s === 'opening') return 'rgba(75, 108, 160, 0.48)';
          return 'rgba(255, 255, 255, 0.08)';
        })()} !important;
        animation: ${(() => {
          const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
          return s === 'opening' ? 'garageMovePulse 1s ease-in-out infinite' : 'none';
        })()} !important;
      }
    sub_button:
      main: []
      bottom:
        - name: Tesla Garage Door
          buttons_layout: inline
          group:
            - entity: cover.ratgdov25i_4a0325_door
              name: Close
              icon: mdi:arrow-down-bold
              show_name: false
              show_state: false
              show_icon: true
              scrolling_effect: false
              content_layout: icon-top
              custom_height: 60
              tap_action:
                action: call-service
                service: cover.close_cover
                target:
                  entity_id: cover.ratgdov25i_4a0325_door
            - entity: cover.ratgdov25i_4a0325_door
              name: Stop
              icon: mdi:stop
              show_name: false
              show_state: false
              show_icon: true
              scrolling_effect: false
              content_layout: icon-top
              custom_height: 60
              tap_action:
                action: call-service
                service: cover.stop_cover
                target:
                  entity_id: cover.ratgdov25i_4a0325_door
            - entity: cover.ratgdov25i_4a0325_door
              name: Open
              icon: mdi:arrow-up-bold
              show_name: false
              show_state: false
              show_icon: true
              scrolling_effect: false
              content_layout: icon-top
              custom_height: 60
              tap_action:
                action: call-service
                service: cover.open_cover
                target:
                  entity_id: cover.ratgdov25i_4a0325_door
      bottom_layout: rows

  - type: markdown
    text_only: true
    card_mod:
      style: |
        ha-card {
          padding: 8px 14px;
        }
        ha-markdown {
          color: rgba(240, 243, 255, 0.92) !important;
          font-size: 0.94rem;
          line-height: 1.45;
        }
    content: |
