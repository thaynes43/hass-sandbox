                  action: more-info
                button_action:
                  tap_action:
                    action: toggle
                slider_fill_orientation: left
                slider_value_position: right
              - type: custom:bubble-card
                card_type: button
                button_type: name
                entity: light.upstairs_foyer_chaos_inovelli_presence
                name: Chaos Light
                icon: mdi:lightbulb
                show_state: true
