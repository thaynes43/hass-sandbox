type: vertical-stack
cards:
  - type: markdown
    text_only: true
    card_mod:
      style: |
        ha-card {
          border-radius: 28px;
          padding: 10px 18px 12px;
          background: var(--ha-card-background, var(--card-background-color));
          border: none;
          box-shadow: none;
        }
        h2 {
          margin: 0 0 8px;
          color: var(--primary-text-color);
          font-size: 1.15rem;
          font-weight: 650;
          letter-spacing: 0.01em;
        }
        p {
          margin: 0;
          color: var(--secondary-text-color);
          line-height: 1.35;
          font-size: 0.95rem;
        }
        p + p {
          margin-top: 6px;
        }
        strong {
          color: var(--primary-text-color);
          font-weight: 600;
        }
    content: |
      ## Kitchen & Dining

      <p><strong>Kitchen</strong> {{ states('sensor.downstairs_kitchen_sink_inovelli_presence_illuminance') }} lx, Shade {{ states('cover.kitchen_shade') | title }}, Sonos {{ states('media_player.kitchen') | title }}</p>
      <p><strong>Dining</strong> {{ states('sensor.ecobee_dining_room_sensor_temperature') | float(0) | round(0) }}&deg;F, Table Light {{ states('light.downstairs_dining_room_table_light') | title }}, Shades {{ states('cover.dining_room_shades') | title }}</p>
  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: light.downstairs_kitchen_lights
        name: Kitchen Main Lights
        icon: mdi:light-recessed
        show_state: true
        show_attribute: true
        attribute: brightness
        allow_light_slider_to_0: true
        tap_action:
          action: more-info
        button_action:
          tap_action:
            action: toggle
        slider_fill_orientation: left
        slider_value_position: right
      - type: custom:bubble-card
        card_type: button
        button_type: name
        entity: cover.kitchen_shade
        name: Kitchen Shade
        show_state: true
        rows: 1.719
        card_layout: large-sub-buttons-grid
        button_action:
          tap_action:
            action: more-info
        sub_button:
          main: []
          bottom:
            - entity: scene.laundry_gateway_kitchen_tilt_open
              name: Tilt Open
              icon: mdi:blinds-horizontal
              show_name: true
              show_icon: true
              show_state: false
              tap_action:
                action: call-service
                service: scene.turn_on
                target:
                  entity_id: scene.laundry_gateway_kitchen_tilt_open
            - entity: scene.laundry_gateway_kitchen_open
              name: Open
              icon: mdi:arrow-up-bold
              show_name: true
              show_icon: true
              show_state: false
              tap_action:
                action: call-service
                service: scene.turn_on
                target:
                  entity_id: scene.laundry_gateway_kitchen_open
            - entity: scene.laundry_gateway_kitchen_close
              name: Close
              icon: mdi:arrow-down-bold
              show_name: true
              show_icon: true
              show_state: false
              tap_action:
                action: call-service
                service: scene.turn_on
                target:
                  entity_id: scene.laundry_gateway_kitchen_close
          bottom_layout: rows
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: light.downstairs_dining_room_table_light
        name: Dining Main Light
        icon: mdi:ceiling-light
        show_state: true
        show_attribute: true
        attribute: brightness
        allow_light_slider_to_0: true
        tap_action:
          action: more-info
        button_action:
          tap_action:
            action: toggle
        slider_fill_orientation: left
        slider_value_position: right
      - type: custom:bubble-card
        card_type: button
        button_type: name
        entity: cover.dining_room_shades
        name: Dining Shades
        show_state: true
        rows: 1.719
        card_layout: large-sub-buttons-grid
        button_action:
          tap_action:
            action: more-info
        sub_button:
          main: []
          bottom:
            - entity: scene.laundry_gateway_dining_room_tilt_open
              name: Tilt Open
              icon: mdi:blinds-horizontal
              show_name: true
              show_icon: true
              show_state: false
              tap_action:
                action: call-service
                service: scene.turn_on
                target:
                  entity_id: scene.laundry_gateway_dining_room_tilt_open
            - entity: scene.laundry_gateway_dining_room_open
              name: Open
              icon: mdi:arrow-up-bold
              show_name: true
              show_icon: true
              show_state: false
              tap_action:
                action: call-service
                service: scene.turn_on
                target:
                  entity_id: scene.laundry_gateway_dining_room_open
            - entity: scene.laundry_gateway_dining_room_close
              name: Close
              icon: mdi:arrow-down-bold
              show_name: true
              show_icon: true
              show_state: false
              tap_action:
                action: call-service
                service: scene.turn_on
                target:
                  entity_id: scene.laundry_gateway_dining_room_close
          bottom_layout: rows
  - type: custom:bubble-card
    card_type: separator
    sub_button:
      main: []
      bottom: []
    rows: "0.8"
  - type: grid
    columns: 2
    square: false
    cards:
      - type: vertical-stack
        cards:
          - type: heading
            heading: Kitchen
            heading_style: subtitle
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:bubble-card
                card_type: media-player
                entity: media_player.kitchen
                name: Kitchen Sonos
                show_name: true
                show_state: true
                show_attribute: false
                scrolling_effect: false
                card_layout: normal
                rows: 1
                button_action:
                  tap_action:
                    action: more-info
              - type: custom:bubble-card
                card_type: button
                button_type: slider
                entity: light.downstairs_kitchen_island_inovelli_dimmer
                name: Island Lights
                icon: mdi:lightbulb-group
                show_state: true
                show_attribute: true
                attribute: brightness
                allow_light_slider_to_0: true
                tap_action:
