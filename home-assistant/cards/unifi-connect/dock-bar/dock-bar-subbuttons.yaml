card_layout: large
styles: |
  .bubble-button-card-container {
    background: rgba(28, 29, 33, 0.18) !important;
    padding: 10px 14px 12px !important;
  }

  .card-content {
    width: 100%;
    margin: 0 !important;
  }

  .bubble-sub-button-container {
    display: flex !important;
    width: 100%;
    align-items: stretch;
    justify-content: space-between !important;
    gap: 12px;
    padding: 0 2px;
  }

  .bubble-sub-button {
    min-width: unset !important;
    border-radius: 22px !important;
  }

  .bubble-sub-button-icon {
    --mdc-icon-size: 32px !important;
    margin-bottom: 6px;
  }

  .bubble-name {
    color: rgba(240, 243, 255, 0.9) !important;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .bubble-sub-button-1 {
    background: rgba(76, 119, 98, 0.42) !important;
  }

  .bubble-sub-button-2 {
    background: rgba(123, 105, 72, 0.4) !important;
  }

  .bubble-sub-button-3 {
    background: rgba(72, 108, 96, 0.4) !important;
  }

  .bubble-sub-button-4 {
    background: rgba(88, 101, 138, 0.4) !important;
  }

  .bubble-sub-button-5 {
    background: rgba(120, 95, 82, 0.4) !important;
  }

  .bubble-sub-button-6 {
    background: rgba(119, 108, 78, 0.4) !important;
  }

  .bubble-sub-button-7 {
    background: rgba(92, 98, 133, 0.4) !important;
  }

  .bubble-sub-button-8 {
    background: rgba(78, 102, 119, 0.4) !important;
  }

  .bubble-sub-button-9 {
    background: rgba(112, 90, 116, 0.4) !important;
  }

  .bubble-sub-button-10 {
    background: rgba(110, 99, 134, 0.4) !important;
  }

  .bubble-sub-button-11 {
    background: rgba(83, 100, 127, 0.4) !important;
  }

  .bubble-sub-button-12 {
    background: rgba(92, 100, 108, 0.4) !important;
  }

  .bubble-sub-button-1 .bubble-sub-button-icon,
  .bubble-sub-button-2 .bubble-sub-button-icon,
  .bubble-sub-button-3 .bubble-sub-button-icon,
  .bubble-sub-button-4 .bubble-sub-button-icon,
  .bubble-sub-button-5 .bubble-sub-button-icon,
  .bubble-sub-button-6 .bubble-sub-button-icon,
  .bubble-sub-button-7 .bubble-sub-button-icon,
  .bubble-sub-button-8 .bubble-sub-button-icon,
  .bubble-sub-button-9 .bubble-sub-button-icon,
  .bubble-sub-button-10 .bubble-sub-button-icon,
  .bubble-sub-button-11 .bubble-sub-button-icon,
  .bubble-sub-button-12 .bubble-sub-button-icon {
    color: rgba(245, 247, 255, 0.92) !important;
  }
grid_options:
  columns: full
