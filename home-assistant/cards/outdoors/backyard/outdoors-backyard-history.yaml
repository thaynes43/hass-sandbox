type: custom:bubble-card
card_type: pop-up
hash: "#outdoors-backyard-history"
button_type: name
width_desktop: 75vw
show_header: true
name: Toggle Advanced Settings
show_icon: true
icon: mdi:tune-variant
show_name: true
margin: 7px
scrolling_effect: false
tap_action:
  action: navigate
  navigation_path: "#outdoors-backyard-advanced"
sub_button:
  main: []
  bottom: []
button_action:
  tap_action:
    action: navigate
    navigation_path: "#outdoors-backyard-advanced"
cards:
  - type: markdown
    content: |
      ## Back Yard

  - type: custom:bubble-card
    card_type: sub-buttons
    sub_button:
      main: []
      bottom:
        - name: Triggers
          buttons_layout: inline
          group:
            - entity: binary_sensor.kitchen_slider_usl_entry_contact
              name: Slider
              icon: mdi:door-sliding
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
            - entity: binary_sensor.back_yard_ai_pro_person_detected
              name: Person
              icon: mdi:account
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
            - entity: binary_sensor.back_yard_ai_pro_animal_detected
              name: Animal
              icon: mdi:paw
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
            - entity: binary_sensor.backyard_all_clear
              name: All Clear (motion+AI)
              icon: mdi:motion-sensor-off
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
        - name: Spotlight
          buttons_layout: inline
          group:
            - entity: light.downstairs_kitchen_back_yard_spotlight
              name: Spotlight
              icon: mdi:spotlight-beam
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
            - entity: sensor.downstairs_kitchen_back_yard_spotlight_power
              name: Power
              icon: mdi:flash
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
            - entity: light.back_yard_westford_spa_light_1
              name: Spa Lights
              icon: mdi:hot-tub
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
        - name: Automations
          buttons_layout: inline
          group:
            - entity: automation.switch_back_yard_slider_opens_turn_on_spotlight
              name: Slider -> On
              icon: mdi:door-open
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
            - entity: automation.switch_back_yard_camera_detects_motion_turn_on_lights
              name: Camera -> On
              icon: mdi:cctv
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
            - entity: automation.switch_back_yard_camera_stops_detecting_motion_turn_off_spotlight
              name: Clear 5m -> Off
              icon: mdi:timer-off-outline
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
            - entity: automation.switch_back_yard_spa_lights_manage_spotlight_auto_hold
              name: Spa -> Hold
              icon: mdi:hot-tub
              show_name: true
              show_state: true
              show_icon: true
              content_layout: icon-top
              custom_height: 60
      bottom_layout: rows
    rows: 3.4
    show_header_toggle: false

  - type: markdown
    content: |-
      {% set spot = "light.downstairs_kitchen_back_yard_spotlight" %}{% set clear = "binary_sensor.backyard_all_clear" %}{% set auto_off = "automation.switch_back_yard_camera_stops_detecting_motion_turn_off_spotlight" %}{% set s = "downstairs_kitchen_back_yard_spotlight" %}{% set manual = states("input_text.inovelli_manual_hold") | int(85) %}{% set auto = states("input_text.inovelli_auto_hold") | int(0) %}{% set led1 = states("number." ~ s ~ "_defaultled1colorwhenon") | int(-1) %}{% set on_hold = led1 in [manual, auto] %}{% set detects = expand("binary_sensor.back_yard_ai_pro_person_detected", "binary_sensor.back_yard_ai_pro_animal_detected", "binary_sensor.shed_g5_ptz_person_detected", "binary_sensor.shed_g5_ptz_animal_detected") | selectattr("state", "eq", "on") | map(attribute="name") | list %}{% set armed = [as_timestamp(states[spot].last_changed), as_timestamp(states[clear].last_changed)] | max %}{% set eta = armed + 300 %}{% set cap = as_timestamp(states[spot].last_changed) + 2700 %}

      <ha-icon icon="mdi:spotlight-beam"></ha-icon> **Spotlight:** {{ "On" if is_state(spot, "on") else "Off" }} - {{ relative_time(states[spot].last_changed) }}

      <ha-icon icon="mdi:motion-sensor-off"></ha-icon> **All Clear:** {{ states(clear) }} - {{ relative_time(states[clear].last_changed) }}. Tracks motion **and** person/animal on both back yard cameras (AI Pro + Shed PTZ), so it can no longer read clear while a smart detect is active. A camera that goes unavailable does not hold the light on.

      <ha-icon icon="mdi:cctv"></ha-icon> **Smart detects now:** {{ detects | join(", ") if detects else "none on either camera" }}

      <ha-icon icon="mdi:timer-off-outline"></ha-icon> **Auto-off:** {% if is_state(auto_off, "off") %}automation is disabled{% elif on_hold %}blocked - switch is on hold{% elif not is_state(spot, "on") %}nothing to do, light is already off{% elif not is_state(clear, "on") %}waiting for the yard to go clear{% elif eta > as_timestamp(now()) %}in about {{ ((eta - as_timestamp(now())) / 60) | round(0) | int }} min{% else %}due now{% endif %}

      <ha-icon icon="mdi:timer-alert-outline"></ha-icon> **Max-on cap:** {% if not is_state(spot, "on") %}not running{% elif is_state(auto_off, "off") or on_hold %}suppressed - hold or automation disabled{% elif cap > as_timestamp(now()) %}force-off in about {{ ((cap - as_timestamp(now())) / 60) | round(0) | int }} min{% else %}due now{% endif %}

      Auto-off runs from 1 hour after sunset until sunrise, once the light has been on 5 minutes AND the yard has been all clear 4 minutes - so a slider or paddle turn-on is always re-checked. A 5-minute sweeper re-evaluates from the wall clock, so a reload, a restart or a hold release cannot strand the light. The 45-minute max-on cap force-offs regardless of sun or detections, but a manual hold suppresses everything.

  - type: history-graph
    entities:
      - entity: binary_sensor.kitchen_slider_usl_entry_contact
        name: Slider
      - entity: binary_sensor.back_yard_ai_pro_person_detected
        name: AI Pro Person
      - entity: binary_sensor.back_yard_ai_pro_animal_detected
        name: AI Pro Animal
      - entity: binary_sensor.shed_g5_ptz_person_detected
        name: PTZ Person
      - entity: binary_sensor.shed_g5_ptz_animal_detected
        name: PTZ Animal
      - entity: binary_sensor.back_yard_ai_pro_motion
        name: AI Pro Motion
      - entity: binary_sensor.g5_ptz_motion
        name: PTZ Motion
      - entity: binary_sensor.backyard_all_clear
        name: All Clear
      - entity: light.back_yard_westford_spa_light_1
        name: Spa Lights
      - entity: light.downstairs_kitchen_back_yard_spotlight
        name: Spotlight
    hours_to_show: 1
    grid_options:
      columns: full

  - type: markdown
    content: >
      {% set s = 'downstairs_kitchen_back_yard_spotlight' %} {% set manual =
      states('input_text.inovelli_manual_hold') | int(85) %} {% set auto =
      states('input_text.inovelli_auto_hold') | int(0) %} {% set led1 =
      states('number.' ~ s ~ '_defaultled1colorwhenon') | int(-1) %}

      {% if led1 == manual %}
        {% set hold_label = 'Manual Hold' %}
      {% elif led1 == auto %}
        {% set hold_label = 'Auto Hold' %}
      {% else %}
        {% set hold_label = 'Clear' %}
      {% endif %}

      {% set on_vals = namespace(out='') %} {% for i in range(1,8) %}
        {% set v = states('number.' ~ s ~ '_defaultled' ~ i ~ 'colorwhenon') %}
        {% set on_vals.out = on_vals.out ~ (', ' if i > 1 else '') ~ v %}
      {% endfor %}

      {% set off_vals = namespace(out='') %} {% for i in range(1,8) %}
        {% set v = states('number.' ~ s ~ '_defaultled' ~ i ~ 'colorwhenoff') %}
        {% set off_vals.out = off_vals.out ~ (', ' if i > 1 else '') ~ v %}
      {% endfor %}

      <ha-icon icon="mdi:lock-check"></ha-icon> **Manual/Auto Hold:** {{
      hold_label }}

      <ha-icon icon="mdi:palette"></ha-icon> **LED ON Colors (1-7):** {{
      on_vals.out }}

      <ha-icon icon="mdi:palette-outline"></ha-icon> **LED OFF Colors (1-7):**
      {{ off_vals.out }}

      <ha-icon icon="mdi:lightbulb-auto-outline"></ha-icon> **Hold behavior:**
      the slider-open, camera-on, and all-clear automations stay disabled while
      this zone is on hold.

  - type: custom:mod-card
    card:
      type: entities
      entities:
        - entity: input_number.outdoor_light_inovelli_led_color
          name: Shared Outdoor LED Color
      card_mod:
        style: |
          ha-card { padding: 0 !important; }
          .card-content { padding: 0px 12px 6px 12px !important; }
          #states { padding-top: 0 !important; margin-top: 0 !important; }
    style: |
      ha-card { padding: 0 !important; }

  - type: custom:bubble-card
    card_type: sub-buttons
    sub_button:
      main: []
      bottom:
        - name: Hold Buttons
          buttons_layout: inline
          group:
            - name: Toggle
              icon: mdi:hand-back-left
              tap_action:
                action: perform-action
                perform_action: script.inovelli_toggle_mmwave_hold_led_indicator
                target: {}
                data:
                  switch_name: downstairs_kitchen_back_yard_spotlight
                  hold_color: input_text.inovelli_manual_hold
                  prev_led_color_helper: input_number.outdoor_light_inovelli_led_color
                  automation_entity_ids:
                    - automation.switch_back_yard_slider_opens_turn_on_spotlight
                    - automation.switch_back_yard_camera_detects_motion_turn_on_lights
                    - automation.switch_back_yard_camera_stops_detecting_motion_turn_off_spotlight
              entity: script.inovelli_toggle_mmwave_hold_led_indicator
              show_state: false
              show_name: true
              content_layout: icon-top
              fill_width: true
              custom_height: 80
              scrolling_effect: false
            - entity: script.inovelli_set_mmwave_hold_led_indicator
              name: Set Auto Hold
              icon: mdi:lock
              show_name: true
              show_state: false
              tap_action:
                action: perform-action
                perform_action: script.inovelli_set_mmwave_hold_led_indicator
                target: {}
                data:
                  switch_name: downstairs_kitchen_back_yard_spotlight
                  hold_color: input_text.inovelli_auto_hold
                  prev_led_color_helper: input_number.outdoor_light_inovelli_led_color
                  automation_entity_ids:
                    - automation.switch_back_yard_slider_opens_turn_on_spotlight
                    - automation.switch_back_yard_camera_detects_motion_turn_on_lights
                    - automation.switch_back_yard_camera_stops_detecting_motion_turn_off_spotlight
              content_layout: icon-top
              custom_height: 80
              scrolling_effect: false
            - entity: script.inovelli_clear_mmwave_hold_restore_led_indicator
              name: Clear Auto Hold
              icon: mdi:lock-open-variant
              show_name: true
              show_state: false
              tap_action:
                action: perform-action
                perform_action: script.inovelli_clear_mmwave_hold_restore_led_indicator
                target: {}
                data:
                  switch_name: downstairs_kitchen_back_yard_spotlight
                  hold_color: input_text.inovelli_auto_hold
                  prev_led_color_helper: input_number.outdoor_light_inovelli_led_color
                  automation_entity_ids:
                    - automation.switch_back_yard_slider_opens_turn_on_spotlight
                    - automation.switch_back_yard_camera_detects_motion_turn_on_lights
                    - automation.switch_back_yard_camera_stops_detecting_motion_turn_off_spotlight
              content_layout: icon-top
              custom_height: 80
              scrolling_effect: false
            - entity: automation.switch_back_yard_spa_lights_manage_spotlight_auto_hold
              name: Spa Auto Hold
              icon: mdi:robot
              show_name: true
              show_state: true
              content_layout: icon-top
              fill_width: true
              custom_height: 80
              tap_action:
                action: toggle
              show_background: true
              scrolling_effect: false
            - entity: script.inovelli_set_led_1_7_color_from_input_text
              name: Set LED Color
              icon: mdi:palette
              show_name: true
              tap_action:
                action: perform-action
                perform_action: script.inovelli_set_led_1_7_color_from_input_text
                target: {}
                data:
                  switch_name: downstairs_kitchen_back_yard_spotlight
                  color_helper: input_number.outdoor_light_inovelli_led_color
              content_layout: icon-top
              fill_width: true
              custom_height: 80
              show_background: true
              scrolling_effect: false
      bottom_layout: rows
    rows: 1.65
    show_header_toggle: false
