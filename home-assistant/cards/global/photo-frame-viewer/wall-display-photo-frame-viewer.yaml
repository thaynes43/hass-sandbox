type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: select
    entity: input_select.wall_display_photo_frame_image
    name: Photo Frame
    show_name: true
    rows: 1
    styles: |-
      .bubble-sub-button-1,
      .bubble-sub-button-2,
      .bubble-sub-button-3 {
        transition: background-color 200ms ease;
      }
      .bubble-sub-button-2 {
        background-color: ${(() => {
          const active = 'rgba(var(--rgb-accent-color), 0.45)';
          const paused = hass.states['input_boolean.wall_display_photo_frame_paused']?.state;
          return paused === 'on' ? active : '';
        })()} !important;
      }
    sub_button:
      main:
        - sub_button_type: button
          icon: mdi:chevron-left
          tap_action:
            action: call-service
            service: input_select.select_previous
            target:
              entity_id: input_select.wall_display_photo_frame_image
            data:
              cycle: true
        - sub_button_type: button
          icon: mdi:pause
          tap_action:
            action: call-service
            service: input_boolean.toggle
            target:
              entity_id: input_boolean.wall_display_photo_frame_paused
        - sub_button_type: button
          icon: mdi:chevron-right
          tap_action:
            action: call-service
            service: input_select.select_next
            target:
              entity_id: input_select.wall_display_photo_frame_image
            data:
              cycle: true
      bottom: []
    tap_action:
      action: navigate
      navigation_path: "#photo-frame-settings"
    icon: mdi:cog-outline
  - type: markdown
    content: >-
      <img style="width: 100%; height: auto;" src="{{
      states('input_text.wall_display_photo_frame_image_local_url') }}?cb={{
      states('input_text.wall_display_photo_frame_cache_bust') }}" />
