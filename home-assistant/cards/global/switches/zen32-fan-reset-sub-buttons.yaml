type: custom:bubble-card
card_type: sub-buttons
sub_button:
  main: []
  bottom:
    - name: Downstairs
      buttons_layout: inline
      group:
        - name: Living
          icon: mdi:fan-alert
          show_name: true
          fill_width: false
          width: 33
          custom_height: 72
          content_layout: icon-top
          tap_action:
            action: perform-action
            perform_action: script.zen32_hard_reset
            target: {}
            data:
              power_switch_entity: switch.downstairs_livingroom_scene_controller
              relay_control_select_entity: select.downstairs_livingroom_scene_controller_relay_control
              scene_control_select_entity: >-
                select.downstairs_livingroom_scene_controller_scene_control_relay
              unavailable_fan_entity: fan.livingroom_fan_fan
          entity: fan.livingroom_fan_fan
          show_state: true
        - name: Office
          icon: mdi:fan-alert
          show_name: true
          fill_width: false
          width: 33
          custom_height: 72
          content_layout: icon-top
          tap_action:
            action: perform-action
            perform_action: script.zen32_hard_reset
            target: {}
            data:
              power_switch_entity: switch.downstairs_study_scene_controller
              relay_control_select_entity: select.downstairs_study_scene_controller_relay_control
              scene_control_select_entity: select.downstairs_study_scene_controller_scene_control_relay
              unavailable_fan_entity: fan.study_fan_fan
          entity: fan.study_fan_fan
          show_state: true
        - name: Primary
          icon: mdi:fan-alert
          show_name: true
          fill_width: false
          width: 33
          custom_height: 72
          content_layout: icon-top
          tap_action:
            action: perform-action
            perform_action: script.zen32_hard_reset
            target: {}
            data:
              power_switch_entity: switch.upstairs_primary_bedroom_scene_controller
