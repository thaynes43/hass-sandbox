                select.upstairs_primary_bedroom_scene_controller_scene_control_relay
              unavailable_fan_entity: fan.primary_bedroom_fan_fan
          entity: fan.primary_bedroom_fan_fan
          show_state: true
    - name: Upstairs
      buttons_layout: inline
      group:
        - name: Pink
          icon: mdi:fan-alert
          show_name: true
          fill_width: false
          width: 33
          custom_height: 72
          content_layout: icon-top
          tap_action:
            action: perform-action
            perform_action: script.zen32_hard_reset
            target: {}
            data:
              power_switch_entity: switch.upstairs_pink_room_scene_controller
              relay_control_select_entity: select.upstairs_pink_room_scene_controller_relay_control
              scene_control_select_entity: select.upstairs_pink_room_scene_controller_scene_control_relay
