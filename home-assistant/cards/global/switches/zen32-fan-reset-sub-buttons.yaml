          entity: fan.pink_room_fan_fan
          show_state: true
        - name: Blue
          icon: mdi:fan-alert
          show_name: true
          fill_width: false
          width: 33
          custom_height: 72
          content_layout: icon-top
          tap_action:
            action: perform-action
            perform_action: script.zen32_hard_reset
            target: {}
            data:
              power_switch_entity: switch.upstairs_blue_room_scene_controller
              relay_control_select_entity: select.upstairs_blue_room_scene_controller_relay_control
              scene_control_select_entity: select.upstairs_blue_room_scene_controller_scene_control_relay
              unavailable_fan_entity: fan.blue_room_fan_fan
          entity: fan.blue_room_fan_fan
          sub_button_type: default
          show_state: true
        - name: White
          icon: mdi:fan-alert
