type: custom:bubble-card
card_type: button
button_type: name
name: Primary Bedroom
icon: mdi:bed-king-outline
entity: light.upstairs_primary_bed_lights
show_state: true
rows: 1
button_action:
  tap_action:
    action: navigate
    navigation_path: "#kellie-primary-bedroom"
sub_button:
  main:
    - name: Relaxed
      icon: mdi:weather-night
      show_name: true
      show_icon: true
      show_state: false
      tap_action:
        action: call-service
        service: script.turn_on
        target:
          entity_id: script.kellie_mobile_primary_bedroom_relaxed
    - name: Focused
      icon: mdi:brightness-7
      show_name: true
      show_icon: true
      show_state: false
      tap_action:
        action: call-service
        service: script.turn_on
        target:
          entity_id: script.kellie_mobile_primary_bedroom_focused
  bottom: []
  bottom_layout: rows
slider_fill_orientation: left
slider_value_position: right
light_slider_type: brightness
styles: |-
  .bubble-sub-button-1,
  .bubble-sub-button-2 {
    transition: background-color 200ms ease;
  }
  .bubble-sub-button-1 {
    background-color: ${(() => {
      const e = hass.states['light.upstairs_primary_bed_lights'];
      const isOn = e?.state === 'on';
      const b = e?.attributes?.brightness;
      const pct = b == null ? 0 : (b / 255) * 100;
      const active = 'rgba(var(--rgb-accent-color), 0.45)';
      const inactive = 'rgba(0,0,0,0.22)';
      if (!isOn) return inactive;
      return pct <= 40 ? active : inactive;
    })()} !important;
  }
  .bubble-sub-button-2 {
    background-color: ${(() => {
      const e = hass.states['light.upstairs_primary_bed_lights'];
      const isOn = e?.state === 'on';
      const b = e?.attributes?.brightness;
      const pct = b == null ? 0 : (b / 255) * 100;
      const active = 'rgba(var(--rgb-accent-color), 0.45)';
      const inactive = 'rgba(0,0,0,0.22)';
      if (!isOn) return inactive;
      return pct > 40 ? active : inactive;
    })()} !important;
  }
