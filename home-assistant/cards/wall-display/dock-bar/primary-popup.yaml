type: custom:bubble-card
card_type: pop-up
hash: "#primary-popup"
button_type: name
width_desktop: 75vw
width_mobile: 90vw
show_header: true
name: Return To Dashboard
show_icon: true
icon: mdi:arrow-left
show_name: true
margin: 7px
scrolling_effect: false
tap_action:
  action: navigate
  navigation_path: "#"
button_action:
  tap_action:
    action: navigate
    navigation_path: "#"
cards:
  - type: markdown
    text_only: true
    card_mod:
      style: |
        ha-card {
          border-radius: 28px;
          padding: 10px 18px 12px;
          background: var(--ha-card-background, var(--card-background-color));
          border: none;
          box-shadow: none;
        }
        h2 {
          margin: 0 0 8px;
          color: var(--primary-text-color);
          font-size: 1.15rem;
          font-weight: 650;
          letter-spacing: 0.01em;
        }
        p {
          margin: 0;
          color: var(--secondary-text-color);
          line-height: 1.35;
          font-size: 0.95rem;
        }
        p + p {
          margin-top: 6px;
        }
        strong {
          color: var(--primary-text-color);
          font-weight: 600;
        }
    content: |
      ## Primary Suite

      <p><strong>Bedroom</strong> {{ states('sensor.primary_bedroom_wave_plus_temperature') }}&deg;F, {{ states('sensor.primary_bedroom_wave_plus_carbon_dioxide') }} ppm CO2 &nbsp;•&nbsp; <strong>Bathroom</strong> {{ states('sensor.primary_bathroom_temperature') }}&deg;F, {{ states('sensor.primary_bathroom_humidity') }}% Hum, {{ states('sensor.primary_bathroom_vocs') }} ppb VOC</p>

      <p><strong>Closet</strong> {{ 'Open' if is_state('binary_sensor.upstairs_primary_closet_open_closed_sensor_open', 'on') else 'Closed' }}, {{ states('sensor.upstairs_primary_closet_open_closed_sensor_battery_level') }}% Batt</p>
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: light.primary_suite_lights
        name: Suite Lights
        icon: mdi:lightbulb-group
        show_state: true
        show_attribute: true
        attribute: brightness
        allow_light_slider_to_0: true
        tap_action:
          action: more-info
        button_action:
          tap_action:
            action: toggle
        slider_fill_orientation: left
        slider_value_position: right
      - type: custom:bubble-card
        card_type: button
        button_type: name
        card_layout: large-2-rows
        entity: climate.second_floor_ecobee
        name: Upstairs Ecobee
        icon: mdi:thermostat
        show_state: true
        sub_button:
          main:
            - entity: sensor.second_floor_ecobee_temperature
              name: ""
              show_state: true
              show_name: false
              show_icon: true
              show_background: false
              icon: mdi:home-thermometer
              tap_action:
                action: more-info
            - entity: sensor.second_floor_ecobee_target_temperature
              name: ""
              show_state: true
              show_name: false
              show_icon: true
              show_background: false
              icon: mdi:target
              tap_action:
                action: more-info
            - entity: sensor.second_floor_ecobee_humidity
              name: ""
              show_state: true
              show_name: false
              show_icon: true
              show_background: false
              icon: mdi:water-percent
              tap_action:
                action: more-info
          bottom: []
        button_action:
          tap_action:
            action: more-info
      - type: custom:bubble-card
        card_type: button
        button_type: name
        entity: cover.primary_bedroom_shades
        name: Bedroom Shades
        show_state: true
        rows: 1.719
        card_layout: large-sub-buttons-grid
        button_action:
          tap_action:
            action: more-info
        sub_button:
          main: []
          bottom:
            - entity: scene.laundry_gateway_main_bedroom_tilt_open
              name: Tilt Open
              icon: mdi:blinds-horizontal
              show_name: true
              show_icon: true
              show_state: false
              tap_action:
                action: call-service
                service: scene.turn_on
                target:
                  entity_id: scene.laundry_gateway_main_bedroom_tilt_open
            - entity: scene.laundry_gateway_main_bedroom_open
              name: Open
              icon: mdi:arrow-up-bold
              show_name: true
              show_icon: true
              show_state: false
              tap_action:
                action: call-service
                service: scene.turn_on
                target:
                  entity_id: scene.laundry_gateway_main_bedroom_open
            - entity: scene.laundry_gateway_main_bedroom_close
              name: Close
              icon: mdi:arrow-down-bold
              show_name: true
              show_icon: true
              show_state: false
              tap_action:
                action: call-service
                service: scene.turn_on
                target:
                  entity_id: scene.laundry_gateway_main_bedroom_close
          bottom_layout: rows
      - type: custom:bubble-card
        card_type: media-player
        entity: media_player.primary_bedroom
        name: Bedroom Sonos
        show_name: true
        show_state: true
        show_attribute: false
        scrolling_effect: false
        card_layout: normal
        rows: 1
        button_action:
          tap_action:
            action: more-info
      - type: custom:bubble-card
        card_type: media-player
        entity: media_player.primary_bathroom
        name: Bathroom Sonos
        show_name: true
        show_state: true
        show_attribute: false
        scrolling_effect: false
        card_layout: normal
        rows: 1
        button_action:
          tap_action:
            action: more-info
      - type: custom:bubble-card
        card_type: button
        button_type: name
        entity: media_player.primary_bedroom_lg_tv
        name: Bedroom TV
        icon: mdi:television
        show_state: true
        button_action:
          tap_action:
            action: more-info
  - type: custom:bubble-card
    card_type: separator
    sub_button:
      main: []
      bottom: []
    rows: "0.8"
  - type: grid
    columns: 2
    square: false
    cards:
      - type: vertical-stack
        cards:
          - type: heading
