type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#primary-popup"
    button_type: name
    width_desktop: 75vw
    width_mobile: 90vw
    show_header: true
    name: Return To Dashboard
    show_icon: true
    icon: mdi:arrow-left
    show_name: true
    margin: 7px
    scrolling_effect: false
    tap_action:
      action: navigate
      navigation_path: "#"
    button_action:
      tap_action:
        action: navigate
        navigation_path: "#"
  - type: markdown
    text_only: true
    card_mod:
      style: &suite_heading_style |
        ha-card {
          background: none;
          box-shadow: none;
          border: none;
          padding: 4px 8px 0;
        }
        h1, h2, h3 {
          margin: 0;
          text-align: center;
          color: rgba(240, 243, 255, 0.96);
          letter-spacing: 0.01em;
        }
        p {
          margin: 6px 0 0;
          text-align: center;
          color: rgba(203, 214, 234, 0.78);
        }
    content: |
      # Primary Suite

      Standalone controls and grouped shade/light controls stay here. Area blocks below keep the per-room controls predictable.
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: light.primary_suite_lights
        name: Suite Lights
        icon: mdi:lightbulb-group
        show_state: true
        show_attribute: true
        attribute: brightness
        allow_light_slider_to_0: true
        tap_action:
          action: more-info
        button_action:
          tap_action:
            action: toggle
        slider_fill_orientation: left
        slider_value_position: right
        styles: &glass_button_styles |-
          ha-card {
            --bubble-border-radius: 28px !important;
            --bubble-box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18) !important;
            --bubble-border: 1px solid rgba(255, 255, 255, 0.14) !important;
            --bubble-main-background-color: rgba(34, 36, 42, 0.9) !important;
            --bubble-icon-background-color: rgba(255, 255, 255, 0.06) !important;
            --bubble-sub-button-border-radius: 20px !important;
            --bubble-sub-button-background-color: rgba(255, 255, 255, 0.05) !important;
          }

          .bubble-name,
          .bubble-state,
          .bubble-attribute {
            color: rgba(240, 243, 255, 0.92) !important;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.18);
          }

          .bubble-name {
            font-weight: 600 !important;
            letter-spacing: 0.01em;
            font-size: 0.96rem !important;
          }

          .bubble-state {
            color: rgba(203, 214, 234, 0.8) !important;
            text-transform: capitalize;
            font-size: 0.79rem !important;
            line-height: 1.1 !important;
          }

          .bubble-attribute {
            color: rgba(203, 214, 234, 0.78) !important;
            font-size: 0.83rem !important;
          }

          .bubble-icon,
          .bubble-sub-button-icon {
            color: rgba(245, 247, 255, 0.94) !important;
          }

          .bubble-icon-container {
            background: rgba(255, 255, 255, 0.06) !important;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;
          }

          .bubble-sub-button {
            border-radius: 20px !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            box-shadow: none !important;
          }
      - type: custom:bubble-card
        card_type: button
        button_type: name
        card_layout: large-2-rows
        entity: climate.second_floor_ecobee
        name: Upstairs Ecobee
        icon: mdi:thermostat
        show_state: true
        sub_button:
          main:
            - entity: sensor.second_floor_ecobee_temperature
              name: ""
              show_state: true
              show_name: false
              show_icon: true
              show_background: false
              icon: mdi:home-thermometer
              tap_action:
                action: more-info
            - entity: sensor.second_floor_ecobee_target_temperature
              name: ""
              show_state: true
              show_name: false
              show_icon: true
              show_background: false
              icon: mdi:target
