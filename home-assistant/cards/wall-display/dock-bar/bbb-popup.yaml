type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#bbb-popup"
    button_type: name
    width_desktop: 75vw
    width_mobile: 90vw
    show_header: true
    name: Return To Dashboard
    show_icon: true
    icon: mdi:arrow-left
    show_name: true
    margin: 7px
    scrolling_effect: false
    tap_action:
      action: navigate
      navigation_path: "#"
    button_action:
      tap_action:
        action: navigate
        navigation_path: "#"
  - type: markdown
    content: |
      ## Coming Soon
