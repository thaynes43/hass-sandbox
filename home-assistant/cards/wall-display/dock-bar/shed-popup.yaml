type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#shed-popup"
    button_type: name
    width_desktop: 75vw
    width_mobile: 90vw
    show_header: true
    name: Return To Dashboard
    show_icon: true
    icon: mdi:arrow-left
    show_name: true
    margin: 7px
    scrolling_effect: false
    tap_action:
      action: navigate
      navigation_path: "#"
    button_action:
      tap_action:
        action: navigate
        navigation_path: "#"
    styles: |-
      ha-card {
        --bubble-border-radius: 28px !important;
        --bubble-box-shadow:
          0 14px 40px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          inset 0 0 18px rgba(255, 255, 255, 0.04) !important;
        --bubble-border: 1px solid rgba(255, 255, 255, 0.14) !important;
        --bubble-main-background-color: rgba(28, 29, 33, 0.32) !important;
        --bubble-icon-background-color: rgba(255, 255, 255, 0.06) !important;
        backdrop-filter: blur(14px) saturate(1.2) !important;
        -webkit-backdrop-filter: blur(14px) saturate(1.2) !important;
      }

      .bubble-button-card-container {
        background: rgba(28, 29, 33, 0.32) !important;
        border: 1px solid rgba(255, 255, 255, 0.14) !important;
        border-radius: 28px !important;
        box-shadow:
          0 14px 40px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          inset 0 0 18px rgba(255, 255, 255, 0.04) !important;
        backdrop-filter: blur(14px) saturate(1.2) !important;
        -webkit-backdrop-filter: blur(14px) saturate(1.2) !important;
        overflow: hidden;
      }

      .bubble-name,
      .bubble-state,
      .bubble-attribute {
        color: rgba(240, 243, 255, 0.92) !important;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.18);
      }

      .bubble-name {
        font-weight: 600 !important;
        letter-spacing: 0.01em;
      }

      .bubble-attribute {
        color: rgba(203, 214, 234, 0.78) !important;
        font-size: 0.83rem !important;
      }

      .bubble-icon,
      .bubble-sub-button-icon {
        color: rgba(245, 247, 255, 0.94) !important;
      }

      .bubble-icon-container {
        background: rgba(255, 255, 255, 0.06) !important;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 8px 20px rgba(0, 0, 0, 0.16) !important;
      }

  - type: grid
    columns: 2
    square: false
    cards:
      - type: vertical-stack
        cards:
          - type: sensor
            entity: sensor.upstairs_cloffice_fridge_power_switch_electric_consumption_w
            name: E-Bike Consumption
            icon: mdi:bike
            graph: line
            detail: 1
            hours_to_show: 3
            card_mod:
              style: |
                ha-card {
                  margin-bottom: -6px;
                  border-radius: 28px;
                  border-bottom-left-radius: 0;
                  border-bottom-right-radius: 0;
                  background: rgba(28, 29, 33, 0.32);
                  border: 1px solid rgba(255, 255, 255, 0.14);
                  box-shadow:
                    0 14px 40px rgba(0, 0, 0, 0.28),
                    inset 0 1px 0 rgba(255, 255, 255, 0.18),
                    inset 0 0 18px rgba(255, 255, 255, 0.04);
                  backdrop-filter: blur(14px) saturate(1.2);
                  -webkit-backdrop-filter: blur(14px) saturate(1.2);
                }
          - type: tile
            entity: switch.upstairs_cloffice_fridge_power_switch
            name: E-Bike
            hide_state: true
            vertical: false
            features:
              - type: toggle
            features_position: inline
            card_mod:
              style: |
                ha-card {
                  margin-top: 0;
                  min-height: 46px !important;
                  border-radius: 28px;
                  border-top-left-radius: 0;
                  border-top-right-radius: 0;
                  background: rgba(28, 29, 33, 0.32);
                  border: 1px solid rgba(255, 255, 255, 0.14);
                  border-top: 0;
                  box-shadow:
                    0 14px 40px rgba(0, 0, 0, 0.28),
                    inset 0 1px 0 rgba(255, 255, 255, 0.12),
                    inset 0 0 18px rgba(255, 255, 255, 0.04);
                  backdrop-filter: blur(14px) saturate(1.2);
                  -webkit-backdrop-filter: blur(14px) saturate(1.2);
                }
                .content {
                  display: none !important;
                }
                .features {
                  padding-top: 2px !important;
                  padding-bottom: 6px !important;
                }
      - type: vertical-stack
        cards:
          - type: sensor
            entity: sensor.shed_mombike_power_switch_electric_consumption_w
            name: Mom-Bike Consumption
            icon: mdi:bike
