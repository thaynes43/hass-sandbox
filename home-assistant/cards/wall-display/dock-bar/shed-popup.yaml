                }
          - type: tile
            entity: switch.shed_mombike_power_switch
            name: Mom-Bike
            hide_state: true
            vertical: false
            features:
              - type: toggle
            features_position: inline
            card_mod:
              style: |
                ha-card {
                  margin-top: 0;
                  min-height: 46px !important;
                  border-radius: 28px;
                  border-top-left-radius: 0;
                  border-top-right-radius: 0;
                  background: rgba(28, 29, 33, 0.32);
