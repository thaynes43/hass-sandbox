      - sensor.upstairs_cloffice_temperature_sensor_01_humidity

iteration_notes:
  - Start broad when uncertain, then prune in later passes
  - If it is unclear whether an entity is already represented by a cleaner grouped control, prefer inclusion for the first draft and trim later
  - Preserve naming consistency across popups once a label pattern is chosen
  - Update this runbook after each popup if a better pattern emerges
