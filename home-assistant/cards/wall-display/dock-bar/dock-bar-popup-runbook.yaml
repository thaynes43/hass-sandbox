    - cover.cloffice_shade_combined
    - media_player.primary_bedroom
    - media_player.primary_bathroom
    - media_player.primary_bedroom_lg_tv
  area_order:
    - Primary Bedroom
    - Primary Bathroom
    - Primary Hallway
    - Primary Closet
    - Primary Cloffice
  area_examples:
    Primary Bedroom:
      - light.upstairs_primary_bed_lights
      - light.upstairs_primary_nook_lights
      - light.upstairs_primary_nightstand_lights
      - fan.primary_bedroom_fan_fan
