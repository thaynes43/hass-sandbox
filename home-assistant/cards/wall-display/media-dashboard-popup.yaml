type: custom:bubble-card
card_type: pop-up
hash: "#media-dashboard-popup"
button_type: name
width_desktop: 75vw
show_header: true
name: Media & Movies
show_icon: true
icon: mdi:movie-open-outline
show_name: true
margin: 7px
scrolling_effect: false
sub_button:
  main: []
  bottom:
    - name: Back
      icon: mdi:arrow-left
      show_name: true
      show_icon: true
      tap_action:
        action: navigate
        navigation_path: "#"
tap_action:
  action: navigate
  navigation_path: "#"
button_action:
  tap_action:
    action: navigate
    navigation_path: "#"
cards:
  - type: custom:media-dashboard-detail-card
    status_entity: sensor.media_dashboard_status
    detail_entity: sensor.media_dashboard_detail
    relay_script: media_dashboard_relay
