type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#front-yard-popup"
    button_type: name
    width_desktop: 75vw
    width_mobile: 90vw
    show_header: true
    name: Return To Dashboard
    show_icon: true
    icon: mdi:arrow-left
    show_name: true
    margin: 7px
    scrolling_effect: false
    tap_action:
      action: navigate
      navigation_path: "#"
    button_action:
      tap_action:
        action: navigate
        navigation_path: "#"
  - type: picture-elements
    image:
      media_content_id: media-source://image_upload/84e59d2652f1bc7c3d0a0eb0c9e89c19
      media_content_type: image/png
      metadata:
        title: walkway-long.png
        thumbnail: /api/image/serve/84e59d2652f1bc7c3d0a0eb0c9e89c19/256x256
        media_class: image
        navigateIds:
          - {}
          - media_content_type: app
            media_content_id: media-source://image_upload
    elements:
      - type: state-icon
        entity: light.front_yard_hue_lily_lights
        icon: mdi:flower-tulip-outline
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        style:
          top: 14%
          left: 16%
          background: rgba(25, 36, 22, 0.58)
          border: 2px solid rgba(233, 245, 226, 0.8)
          border-radius: 999px
          padding: 10px
      - type: state-label
        entity: light.front_yard_hue_lily_lights
        prefix: "Lilies "
        style:
          top: 20%
          left: 16%
          color: white
          font-size: 12px
          font-weight: 700
          text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9)

      - type: state-icon
