type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#countdown-popup"
    button_type: name
    width_desktop: 75vw
    show_header: true
    name: Countdown Settings
    show_icon: true
    icon: mdi:timer-cog-outline
    show_name: true
    margin: 7px
    scrolling_effect: false
    sub_button:
      main: []
      bottom:
        - name: Back
          icon: mdi:arrow-left
          show_name: true
          show_icon: true
          tap_action:
            action: navigate
            navigation_path: "#"
    tap_action:
      action: navigate
      navigation_path: "#"
    button_action:
      tap_action:
        action: navigate
        navigation_path: "#"
  - type: custom:countdown-config-card
    status_entity: sensor.countdown_status
    relay_script: countdown_relay
