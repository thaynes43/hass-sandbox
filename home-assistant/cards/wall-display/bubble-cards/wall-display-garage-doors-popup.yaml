type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#wall-display-garage-doors"
    button_type: name
    width_desktop: 75vw
    show_header: true
    name: Wall Display - Return to Dashboard
    show_icon: true
    icon: mdi:arrow-left
    show_name: true
    margin: 7px
    scrolling_effect: false
    sub_button:
      main: []
      bottom:
        - name: Back
          icon: mdi:arrow-left
          show_name: true
          show_icon: true
          tap_action:
            action: navigate
            navigation_path: "#"
    tap_action:
      action: navigate
      navigation_path: "#"
    button_action:
      tap_action:
        action: navigate
        navigation_path: "#"

  - type: markdown
    text_only: true
    card_mod:
      style: |
        ha-card {
          background: none;
          box-shadow: none;
          border: none;
        }
    content: |
      {% set tesla = 'cover.ratgdov25i_4a0325_door' %}
      **Tesla Garage Door:** {% if is_state(tesla, 'closed') %}Closed {{ as_local(states[tesla].last_changed).strftime('%I:%M %p on %m/%d') }}{% elif is_state(tesla, 'open') %}Open for {{ relative_time(states[tesla].last_changed) }}{% else %}{{ states(tesla) }}{% endif %}

  - type: custom:bubble-card
    card_type: sub-buttons
    show_header_toggle: false
    rows: 1.3
    styles: |-
      @keyframes garageMovePulse {
        0% { filter: brightness(1); }
        50% { filter: brightness(1.18); }
        100% { filter: brightness(1); }
      }
      .bubble-sub-button-1,
      .bubble-sub-button-2,
      .bubble-sub-button-3 {
        transition: background-color 200ms ease;
      }
      .bubble-sub-button-1 {
        background-color: ${(() => {
          const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
          if (s === 'closed') return 'rgba(var(--rgb-primary-color), 0.35)';
          if (s === 'closing') return 'rgba(0, 180, 255, 0.28)';
          return 'rgba(0,0,0,0.22)';
        })()} !important;
        animation: ${(() => {
          const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
          return s === 'closing' ? 'garageMovePulse 1.1s ease-in-out infinite' : 'none';
        })()} !important;
      }
      .bubble-sub-button-3 {
        background-color: ${(() => {
          const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
          if (s === 'open') return 'rgba(var(--rgb-primary-color), 0.35)';
          if (s === 'opening') return 'rgba(0, 180, 255, 0.28)';
          return 'rgba(0,0,0,0.22)';
        })()} !important;
        animation: ${(() => {
          const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
          return s === 'opening' ? 'garageMovePulse 1.1s ease-in-out infinite' : 'none';
        })()} !important;
      }
      .bubble-sub-button-2 {
        background-color: rgba(0,0,0,0.22) !important;
      }
    sub_button:
      main: []
      bottom:
        - name: Tesla Garage Door
          buttons_layout: inline
          group:
            - entity: cover.ratgdov25i_4a0325_door
              name: Close
              icon: mdi:arrow-down-bold
              show_name: false
              show_state: false
              show_icon: true
              scrolling_effect: false
              content_layout: icon-top
              custom_height: 60
              tap_action:
                action: call-service
                service: cover.close_cover
                target:
                  entity_id: cover.ratgdov25i_4a0325_door
            - entity: cover.ratgdov25i_4a0325_door
              name: Stop
              icon: mdi:stop
              show_name: false
              show_state: false
              show_icon: true
              scrolling_effect: false
              content_layout: icon-top
              custom_height: 60
              tap_action:
                action: call-service
                service: cover.stop_cover
                target:
                  entity_id: cover.ratgdov25i_4a0325_door
            - entity: cover.ratgdov25i_4a0325_door
              name: Open
              icon: mdi:arrow-up-bold
              show_name: false
              show_state: false
              show_icon: true
              scrolling_effect: false
              content_layout: icon-top
              custom_height: 60
              tap_action:
                action: call-service
                service: cover.open_cover
                target:
                  entity_id: cover.ratgdov25i_4a0325_door
      bottom_layout: rows

  - type: markdown
    text_only: true
    card_mod:
      style: |
        ha-card {
          background: none;
          box-shadow: none;
          border: none;
