type: custom:bubble-card
card_type: pop-up
hash: "#wall-display-garage-doors"
button_type: name
width_desktop: 75vw
show_header: true
name: Wall Display - Return to Dashboard
show_icon: true
icon: mdi:arrow-left
show_name: true
margin: 7px
scrolling_effect: false
sub_button:
  main: []
  bottom:
    - name: Back
      icon: mdi:arrow-left
      show_name: true
      show_icon: true
      tap_action:
        action: navigate
        navigation_path: "#"
tap_action:
  action: navigate
  navigation_path: "#"
button_action:
  tap_action:
    action: navigate
    navigation_path: "#"
styles: |-
  ha-card {
    --bubble-border-radius: 28px !important;
    --bubble-box-shadow:
      0 14px 40px rgba(0, 0, 0, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      inset 0 0 18px rgba(255, 255, 255, 0.04) !important;
    --bubble-border: 1px solid rgba(255, 255, 255, 0.14) !important;
    --bubble-main-background-color: rgba(28, 29, 33, 0.32) !important;
    --bubble-icon-background-color: rgba(255, 255, 255, 0.06) !important;
    --bubble-sub-button-border-radius: 20px !important;
    --bubble-sub-button-background-color: rgba(255, 255, 255, 0.05) !important;
    backdrop-filter: blur(14px) saturate(1.2) !important;
    -webkit-backdrop-filter: blur(14px) saturate(1.2) !important;
  }

  .bubble-button-card-container {
    background: rgba(28, 29, 33, 0.32) !important;
    border: 1px solid rgba(255, 255, 255, 0.14) !important;
    border-radius: 28px !important;
    box-shadow:
      0 14px 40px rgba(0, 0, 0, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      inset 0 0 18px rgba(255, 255, 255, 0.04) !important;
    backdrop-filter: blur(14px) saturate(1.2) !important;
    -webkit-backdrop-filter: blur(14px) saturate(1.2) !important;
    overflow: hidden;
  }

  .bubble-name,
  .bubble-state,
  .bubble-attribute {
    color: rgba(240, 243, 255, 0.92) !important;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.18);
  }

  .bubble-name {
    font-weight: 600 !important;
    letter-spacing: 0.01em;
  }

  .bubble-attribute {
    color: rgba(203, 214, 234, 0.78) !important;
    font-size: 0.83rem !important;
  }

  .bubble-icon,
  .bubble-sub-button-icon {
    color: rgba(245, 247, 255, 0.94) !important;
  }

  .bubble-icon-container {
    background: rgba(255, 255, 255, 0.06) !important;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.12),
      0 8px 20px rgba(0, 0, 0, 0.16) !important;
  }
cards:
  - type: markdown
    text_only: true
    card_mod:
      style: |
        ha-card {
          border-radius: 24px;
          background: rgba(28, 29, 33, 0.32);
          border: 1px solid rgba(255, 255, 255, 0.14);
          box-shadow:
            0 14px 40px rgba(0, 0, 0, 0.28),
            inset 0 1px 0 rgba(255, 255, 255, 0.18),
            inset 0 0 18px rgba(255, 255, 255, 0.04);
          backdrop-filter: blur(14px) saturate(1.2);
          -webkit-backdrop-filter: blur(14px) saturate(1.2);
          padding: 8px 14px;
        }
        ha-markdown {
          color: rgba(240, 243, 255, 0.92) !important;
          font-size: 0.94rem;
          line-height: 1.45;
        }
    content: |
      {% set tesla = 'cover.ratgdov25i_4a0325_door' %}
      **Tesla Garage Door:** {% if is_state(tesla, 'closed') %}Closed {{ as_local(states[tesla].last_changed).strftime('%I:%M %p on %m/%d') }}{% elif is_state(tesla, 'open') %}Open for {{ relative_time(states[tesla].last_changed) }}{% else %}{{ states(tesla) }}{% endif %}

  - type: custom:bubble-card
    card_type: sub-buttons
    show_header_toggle: false
    rows: 1.3
    styles: |-
      @keyframes garageMovePulse {
        0% { filter: brightness(1); }
        50% { filter: brightness(1.18); }
        100% { filter: brightness(1); }
      }
      ha-card {
        --bubble-border-radius: 28px !important;
        --bubble-box-shadow:
          0 14px 40px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          inset 0 0 18px rgba(255, 255, 255, 0.04) !important;
        --bubble-border: 1px solid rgba(255, 255, 255, 0.14) !important;
        --bubble-main-background-color: rgba(28, 29, 33, 0.32) !important;
        --bubble-sub-button-border-radius: 20px !important;
        --bubble-sub-button-background-color: rgba(255, 255, 255, 0.05) !important;
        backdrop-filter: blur(14px) saturate(1.2) !important;
        -webkit-backdrop-filter: blur(14px) saturate(1.2) !important;
      }
      .bubble-button-card-container {
        background: rgba(28, 29, 33, 0.32) !important;
        border: 1px solid rgba(255, 255, 255, 0.14) !important;
        border-radius: 28px !important;
        box-shadow:
          0 14px 40px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          inset 0 0 18px rgba(255, 255, 255, 0.04) !important;
        backdrop-filter: blur(14px) saturate(1.2) !important;
        -webkit-backdrop-filter: blur(14px) saturate(1.2) !important;
      }
      .bubble-sub-button {
        border-radius: 20px !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          0 8px 20px rgba(0, 0, 0, 0.16) !important;
        transition:
          transform 180ms ease,
          background-color 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease !important;
      }
      .bubble-sub-button:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.14) !important;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          0 10px 24px rgba(0, 0, 0, 0.22) !important;
      }
      .bubble-sub-button-1,
      .bubble-sub-button-2,
      .bubble-sub-button-3 {
        transition: background-color 200ms ease;
      }
      .bubble-sub-button-1 {
        background: ${(() => {
          const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
          if (s === 'closed') return 'linear-gradient(180deg, rgba(92, 98, 133, 0.34), rgba(36, 40, 58, 0.56))';
          if (s === 'closing') return 'linear-gradient(180deg, rgba(86, 112, 154, 0.38), rgba(34, 42, 58, 0.56))';
          return 'rgba(255, 255, 255, 0.05)';
        })()} !important;
        animation: ${(() => {
          const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
          return s === 'closing' ? 'garageMovePulse 1.1s ease-in-out infinite' : 'none';
        })()} !important;
      }
      .bubble-sub-button-3 {
        background: ${(() => {
          const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
          if (s === 'open') return 'linear-gradient(180deg, rgba(138, 98, 76, 0.4), rgba(56, 39, 31, 0.58))';
          if (s === 'opening') return 'linear-gradient(180deg, rgba(86, 112, 154, 0.38), rgba(34, 42, 58, 0.56))';
          return 'rgba(255, 255, 255, 0.05)';
        })()} !important;
        animation: ${(() => {
          const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
          return s === 'opening' ? 'garageMovePulse 1.1s ease-in-out infinite' : 'none';
        })()} !important;
      }
      .bubble-sub-button-2 {
        background: linear-gradient(180deg, rgba(72, 72, 82, 0.24), rgba(34, 34, 40, 0.5)) !important;
      }
    sub_button:
      main: []
      bottom:
        - name: Tesla Garage Door
          buttons_layout: inline
          group:
            - entity: cover.ratgdov25i_4a0325_door
              name: Close
              icon: mdi:arrow-down-bold
              show_name: false
              show_state: false
              show_icon: true
              scrolling_effect: false
              content_layout: icon-top
              custom_height: 60
              tap_action:
                action: call-service
                service: cover.close_cover
                target:
                  entity_id: cover.ratgdov25i_4a0325_door
            - entity: cover.ratgdov25i_4a0325_door
              name: Stop
              icon: mdi:stop
              show_name: false
              show_state: false
              show_icon: true
              scrolling_effect: false
              content_layout: icon-top
              custom_height: 60
              tap_action:
                action: call-service
                service: cover.stop_cover
                target:
                  entity_id: cover.ratgdov25i_4a0325_door
            - entity: cover.ratgdov25i_4a0325_door
              name: Open
              icon: mdi:arrow-up-bold
              show_name: false
              show_state: false
              show_icon: true
              scrolling_effect: false
              content_layout: icon-top
              custom_height: 60
              tap_action:
                action: call-service
                service: cover.open_cover
                target:
                  entity_id: cover.ratgdov25i_4a0325_door
      bottom_layout: rows

  - type: markdown
    text_only: true
    card_mod:
      style: |
        ha-card {
