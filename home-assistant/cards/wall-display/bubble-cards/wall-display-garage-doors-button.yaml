type: custom:bubble-card
card_type: button
button_type: name
name: Garage Doors
icon: mdi:garage
entity: cover.ratgdov25i_dbfa50_door
show_state: false
button_action:
  tap_action:
    action: navigate
    navigation_path: "#wall-display-garage-doors"
sub_button:
  main:
    - entity: cover.ratgdov25i_4a0325_door
      name: Tesla
      show_name: true
      show_icon: false
      show_state: true
      tap_action:
        action: navigate
        navigation_path: "#wall-display-garage-doors"
    - entity: cover.ratgdov25i_dbfa50_door
      name: Wagoneer
      show_name: true
      show_state: true
      show_icon: false
      tap_action:
        action: navigate
        navigation_path: "#wall-display-garage-doors"
  bottom: []
  bottom_layout: rows
rows: 0.96
slider_fill_orientation: left
slider_value_position: right
styles: |-
  ha-card {
    --bubble-border-radius: 28px !important;
    --bubble-box-shadow:
      0 8px 20px rgba(0, 0, 0, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      inset 0 0 18px rgba(255, 255, 255, 0.04) !important;
    --bubble-border: 1px solid rgba(255, 255, 255, 0.14) !important;
    --bubble-main-background-color: rgba(28, 29, 33, 0.32) !important;
    --bubble-icon-background-color: rgba(255, 255, 255, 0.06) !important;
    --bubble-sub-button-border-radius: 20px !important;
    --bubble-sub-button-background-color: rgba(255, 255, 255, 0.05) !important;
    backdrop-filter: blur(14px) saturate(1.2) !important;
    -webkit-backdrop-filter: blur(14px) saturate(1.2) !important;
  }

  .bubble-name,
  .bubble-state,
  .bubble-attribute {
    color: rgba(240, 243, 255, 0.92) !important;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.18);
  }

  .bubble-name {
    font-weight: 600 !important;
    letter-spacing: 0.01em;
    font-size: 0.96rem !important;
  }

  .bubble-state {
    color: rgba(203, 214, 234, 0.8) !important;
    text-transform: capitalize;
    font-size: 0.79rem !important;
    line-height: 1.1 !important;
  }

  .bubble-icon,
  .bubble-sub-button-icon {
    color: rgba(245, 247, 255, 0.94) !important;
  }

  .bubble-icon-container {
    background: rgba(255, 255, 255, 0.06) !important;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.12),
      0 8px 20px rgba(0, 0, 0, 0.16) !important;
  }

  .bubble-sub-button-1 {
    background: ${(() => {
      const s = hass.states['cover.ratgdov25i_4a0325_door']?.state;
      if (s === 'closed') return 'linear-gradient(180deg, rgba(92, 98, 133, 0.34), rgba(36, 40, 58, 0.56))';
      if (s === 'closing' || s === 'opening') return 'linear-gradient(180deg, rgba(86, 112, 154, 0.38), rgba(34, 42, 58, 0.56))';
      if (s === 'open') return 'linear-gradient(180deg, rgba(138, 98, 76, 0.4), rgba(56, 39, 31, 0.58))';
      return 'rgba(255, 255, 255, 0.05)';
    })()} !important;
  }

  .bubble-sub-button-2 {
    background: ${(() => {
      const s = hass.states['cover.ratgdov25i_dbfa50_door']?.state;
      if (s === 'closed') return 'linear-gradient(180deg, rgba(92, 98, 133, 0.34), rgba(36, 40, 58, 0.56))';
      if (s === 'closing' || s === 'opening') return 'linear-gradient(180deg, rgba(86, 112, 154, 0.38), rgba(34, 42, 58, 0.56))';
      if (s === 'open') return 'linear-gradient(180deg, rgba(138, 98, 76, 0.4), rgba(56, 39, 31, 0.58))';
      return 'rgba(255, 255, 255, 0.05)';
    })()} !important;
  }
