type: custom:bubble-card
card_type: media-player
sub_button:
  bottom:
    - width: 220
      content_layout: icon-left
      show_icon: true
      tap_action:
        action: navigate
        navigation_path: /wall-display/music-assistant
      name: Launch Music Assistant
      show_name: true
      icon: mdi:play-pause
  main:
    - name: Kitchen Sonos
      show_background: true
      width: 120
      content_layout: icon-left
      show_name: true
      show_icon: false
entity: media_player.kitchen
name: Kitchen Sonos
show_name: true
force_icon: false
show_state: false
show_attribute: true
attribute: friendly_name
main_buttons_position: bottom
rows: 2.62
styles: |
  ha-card {
    --bubble-border-radius: 28px !important;
    --bubble-box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22) !important;
    --bubble-border: 1px solid rgba(255, 255, 255, 0.14) !important;
    --bubble-main-background-color: rgba(28, 29, 33, 0.32) !important;
    --bubble-icon-background-color: rgba(255, 255, 255, 0.06) !important;
    --bubble-sub-button-border-radius: 20px !important;
    --bubble-sub-button-background-color: rgba(56, 73, 101, 0.42) !important;
    --bubble-media-player-main-background-color: rgba(28, 29, 33, 0.32) !important;
    --bubble-media-player-border-radius: 28px !important;
    --bubble-media-player-buttons-border-radius: 18px !important;
    --bubble-media-player-slider-background-color: rgba(255, 255, 255, 0.08) !important;
    --bubble-media-player-icon-background-color: rgba(255, 255, 255, 0.06) !important;
    --bubble-media-player-box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22) !important;
    backdrop-filter: blur(14px) saturate(1.2) !important;
    -webkit-backdrop-filter: blur(14px) saturate(1.2) !important;
  }

  .bubble-name,
  .bubble-state,
  .bubble-attribute {
    color: rgba(240, 243, 255, 0.92) !important;
  }

  .bubble-name {
    font-weight: 600 !important;
    letter-spacing: 0.01em;
  }

  .bubble-attribute {
    color: rgba(203, 214, 234, 0.78) !important;
    font-size: 0.83rem !important;
  }

  .bubble-icon,
  .bubble-sub-button-icon {
    color: rgba(245, 247, 255, 0.94) !important;
  }

  .bubble-icon-container {
    background: rgba(255, 255, 255, 0.06) !important;
  }

  .bubble-range-fill,
  .bubble-progress-fill,
  .bubble-volume-fill {
    background: linear-gradient(90deg, rgba(171, 198, 255, 0.78), rgba(121, 161, 232, 0.92)) !important;
    box-shadow: 0 0 18px rgba(133, 171, 238, 0.28) !important;
  }

  .bubble-button-background {
    background: rgba(255, 255, 255, 0.05) !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
  }

  .bubble-sub-button-1 {
    background: linear-gradient(180deg, rgba(76, 110, 151, 0.34), rgba(33, 43, 63, 0.56)) !important;
  }

  .bubble-sub-button-1 .bubble-name {
    font-weight: 600;
    letter-spacing: 0.02em;
  }
scrolling_effect: true
