type: custom:bubble-card
card_type: button
button_type: name
name: Locks
icon: mdi:shield-lock
entity: input_text.wall_display_entry_locks_status
show_state: true
button_action:
  tap_action:
    action: navigate
    navigation_path: "#wall-display-locks"
styles: |-
  ha-card {
    --bubble-border-radius: 28px !important;
    --bubble-box-shadow:
      0 8px 20px rgba(0, 0, 0, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      inset 0 0 18px rgba(255, 255, 255, 0.04) !important;
    --bubble-border: 1px solid rgba(255, 255, 255, 0.14) !important;
    --bubble-main-background-color: ${(() => {
      const state = (hass.states['input_text.wall_display_entry_locks_status']?.state || '').toLowerCase();
      if (state.includes('all ok') || state.includes('locked') || state.includes('secure')) {
        return 'rgba(40, 58, 60, 0.34)';
      }
      if (state.includes('pending') || state.includes('locking') || state.includes('unlocking')) {
        return 'rgba(45, 53, 71, 0.36)';
      }
      return 'rgba(62, 46, 43, 0.38)';
    })()} !important;
    --bubble-icon-background-color: rgba(255, 255, 255, 0.06) !important;
    backdrop-filter: blur(14px) saturate(1.2) !important;
    -webkit-backdrop-filter: blur(14px) saturate(1.2) !important;
  }

  .bubble-name,
  .bubble-state,
  .bubble-attribute {
    color: rgba(240, 243, 255, 0.92) !important;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.18);
  }

  .bubble-name {
    font-weight: 600 !important;
    letter-spacing: 0.01em;
    font-size: 0.96rem !important;
  }

  .bubble-state {
    color: ${(() => {
      const state = (hass.states['input_text.wall_display_entry_locks_status']?.state || '').toLowerCase();
      if (state.includes('all ok') || state.includes('locked') || state.includes('secure')) {
        return 'rgba(203, 232, 214, 0.88)';
      }
      if (state.includes('pending') || state.includes('locking') || state.includes('unlocking')) {
        return 'rgba(196, 212, 240, 0.86)';
      }
      return 'rgba(245, 208, 194, 0.9)';
    })()} !important;
    font-weight: 500 !important;
    font-size: 0.79rem !important;
    line-height: 1.1 !important;
  }

  .bubble-icon {
    color: rgba(245, 247, 255, 0.94) !important;
  }

  .bubble-icon-container {
    background: rgba(255, 255, 255, 0.06) !important;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.12),
      0 8px 20px rgba(0, 0, 0, 0.16) !important;
  }
sub_button:
  main: []
  bottom: []
grid_options:
  columns: 6
  rows: auto
