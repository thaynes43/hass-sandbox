type: custom:bubble-card
card_type: pop-up
hash: "#school-lunch-popup"
button_type: name
width_desktop: 75vw
show_header: true
name: School Lunch Menu
show_icon: true
icon: mdi:calendar
show_name: true
margin: 7px
scrolling_effect: false
sub_button:
  main: []
  bottom:
    - name: Back
      icon: mdi:arrow-left
      show_name: true
      show_icon: true
      tap_action:
        action: navigate
        navigation_path: "#"
tap_action:
  action: navigate
  navigation_path: "#"
button_action:
  tap_action:
    action: navigate
    navigation_path: "#"
cards:
  - type: custom:school-lunch-detail-card
    status_entity: sensor.school_lunch_menu
    selection_entity: input_text.school_lunch_selected_schools
    relay_script: school_lunch_relay
