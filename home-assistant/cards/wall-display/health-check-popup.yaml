type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#health-check-popup"
    button_type: name
    width_desktop: 75vw
    show_header: true
    name: System Health
    show_icon: true
    icon: mdi:heart-pulse
    show_name: true
    margin: 7px
    scrolling_effect: false
    sub_button:
      main: []
      bottom:
        - name: Back
          icon: mdi:arrow-left
          show_name: true
          show_icon: true
          tap_action:
            action: navigate
            navigation_path: "#"
    tap_action:
      action: navigate
      navigation_path: "#"
    button_action:
      tap_action:
        action: navigate
        navigation_path: "#"
  - type: custom:health-check-detail-card
    status_entity: sensor.health_check_status
    heartbeat_entity: input_datetime.appdaemon_heartbeat
    relay_script: health_check_relay
