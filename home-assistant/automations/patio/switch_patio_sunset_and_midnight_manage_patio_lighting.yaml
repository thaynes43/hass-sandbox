alias: "[Switch] : [Patio] : [Sunset and Midnight] : [Manage Patio Lighting]"
description: >
  Turn Patio Lighting on at sunset and off at midnight. Switch/relay entities go
  in the sunset_on homeassistant.turn_on list; lights that need a level get their
  own light.turn_on step (Tom 2026-10-20: patio Hue Discover flood 33 % at
  2850 K, pavilion fan light 33 %). Every entity also goes in the midnight_off
  homeassistant.turn_off list, which mixes switch and light domains.
mode: single
trigger:
  - platform: sun
    event: sunset
    id: sunset_on
  - platform: time
    at: "00:00:00"
    id: midnight_off
condition: []
action:
  - choose:
      - conditions:
          - condition: trigger
            id: sunset_on
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id:
                - switch.back_yard_retaining_wall_lights_relay
            data: {}
          - action: light.turn_on
            target:
              entity_id: light.patio_hue_discover_flood_light
            data:
              brightness_pct: 33
              color_temp_kelvin: 2850
          - action: light.turn_on
            target:
              entity_id: light.pavilion_fan_light
            data:
              brightness_pct: 33
      - conditions:
          - condition: trigger
            id: midnight_off
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id:
                - switch.back_yard_retaining_wall_lights_relay
                - light.patio_hue_discover_flood_light
                - light.pavilion_fan_light
            data: {}
