alias: "[Switch] : [Back Yard] : [Slider Opens] : [Turn On Spotlight]"
description: >-
  Turn on the back yard spotlight when the kitchen slider opens after dark.
  Turn-off is owned solely by the [All Clear 5m] automation, which requires a
  sustained all-clear - this automation must not race it with an
  instantaneous check.
mode: single
trigger:
  - platform: state
    entity_id: binary_sensor.kitchen_slider_usl_entry_contact
    from: "off"
    to: "on"
condition:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
action:
  - action: light.turn_on
    target:
      entity_id: light.downstairs_kitchen_back_yard_spotlight
    data: {}
