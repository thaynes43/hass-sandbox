# automation.rumpus_room_kefs_restore_volume_after_voice_music (created live via MCP, 2026-09-19).
# Pairs with the Play Music script's pre_actions; see .agents/plans/voice-assist-rollout.md (Phase 3).
alias: 'Rumpus Room KEFs: restore volume after voice music'
description: The KEFs are the Rumpus Room PC's speakers over HDMI and sit at a high fixed level for that.
  The Play Music script (blueprint inputs pre_actions + actions) saves that volume in input_number.rumpus_room_kef_saved_volume
  and starts voice music at 50%. Ten minutes after the music stops this puts the saved volume back, and
  clears the queue first so a later 'resume' cannot start at the restored level. 0 in the helper means
  nothing is saved.
triggers:
- trigger: state
  entity_id: media_player.ls50_wireless_ii_174476_4
  to:
  - idle
  - paused
  - 'off'
  for: 00:10:00
  id: stopped
- trigger: homeassistant
  event: start
  id: ha_start
conditions:
- condition: numeric_state
  entity_id: input_number.rumpus_room_kef_saved_volume
  above: 0.005
- condition: state
  entity_id: media_player.ls50_wireless_ii_174476_4
  state:
  - idle
  - paused
  - 'off'
actions:
- alias: Empty the queue so nothing can resume at the restored volume
  action: media_player.clear_playlist
  target:
    entity_id: media_player.ls50_wireless_ii_174476_4
- action: media_player.volume_set
  target:
    entity_id: media_player.ls50_wireless_ii_174476_4
  data:
    volume_level: '{{ states(''input_number.rumpus_room_kef_saved_volume'') | float(0.5) }}'
- alias: Mark nothing saved
  action: input_number.set_value
  target:
    entity_id: input_number.rumpus_room_kef_saved_volume
  data:
    value: 0
mode: single
