alias: '[Switch] : [Back Yard] : [Spa Lights] : [Manage Spotlight Auto Hold]'
description: 'When either spa light turns on, run Hot Tub Mode On: the backyard spotlight goes on auto
  hold and is turned off, so the bright flood light cannot come on while someone is in the hot tub. When
  a spa light leaves ''on'' and neither one is on any more (off or unavailable), run Hot Tub Mode Off
  to clear the hold. The hold parameters live in script.voice_hot_tub_mode_on/_off only. (2026-09-19:
  trigger entities corrected - the old id light.westford_spa_light_1 stopped existing in June.)'
triggers:
- trigger: state
  entity_id:
  - light.back_yard_westford_spa_light_1
  - light.back_yard_westford_spa_light_2
  to: 'on'
  id: spa_on
- trigger: state
  entity_id:
  - light.back_yard_westford_spa_light_1
  - light.back_yard_westford_spa_light_2
  from: 'on'
  id: spa_off
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id: spa_on
    sequence:
    - action: script.voice_hot_tub_mode_on
  - conditions:
    - condition: trigger
      id: spa_off
    - condition: not
      conditions:
      - condition: state
        entity_id:
        - light.back_yard_westford_spa_light_1
        - light.back_yard_westford_spa_light_2
        state: 'on'
        match: any
    sequence:
    - action: script.voice_hot_tub_mode_off
mode: restart
