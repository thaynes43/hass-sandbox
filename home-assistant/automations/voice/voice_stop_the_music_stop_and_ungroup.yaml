# automation.voice_stop_the_music_stop_and_ungroup (created live via MCP, 2026-09-19; id stripped).
# Sentence trigger, so it runs before Home Assistant's built-in intents, which treat "stop the music" as PAUSE
# and keep a speaker group together (the bedroom TV then also played in the bathroom). "Pause" is untouched.
# Music Assistant reports a PAUSED Sonos group as idle, so grouped players count as in scope even when
# idle; a group leader on its TV input keeps playing and only its followers are released.
alias: '[Voice] Stop the music = stop and ungroup'
description: 'Home Assistant''s built-in intent treats ''stop the music'' as PAUSE, which keeps a Sonos/Music
  Assistant group together - so when the bedroom soundbar then switched to the TV, the TV audio also played
  in the bathroom (Tom, 2026-09-19). This sentence trigger runs before the built-in intents: ''stop''
  really stops the music where the request comes from (or, if nothing plays there, wherever music is playing)
  and dissolves the group. ''Pause'' is untouched and keeps the group. A soundbar that is playing TV audio
  is never touched. 2026-09-20: ''stop ALL (the) music'', ''turn off all the music'' and ''ungroup the
  speakers'' were not matched, fell through to the AI agent and got HassTurnOff / HassMediaPause (nothing
  stopped, or the whole group paused); they are matched here now and mean everywhere. Other phrasings
  reach the agent, which has script.voice_stop_music.'
triggers:
- trigger: conversation
  command:
  - stop [all] [of] [the] music
  - stop [all] [the] music [in] here
  - stop [all] [the] music everywhere
  - stop [the] music [in] [the] [whole] house
  - stop playing [[all] [the] music]
  - stop [the] song
  - turn off [all] the music
  - turn [all] the music off
  - turn the music off everywhere
  - music off
  - ungroup the speakers
  - stop [the] music and ungroup [the speakers]
actions:
- variables:
    area: '{{ area_id(trigger.device_id) if trigger.device_id else '''' }}'
- variables:
    here: '{{ (area_entities(area) | select(''in'', integration_entities(''music_assistant'')) | select(''match'',
      ''media_player\.'') | reject(''is_state'', ''unavailable'') | reject(''is_state'', ''unknown'')
      | first | default('''', true)) if area else '''' }}'
- alias: 'Scope: a player counts when it is GROUPED (Music Assistant reports a paused Sonos group as idle,
    and an idle group is exactly what leaks TV audio later) or when it plays/pauses music that is not
    the TV input. This room when it counts, otherwise - or when the sentence says ''everywhere'', ''all'',
    ''house'' or ''ungroup'' - every such player. script.voice_stop_music applies the same rule for requests
    that reach the AI agent'
  variables:
    active: '{% set said = '' '' ~ (trigger.sentence | default('''', true) | lower) ~ '' '' %}{% set everywhere
      = ''everywhere'' in said or '' all '' in said or ''house'' in said or ''ungroup'' in said %}{% set
      ns = namespace(p=[]) %}{% for p in integration_entities(''music_assistant'') | select(''match'',
      ''media_player\.'') | list %}{% if (state_attr(p, ''group_members'') or []) | count > 1 or (states(p)
      in [''playing'', ''paused''] and state_attr(p, ''source'') != ''TV'') %}{% set ns.p = ns.p + [p]
      %}{% endif %}{% endfor %}{{ [here] if not everywhere and here in ns.p else ns.p }}'
- variables:
    leaders: '{% set ns = namespace(l=[]) %}{% for p in active %}{% set g = state_attr(p, ''group_members'')
      or [] %}{% set ns.l = ns.l + [(g | first) if g else p] %}{% endfor %}{{ ns.l | unique | list }}'
- variables:
    followers: '{% set ns = namespace(f=[]) %}{% for l in leaders %}{% set ns.f = ns.f + ((state_attr(l,
      ''group_members'') or []) | reject(''eq'', l) | list) %}{% endfor %}{{ ns.f | unique | list }}'
- alias: 'A leader that is on its TV input keeps playing the TV: only its followers are released'
  variables:
    stop_list: '{% set ns = namespace(s=[]) %}{% for l in leaders %}{% if state_attr(l, ''source'') !=
      ''TV'' and states(l) in [''playing'', ''paused''] %}{% set ns.s = ns.s + [l] %}{% endif %}{% endfor
      %}{{ ns.s }}'
- if:
  - condition: template
    value_template: '{{ stop_list | count == 0 and followers | count == 0 }}'
  then:
  - set_conversation_response: No music is playing.
  - stop: Nothing to stop
- if:
  - condition: template
    value_template: '{{ stop_list | count > 0 }}'
  then:
  - action: media_player.media_stop
    continue_on_error: true
    target:
      entity_id: '{{ stop_list }}'
- if:
  - condition: template
    value_template: '{{ followers | count > 0 }}'
  then:
  - action: media_player.unjoin
    continue_on_error: true
    target:
      entity_id: '{{ followers }}'
- set_conversation_response: Stopped.
mode: queued
max: 3
