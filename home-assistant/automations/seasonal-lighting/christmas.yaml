id: '1793559895748'
alias: '[Light] : [Front Yard] : [Sun Sets] : [Christmas Colors]'
description: 'From Nov 27 2026 (day after Thanksgiving), red, green and warm gold on the 17 core Hue lights plus
  a warmer amber lamp post (HS28/100). Continues until superseded: enabling Get Jolly or ordinary ambient sunset
  lighting prevents this automation from applying its palette. No Zooz outlets, Hue strings, Twinkly or trees. Existing
  midnight ambient off remains. Visitor-only lanterns managed separately. Local HA timezone.'
triggers:
- trigger: sun.sunset
  id: sunset
- trigger: homeassistant
  event: start
  id: recovery
- trigger: event
  event_type: automation_reloaded
  id: recovery
conditions:
- condition: template
  value_template: '{{ now().strftime(''%Y-%m-%d'') >= ''2026-11-27'' }}'
- condition: state
  entity_id: automation.light_front_yard_sun_sets_during_christmas_get_jolly
  state: 'off'
- condition: state
  entity_id: automation.light_front_yard_at_sunset_turn_on
  state: 'off'
- condition: sun.is_set
- condition: time
  after: '12:00:00'
actions:
- alias: Apply the palette twice, pacing individual Hue commands to catch mesh misses
  repeat:
    count: 2
    sequence:
    - repeat:
        for_each: '{{ seasonal_lights }}'
        sequence:
        - if:
          - condition: state
            entity_id: automation.light_front_yard_sun_sets_during_christmas_get_jolly
            state: 'off'
          - condition: state
            entity_id: automation.light_front_yard_at_sunset_turn_on
            state: 'off'
          - condition: template
            value_template: '{{ has_value(repeat.item.entity_id) }}'
          then:
          - action: light.turn_on
            target:
              entity_id: '{{ repeat.item.entity_id }}'
            data:
              hs_color: '{{ palette[repeat.item.color] }}'
              brightness_pct: '{{ repeat.item.brightness }}'
              transition: 5
            continue_on_error: true
        - delay:
            milliseconds: 400
    - delay:
        seconds: 5
variables:
  palette:
  - - 0
    - 100
  - - 120
    - 100
  - - 45
    - 45
  - - 0
    - 100
  - - 28
    - 100
  seasonal_lights:
  - entity_id: light.front_yard_left_hue_calla_01
    color: 0
    brightness: 85
  - entity_id: light.front_yard_left_hue_calla_02
    color: 1
    brightness: 85
  - entity_id: light.front_yard_left_hue_calla_03
    color: 2
    brightness: 85
  - entity_id: light.front_yard_left_hue_calla_04
    color: 3
    brightness: 85
  - entity_id: light.front_yard_right_hue_calla_01
    color: 0
    brightness: 85
  - entity_id: light.front_yard_right_hue_calla_02
    color: 1
    brightness: 85
  - entity_id: light.front_yard_right_hue_calla_03
    color: 2
    brightness: 85
  - entity_id: light.front_yard_right_hue_calla_04
    color: 3
    brightness: 85
  - entity_id: light.front_yard_left_hue_lily_01
    color: 2
    brightness: 90
  - entity_id: light.front_yard_left_hue_lily_02
    color: 0
    brightness: 90
  - entity_id: light.front_yard_left_hue_lily_03
    color: 1
    brightness: 90
  - entity_id: light.front_yard_right_hue_lily_01
    color: 1
    brightness: 90
  - entity_id: light.front_yard_right_hue_lily_02
    color: 3
    brightness: 90
  - entity_id: light.front_yard_right_hue_lily_03
    color: 2
    brightness: 90
  - entity_id: light.outdoor_front_porch_hue_recessed_01
    color: 0
    brightness: 65
  - entity_id: light.outdoor_front_porch_hue_recessed_02
    color: 1
    brightness: 65
  - entity_id: light.outdoor_front_porch_hue_recessed_03
    color: 2
    brightness: 65
  - entity_id: light.front_yard_lamp_post_hue_edison
    color: 4
    brightness: 75
mode: single
trace:
  stored_traces: 10
