id: '1770265925289'
alias: '[Media] [Basement] [Movie Room] : [No Occupancy] : [TV Off]'
description: |
  Unified empty-room shutdown for the Movie Room. It owns every vacancy shutoff
  of the TV and both light groups; nothing else turns them off early.
  Armed while BOTH sensors report off and either the TV is confirmed active
  (anything but off/unavailable/unknown) or a Movie Room light group is on with
  no light hold. A hold is LED1 at the manual/auto hold colour, or the lights
  automation (No Motion Turns Off Lights) being off: Cleaners Mode, the manual
  hold button or the dashboard toggle. Its brief unavailable state while it is
  reloaded is not a hold.
  A vacancy edge waits a silent absence window of max(TV delay helper minus 5
  minutes, 0), currently 15 minutes, then counts down 15, 10, 5 and 1 minutes,
  waiting 5/5/4/1 minutes AFTER each step. With the TV confirmed active each step
  is announced, so at least 15 minutes follow the first warning. A lights-only
  countdown (TV not confirmed active) is silent with the same timing.
  Recheck triggers (lights automation re-enabled, any LED1 change, HA start,
  any automation reload, either light group turning on) skip the absence window
  and start the countdown immediately when the room is already vacant, but never
  interrupt a countdown that is running.
  A manual cancel sticks (Tom, ruling Q6): when a person turns the pending toggle
  off while no sensor reports occupancy, input_boolean.basement_movie_room_tv_auto_off_cancelled
  turns on and no countdown starts again (no recheck, vacancy or TV edge) until
  either sensor reports occupancy or the TV has been off for a minute (a TV
  connection blip does not count).
  Occupancy or any sensor not reporting off, a hold during a lights-only
  countdown, or cancelling the pending toggle aborts the whole run. Lights go
  off only at the final hold-checked step; the TV off command is sent only when
  the TV is confirmed active. TV unavailable/unknown is neither active nor an
  exemption. A TV active/inactive edge starts a fresh full cycle. Light holds
  never change the TV auto-off policy. No actions continue after a failed
  announcement.
triggers:
  - trigger: template
    id: room_empty
    value_template: '{{ is_state(''binary_sensor.basement_movie_inovelli_presence_occupancy'', ''off'') and
      is_state(''binary_sensor.basement_rumpus_room_aqara_fp2_01_presence_sensor'', ''off'') }}'
  - trigger: template
    id: room_not_empty
    value_template: '{{ not (is_state(''binary_sensor.basement_movie_inovelli_presence_occupancy'', ''off'')
      and is_state(''binary_sensor.basement_rumpus_room_aqara_fp2_01_presence_sensor'', ''off'')) }}'
  - trigger: template
    id: tv_active
    value_template: '{{ states(''media_player.lg_webos_tv_oled83g4wua'') not in [''off'', ''unavailable'',
      ''unknown''] }}'
  - trigger: template
    id: tv_inactive
    value_template: '{{ not (states(''media_player.lg_webos_tv_oled83g4wua'') not in [''off'', ''unavailable'',
      ''unknown'']) }}'
  - trigger: state
    entity_id: input_boolean.basement_movie_room_tv_auto_off_enabled
    to: 'off'
    id: pending_cancelled
  - alias: Occupancy detected (ends a manual cancel)
    trigger: state
    entity_id:
      - binary_sensor.basement_movie_inovelli_presence_occupancy
      - binary_sensor.basement_rumpus_room_aqara_fp2_01_presence_sensor
    to: 'on'
    id: occupancy_detected
  - alias: TV off for a minute (ends a manual cancel; a connection blip does not)
    trigger: state
    entity_id: media_player.lg_webos_tv_oled83g4wua
    not_from:
      - 'off'
      - unavailable
      - unknown
    to:
      - 'off'
      - unavailable
      - unknown
    for: '00:01:00'
    id: tv_off_settled
  - alias: Hold released (Cleaners Mode clear-hold, manual hold button or dashboard toggle)
    trigger: state
    entity_id: automation.light_inovelli_movie_room_motion_cleared_lights_off
    from: 'off'
    to: 'on'
    id: recheck
  - alias: LED1 changed (a hold-clear script can re-enable the automation before LED1 confirms)
    trigger: state
    entity_id: number.basement_movie_inovelli_presence_defaultled1colorwhenon
    not_to:
      - unavailable
      - unknown
    id: recheck
  - alias: A Movie Room light group turned on (paddle, app, voice or dashboard)
    trigger: state
    entity_id:
      - light.basement_movie_room_lights
      - light.basement_movie_room_ambient_lighting
    to: 'on'
    id: recheck
  - trigger: homeassistant
    event: start
    id: recheck
  - trigger: event
    event_type: automation_reloaded
    id: recheck
conditions:
  - alias: A manual cancel blocks every start until occupancy or a settled TV off; a recheck never interrupts a countdown in progress
    condition: template
    value_template: >-
      {{ (trigger.id == 'tv_off_settled'
          and is_state('input_boolean.basement_movie_room_tv_auto_off_cancelled', 'on'))
         or trigger.id not in ['room_empty', 'tv_active', 'tv_inactive', 'recheck', 'tv_off_settled']
         or (trigger.id != 'tv_off_settled'
             and (not is_state('input_boolean.basement_movie_room_tv_auto_off_cancelled', 'on')
                  or is_state('binary_sensor.basement_movie_inovelli_presence_occupancy', 'on')
                  or is_state('binary_sensor.basement_rumpus_room_aqara_fp2_01_presence_sensor', 'on'))
             and (trigger.id != 'recheck' or (this.attributes.current | int(0)) == 0)) }}
actions:
  - alias: Occupancy (an edge, or a sensor reading on now) or a settled TV off ends a manual cancel
    if:
      - condition: state
        entity_id: input_boolean.basement_movie_room_tv_auto_off_cancelled
        state: 'on'
      - condition: or
        conditions:
          - condition: trigger
            id:
              - occupancy_detected
              - tv_off_settled
          - condition: state
            entity_id: binary_sensor.basement_movie_inovelli_presence_occupancy
            state: 'on'
          - condition: state
            entity_id: binary_sensor.basement_rumpus_room_aqara_fp2_01_presence_sensor
            state: 'on'
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.basement_movie_room_tv_auto_off_cancelled
  - choose:
      - conditions:
          - condition: trigger
            id:
              - room_not_empty
              - pending_cancelled
              - occupancy_detected
        sequence:
          - &clear_pending
            action: input_boolean.turn_off
            target:
              entity_id: input_boolean.basement_movie_room_tv_auto_off_enabled
          - alias: A person turning the pending toggle off is a manual cancel, which sticks
            if:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'pending_cancelled' and trigger.to_state.context.user_id is not none
                     and not (is_state('binary_sensor.basement_movie_inovelli_presence_occupancy', 'on')
                              or is_state('binary_sensor.basement_rumpus_room_aqara_fp2_01_presence_sensor', 'on')) }}
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.basement_movie_room_tv_auto_off_cancelled
      - conditions:
          - condition: trigger
            id:
              - room_empty
              - tv_active
              - tv_inactive
              - recheck
              - tv_off_settled
          - alias: Vacant, and TV confirmed active or lights on with no hold
            condition: template
            value_template: >-
              {% set tv = states('media_player.lg_webos_tv_oled83g4wua') %}
              {% set led = states('number.basement_movie_inovelli_presence_defaultled1colorwhenon') | int(-1) %}
              {% set held = is_state('automation.light_inovelli_movie_room_motion_cleared_lights_off', 'off')
                 or led in [states('input_text.inovelli_manual_hold') | int(85), states('input_text.inovelli_auto_hold') | int(0)] %}
              {% set lights = is_state('light.basement_movie_room_lights', 'on')
                 or is_state('light.basement_movie_room_ambient_lighting', 'on') %}
              {{ is_state('binary_sensor.basement_movie_inovelli_presence_occupancy', 'off')
                 and is_state('binary_sensor.basement_rumpus_room_aqara_fp2_01_presence_sensor', 'off')
                 and (tv not in ['off', 'unavailable', 'unknown'] or (lights and not held)) }}
        sequence:
          - alias: Abort the whole shutdown on any service failure; always clear pending
            continue_on_error: true
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.basement_movie_room_tv_auto_off_enabled
              - variables:
                  pre_warning_seconds: |-
                    {% set d = (states('input_select.basement_movie_room_tv_auto_off_delay')
                      | replace('"','')
                      | replace("'",'')
                      | trim) %}
                    {% set d = d if d not in ['unknown','unavailable',''] else '00:20:00' %}
                    {% set td = as_timedelta(d) %}
                    {% set total_s = (td.total_seconds() | int(1200)) %}
                    {% set pre = (total_s - 300) %}
                    {{ 0 if trigger.id == 'recheck' else (pre if pre > 0 else 0) }}
              - wait_template: &disarmed >-
                  {% set tv = states('media_player.lg_webos_tv_oled83g4wua') %}
                  {% set led = states('number.basement_movie_inovelli_presence_defaultled1colorwhenon') | int(-1) %}
                  {% set held = is_state('automation.light_inovelli_movie_room_motion_cleared_lights_off', 'off')
                     or led in [states('input_text.inovelli_manual_hold') | int(85), states('input_text.inovelli_auto_hold') | int(0)] %}
                  {% set lights = is_state('light.basement_movie_room_lights', 'on')
                     or is_state('light.basement_movie_room_ambient_lighting', 'on') %}
                  {{ not (is_state('binary_sensor.basement_movie_inovelli_presence_occupancy', 'off')
                     and is_state('binary_sensor.basement_rumpus_room_aqara_fp2_01_presence_sensor', 'off')
                     and (tv not in ['off', 'unavailable', 'unknown'] or (lights and not held))
                     and is_state('input_boolean.basement_movie_room_tv_auto_off_enabled', 'on')) }}
                timeout:
                  seconds: '{{ pre_warning_seconds | int(0) }}'
                continue_on_timeout: true
              - &cancel_if_invalid
                if:
                  - condition: template
                    value_template: *disarmed
                then:
                  - *clear_pending
                  - stop: 'Shutdown cancelled: occupancy, TV state, light hold, or pending toggle changed'
              - repeat:
                  for_each:
                    - remaining: 15
                      wait: 5
                    - remaining: 10
                      wait: 5
                    - remaining: 5
                      wait: 4
                    - remaining: 1
                      wait: 1
                  sequence:
                    - *cancel_if_invalid
                    - alias: Speak only when the TV is confirmed active; a lights-only countdown is silent
                      if:
                        - &tv_confirmed_active
                          condition: not
                          conditions:
                            - condition: state
                              entity_id: media_player.lg_webos_tv_oled83g4wua
                              state:
                                - 'off'
                                - unavailable
                                - unknown
                      then:
                        - action: assist_satellite.announce
                          target:
                            entity_id: assist_satellite.movie_room_voice_assist_satellite
                          data:
                            preannounce: true
                            message: Movie Room appears empty. Turning off the TV and lights in {{ repeat.item.remaining
                              }} minute{{ '' if repeat.item.remaining == 1 else 's' }}.
                    - wait_template: *disarmed
                      timeout:
                        minutes: '{{ repeat.item.wait }}'
                      continue_on_timeout: true
                    - *cancel_if_invalid
              - *cancel_if_invalid
              - if:
                  - alias: No light hold (LED1 hold colour or lights automation off)
                    condition: template
                    value_template: |
                      {% set s = 'basement_movie_inovelli_presence' %}
                      {% set manual = states('input_text.inovelli_manual_hold') | int(85) %}
                      {% set auto = states('input_text.inovelli_auto_hold') | int(0) %}
                      {% set led1 = states('number.' ~ s ~ '_defaultled1colorwhenon') | int(-1) %}
                      {{ led1 != manual and led1 != auto
                         and not is_state('automation.light_inovelli_movie_room_motion_cleared_lights_off', 'off') }}
                then:
                  - *cancel_if_invalid
                  - action: light.turn_off
                    target:
                      entity_id:
                        - light.basement_movie_room_lights
                        - light.basement_movie_room_ambient_lighting
              - alias: TV off command only when the TV is confirmed active
                if:
                  - *tv_confirmed_active
                then:
                  - *cancel_if_invalid
                  - action: media_player.turn_off
                    target:
                      entity_id: media_player.lg_webos_tv_oled83g4wua
          - *clear_pending
    default:
      - *clear_pending
trace:
  stored_traces: 20
mode: restart
