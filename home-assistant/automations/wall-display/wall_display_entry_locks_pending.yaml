alias: Wall Display - Entry Locks Pending
description: >-
  UI feedback for Schlage locks: tapping sets per-lock pending helper
  (idle/locking/unlocking/error). This automation issues the lock/unlock and clears
  pending when state matches or after 60s timeout.
mode: parallel
max: 10
trigger:
  - platform: state
    entity_id:
      - input_select.front_door_lock_pending
      - input_select.side_door_lock_pending
      - input_select.bulkhead_lock_pending
      - input_select.mudroom_lock_pending
    to:
      - locking
      - unlocking
variables:
  lock_map:
    input_select.front_door_lock_pending: lock.front_door_lock
    input_select.side_door_lock_pending: lock.side_door_lock
    input_select.bulkhead_lock_pending: lock.bulkhead_lock
    input_select.mudroom_lock_pending: lock.mudroom_door_lock
action:
  - variables:
      pending_entity: "{{ trigger.entity_id }}"
      pending_action: "{{ trigger.to_state.state }}"
      lock_entity: "{{ lock_map[trigger.entity_id] }}"
      target_state: "{{ 'locked' if trigger.to_state.state == 'locking' else 'unlocked' }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_state(lock_entity, target_state) }}"
        sequence:
          - service: input_select.select_option
            data:
              entity_id: "{{ pending_entity }}"
              option: idle
    default:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ pending_action == 'locking' }}"
            sequence:
              - service: lock.lock
                data:
                  entity_id: "{{ lock_entity }}"
          - conditions:
              - condition: template
                value_template: "{{ pending_action == 'unlocking' }}"
            sequence:
              - service: lock.unlock
                data:
                  entity_id: "{{ lock_entity }}"
      - wait_template: "{{ is_state(lock_entity, target_state) }}"
        timeout: "00:01:00"
        continue_on_timeout: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ is_state(lock_entity, target_state) }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: "{{ pending_entity }}"
                  option: idle
        default:
          - service: input_select.select_option
            data:
              entity_id: "{{ pending_entity }}"
              option: error
