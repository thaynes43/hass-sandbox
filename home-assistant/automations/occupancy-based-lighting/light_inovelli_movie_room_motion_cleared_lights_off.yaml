id: '1769402249599'
alias: '[Light] [Inovelli] : [Movie Room] : [Motion Cleared] : [Lights Off]'
description: |
  Enable switch for Movie Room vacancy light shutoff ("No Motion Turns Off
  Lights" on the dashboard). It has no triggers and turns nothing off itself:
  the unified countdown, automation.media_basement_movie_room_no_occupancy_tv_off,
  owns every vacancy shutoff (Tom, 2026-10-19). The separate silent 5-minute
  TV-off lights cleanup that used to live here was removed.
  While this automation is off (Cleaners Mode, the manual hold button or the
  dashboard toggle), the countdown treats the lights as held and leaves them on.
  Turning it back on makes the countdown re-check the room and, if it is
  already vacant with lights on, start immediately.
triggers: []
conditions: []
actions: []
mode: restart
