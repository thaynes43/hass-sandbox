alias: "[Switch] : [Back Yard] : [Camera Detects Person or Animal] : [Turn On Spotlight]"
description: >-
  Turn on the back yard spotlight when the AI Pro or Shed PTZ camera detects a
  person or animal after dark. Uses entity_id state triggers (device triggers
  went stale when the PTZ was re-adopted and silently stopped firing).
mode: single
trigger:
  - platform: state
    entity_id: binary_sensor.back_yard_ai_pro_person_detected
    to: "on"
  - platform: state
    entity_id: binary_sensor.back_yard_ai_pro_animal_detected
    to: "on"
  - platform: state
    entity_id: binary_sensor.shed_g5_ptz_person_detected
    to: "on"
  - platform: state
    entity_id: binary_sensor.shed_g5_ptz_animal_detected
    to: "on"
condition:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
action:
  - action: light.turn_on
    target:
      entity_id: light.downstairs_kitchen_back_yard_spotlight
    data: {}
