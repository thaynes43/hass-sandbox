alias: "[Light] [Inovelli] : [Garage] : [Motion Cleared] : [Lights Off]"
description: >-
  Turn off the garage interior lights once both garage mmWave switches report
  clear, after the configurable zone off delay. Door-closed triggers cover the
  case where a door opening turned the lights on but nobody entered, so the
  all-clear template never re-fired.
triggers:
  - trigger: template
    value_template: |
      {{
        is_state('binary_sensor.garage_interior_mudroom_inovelli_presence_occupancy', 'off')
        and is_state('binary_sensor.garage_interior_side_inovelli_presence_occupancy', 'off')
      }}
  - trigger: state
    entity_id:
      - binary_sensor.usl_entry_contact_2
    from: "on"
    to: "off"
  - trigger: state
    entity_id:
      - cover.ratgdov25i_4a0325_door
      - cover.ratgdov25i_dbfa50_door
    to: closed
conditions: []
actions:
  - condition: template
    value_template: |
      {# Only run when hold is clear #}
      {% set s = 'garage_interior_mudroom_inovelli_presence' %}
      {% set manual = states('input_text.inovelli_manual_hold') | int(85) %}
      {% set auto = states('input_text.inovelli_auto_hold') | int(0) %}
      {% set led1 = states('number.' ~ s ~ '_defaultled1colorwhenon') | int(-1) %}
      {{ led1 != manual and led1 != auto }}
  - condition: template
    value_template: |
      {{
        is_state('binary_sensor.garage_interior_mudroom_inovelli_presence_occupancy', 'off')
        and is_state('binary_sensor.garage_interior_side_inovelli_presence_occupancy', 'off')
      }}
  - delay: >-
      {% set raw = states('input_select.garage_occupancy_off_delay') %}
      {% set d = raw | replace('"','') | replace("'","") | trim %}
      {{ d if d not in ['unknown','unavailable',''] else '00:02:00' }}
  - condition: template
    value_template: |
      {{
        is_state('binary_sensor.garage_interior_mudroom_inovelli_presence_occupancy', 'off')
        and is_state('binary_sensor.garage_interior_side_inovelli_presence_occupancy', 'off')
      }}
  - condition: template
    value_template: |
      {# Re-check hold state after the delay #}
      {% set s = 'garage_interior_mudroom_inovelli_presence' %}
      {% set manual = states('input_text.inovelli_manual_hold') | int(85) %}
      {% set auto = states('input_text.inovelli_auto_hold') | int(0) %}
      {% set led1 = states('number.' ~ s ~ '_defaultled1colorwhenon') | int(-1) %}
      {{ led1 != manual and led1 != auto }}
  - action: light.turn_off
    metadata: {}
    target:
      entity_id: light.garage_interior_lights
    data: {}
mode: restart
