# Tom Mobile dashboard (url_path: tom-mobile) — repo backup of the storage-mode dashboard.
# Source of truth is the live HA dashboard; regenerate/apply via MCP (see agent-docs/tom-mobile-dashboard.md).
views:
- type: sections
  max_columns: 1
  icon: mdi:cellphone
  cards: []
  header:
    card:
      type: markdown
      text_only: true
      content: '# Welcome Tom! 🛠️'
  sections:
  - type: grid
    cards:
    - type: custom:bubble-card
      card_type: separator
      name: Outdoors
      icon: mdi:pine-tree
      sub_button:
        main: []
        bottom: []
    - type: custom:bubble-card
      card_type: button
      button_type: name
      name: Outdoor Lights
      icon: mdi:outdoor-lamp
      entity: light.downstairs_kitchen_back_yard_spotlight
      card_layout: large-sub-buttons-grid
      button_action:
        tap_action:
          action: none
      sub_button:
        main: []
        bottom:
        - entity: light.front_yard_hue_calla_lights
          name: Calla
          icon: mdi:flower
          show_name: true
          show_icon: true
          show_state: false
          tap_action:
            action: toggle
        - entity: light.front_yard_hue_lily_lights
          name: Lily
          icon: mdi:flower-tulip
          show_name: true
          show_icon: true
          show_state: false
          tap_action:
            action: toggle
        - entity: light.downstairs_kitchen_back_yard_spotlight
          name: Floodlight
          icon: mdi:spotlight-beam
          show_name: true
          show_icon: true
          show_state: false
          tap_action:
            action: toggle
        - entity: automation.switch_back_yard_slider_opens_turn_on_spotlight
          name: Flood Hold
          icon: mdi:hand-back-left
          show_name: true
          show_icon: true
          show_state: false
          tap_action:
            action: perform-action
            perform_action: script.inovelli_toggle_mmwave_hold_led_indicator
            target: {}
            data:
              switch_name: downstairs_kitchen_back_yard_spotlight
              hold_color: input_text.inovelli_manual_hold
              prev_led_color_helper: input_number.outdoor_light_inovelli_led_color
              automation_entity_ids:
              - automation.switch_back_yard_slider_opens_turn_on_spotlight
              - automation.switch_back_yard_camera_detects_motion_turn_on_lights
              - automation.switch_back_yard_camera_stops_detecting_motion_turn_off_spotlight
        bottom_layout: rows
      styles: ".bubble-sub-button-1,\n.bubble-sub-button-2,\n.bubble-sub-button-3,\n.bubble-sub-button-4\
        \ {\n  transition: background-color 200ms ease;\n}\n.bubble-sub-button-1 {\n  background-color:\
        \ ${(() => {\n    return hass.states['light.front_yard_hue_calla_lights']?.state === 'on'\n  \
        \    ? 'rgba(var(--rgb-accent-color), 0.45)' : 'rgba(0,0,0,0.22)';\n  })()} !important;\n}\n.bubble-sub-button-2\
        \ {\n  background-color: ${(() => {\n    return hass.states['light.front_yard_hue_lily_lights']?.state\
        \ === 'on'\n      ? 'rgba(var(--rgb-accent-color), 0.45)' : 'rgba(0,0,0,0.22)';\n  })()} !important;\n\
        }\n.bubble-sub-button-3 {\n  background-color: ${(() => {\n    return hass.states['light.downstairs_kitchen_back_yard_spotlight']?.state\
        \ === 'on'\n      ? 'rgba(var(--rgb-accent-color), 0.45)' : 'rgba(0,0,0,0.22)';\n  })()} !important;\n\
        }\n${subButtonIcon[3].setAttribute(\"icon\", hass.states['automation.switch_back_yard_slider_opens_turn_on_spotlight']?.state\
        \ === 'off' ? 'mdi:lock' : 'mdi:hand-back-left')}\n.bubble-sub-button-4 {\n  background-color:\
        \ ${(() => {\n    return hass.states['automation.switch_back_yard_slider_opens_turn_on_spotlight']?.state\
        \ === 'off'\n      ? 'rgba(255, 179, 0, 0.35)' : 'rgba(0,0,0,0.22)';\n  })()} !important;\n}"
      rows: 1.719
      slider_fill_orientation: left
      slider_value_position: right
