      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: media_player.str_az5000es
        name: Receiver
        icon: mdi:power
        show_state: false
        min_value: 15
        max_value: 62
        tap_action:
          action: toggle
        card_layout: large-sub-buttons-grid
        rows: 1.719
        visibility:
        - condition: state
          entity: media_player.str_az5000es
          state: 'on'
        sub_button:
          main: []
          bottom:
          - name: Volume
            buttons_layout: inline
            group:
            - name: Down
              icon: mdi:volume-minus
              show_name: false
              show_icon: true
              tap_action:
                action: perform-action
                perform_action: script.voice_movie_room_receiver_volume
                target: {}
                data:
                  action: down
                  db: 1
            - entity: sensor.movie_room_receiver_volume
              name: Volume
              show_name: false
              show_icon: false
              show_state: true
              tap_action:
                action: none
            - name: Up
              icon: mdi:volume-plus
              show_name: false
              show_icon: true
              tap_action:
                action: perform-action
                perform_action: script.voice_movie_room_receiver_volume
                target: {}
                data:
                  action: up
                  db: 1
