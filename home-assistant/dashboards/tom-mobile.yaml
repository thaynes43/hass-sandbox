              action: more-info
          - entity: sensor.shed_ebike_power_switch_electric_consumption_w
            name: Draw
            show_name: false
            show_icon: false
            show_state: true
            tap_action:
              action: more-info
          bottom: []
        styles: "${subButtonIcon[0].setAttribute(\"icon\", (() => {\n  const charging = hass.states['binary_sensor.e_bike_charging']?.state\
          \ === 'on';\n  const on = hass.states['switch.shed_ebike_power_switch']?.state === 'on';\n \
          \ if (charging) return 'mdi:battery-charging';\n  if (on) return 'mdi:battery-check';\n  return\
          \ 'mdi:power-plug-off';\n})())}\n@keyframes chargePulse {\n  0% { filter: brightness(1); }\n\
          \  50% { filter: brightness(1.25); }\n  100% { filter: brightness(1); }\n}\n.bubble-sub-button-1\
          \ {\n  transition: background-color 200ms ease;\n  background-color: ${(() => {\n    const charging\
          \ = hass.states['binary_sensor.e_bike_charging']?.state === 'on';\n    const on = hass.states['switch.shed_ebike_power_switch']?.state\
          \ === 'on';\n    if (charging) return 'rgba(76, 175, 80, 0.35)';\n    if (on) return 'rgba(var(--rgb-accent-color),\
          \ 0.35)';\n    return 'rgba(0,0,0,0.22)';\n  })()} !important;\n  animation: ${(() => {\n  \
          \  return hass.states['binary_sensor.e_bike_charging']?.state === 'on'\n      ? 'chargePulse\
          \ 1.2s ease-in-out infinite' : 'none';\n  })()} !important;\n}"
