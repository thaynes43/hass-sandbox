      styles: ".bubble-sub-button-1,\n.bubble-sub-button-2,\n.bubble-sub-button-3,\n.bubble-sub-button-4\
        \ {\n  transition: background-color 200ms ease;\n}\n.bubble-sub-button-1 {\n  background-color:\
        \ ${(() => {\n    const active = 'rgba(var(--rgb-accent-color), 0.45)';\n    const inactive =\
        \ 'rgba(0,0,0,0.22)';\n    const bed = hass.states['light.upstairs_primary_bed_lights']?.state;\n\
        \    const night = hass.states['light.upstairs_primary_nightstand_lights']?.state;\n    return\
        \ (bed === 'off' && night === 'off') ? active : inactive;\n  })()} !important;\n}\n.bubble-sub-button-2\
        \ {\n  background-color: ${(() => {\n    const active = 'rgba(var(--rgb-accent-color), 0.45)';\n\
        \    const inactive = 'rgba(0,0,0,0.22)';\n    const bed = hass.states['light.upstairs_primary_bed_lights']?.state;\n\
        \    const nightEnt = hass.states['light.upstairs_primary_nightstand_lights'];\n    const night\
        \ = nightEnt?.state;\n    const b = nightEnt?.attributes?.brightness;\n    const pct = b == null\
        \ ? 0 : (b / 255) * 100;\n    return (bed === 'off' && night === 'on' && pct <= 30) ? active :\
        \ inactive;\n  })()} !important;\n}\n.bubble-sub-button-3 {\n  background-color: ${(() => {\n\
        \    const active = 'rgba(var(--rgb-accent-color), 0.45)';\n    const inactive = 'rgba(0,0,0,0.22)';\n\
        \    const bedEnt = hass.states['light.upstairs_primary_bed_lights'];\n    const bed = bedEnt?.state;\n\
        \    const b = bedEnt?.attributes?.brightness;\n    const pct = b == null ? 0 : (b / 255) * 100;\n\
        \    if (bed !== 'on') return inactive;\n    return pct <= 40 ? active : inactive;\n  })()} !important;\n\
        }\n.bubble-sub-button-4 {\n  background-color: ${(() => {\n    const active = 'rgba(var(--rgb-accent-color),\
        \ 0.45)';\n    const inactive = 'rgba(0,0,0,0.22)';\n    const bedEnt = hass.states['light.upstairs_primary_bed_lights'];\n\
        \    const bed = bedEnt?.state;\n    const b = bedEnt?.attributes?.brightness;\n    const pct\
        \ = b == null ? 0 : (b / 255) * 100;\n    if (bed !== 'on') return inactive;\n    return pct >\
        \ 40 ? active : inactive;\n  })()} !important;\n}"
