input_select:
  wall_display_photo_frame_image:
    name: Wall Display Photo Frame Image
    icon: mdi:image-multiple
    options:
      - "(loading...)"

input_boolean:
  wall_display_photo_frame_paused:
    name: Wall Display Photo Frame Paused
    icon: mdi:pause-circle-outline

input_number:
  wall_display_photo_frame_interval_seconds:
    name: Wall Display Photo Frame Interval (Seconds)
    icon: mdi:timer-outline
    min: 3
    max: 120
    step: 1
    mode: slider
    unit_of_measurement: s
    initial: 10

input_text:
  wall_display_photo_frame_cache_bust:
    name: Wall Display Photo Frame Cache Bust
    icon: mdi:cache
    max: 64

