alias: Set Primary Bedroom to Sleep
description: Turn off all Primary Bedroom lights.
mode: single
sequence:
  - action: light.turn_off
    target:
      entity_id:
        - light.upstairs_primary_nightstand_lights
        - light.upstairs_primary_bed_lights
        - light.upstairs_primary_nook_lights
        - light.upstairs_primary_hall_lights
        - light.upstairs_primary_closet_lights
