alias: Set Primary Bedroom to Bedtime
description: Turn off bedroom lights except nightstands at ~20%.
mode: single
sequence:
  - action: light.turn_off
    target:
      entity_id:
        - light.upstairs_primary_bed_lights
        - light.upstairs_primary_nook_lights
        - light.upstairs_primary_hall_lights
        - light.upstairs_primary_closet_lights
  - action: light.turn_on
    target:
      entity_id: light.upstairs_primary_nightstand_lights
    data:
      brightness_pct: 20
