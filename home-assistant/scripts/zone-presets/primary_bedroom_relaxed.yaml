alias: Set Primary Bedroom to Relax
description: >-
  Set Primary Bedroom lighting to a low, comfortable level (nightstands 20%,
  bed 30%, nook 30%, hall off).
mode: single
sequence:
  - action: light.turn_on
    target:
      entity_id: light.upstairs_primary_nightstand_lights
    data:
      brightness_pct: 20
  - action: light.turn_on
    target:
      entity_id: light.upstairs_primary_bed_lights
    data:
      brightness_pct: 30
  - action: light.turn_on
    target:
      entity_id: light.upstairs_primary_nook_lights
    data:
      brightness_pct: 30
  - action: light.turn_off
    target:
      entity_id: light.upstairs_primary_hall_lights
