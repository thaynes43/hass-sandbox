alias: Set Primary Bedroom to Focus
description: >-
  Set Primary Bedroom lighting to bright task lighting (bed 100%, nook 100%,
  nightstands off; hall unchanged).
mode: single
sequence:
  - action: light.turn_off
    target:
      entity_id: light.upstairs_primary_nightstand_lights
  - action: light.turn_on
    target:
      entity_id: light.upstairs_primary_bed_lights
    data:
      brightness_pct: 100
  - action: light.turn_on
    target:
      entity_id: light.upstairs_primary_nook_lights
    data:
      brightness_pct: 100
