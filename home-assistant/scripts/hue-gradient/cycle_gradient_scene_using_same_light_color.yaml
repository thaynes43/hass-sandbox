# script.cycle_gradient_scene_using_same_light_color ("Cycle Gradient Scene Using Same Light Color") — called by
# the Movie Room scene controller, button 4 x1 (automation.basement_movie_room_zen37_scene_controller), with the
# four gradient-scene selects and the two play bars. First mirrored 2026-09-28 (it had no repo copy). The
# original selected the scene and then waited up to 30 s on the gradient colour-list sensor for the play-bar
# colour; that sensor does not update on a scene select, so the play bars got the previous scene's colour.
# #215 replaced the wait with script.movie_room_play_bars_match_gradient_scene's palette table (kept) and added
# a stop_hue_effect to all six lights 2 ms before the scene select (removed the same evening). On a Hue gradient
# light that stop flattens the gradient to one colour, and Zigbee2MQTT delivered it after the scene, so the
# strips showed the gradient briefly and then snapped to one colour. Read back from the lights' own state
# (Zigbee2MQTT philips_raw: 4b03.. = gradient, 0b0x.. = one colour, ab0x.. = effect): a stop turns 4b03 into
# 0b02, and a gradient scene over a running candle effect turns ab02 into 4b03, so no stop is needed. A scene
# sent to an off light is stored but leaves it off, so gradient lights that are off get a plain turn on (no
# colour) first; a press with the ambient lights off still turns them all on with the next scene (from #215).
# The same "next scene" also lives in script.voice_movie_room_ambient_scene (no `scene`): change both together.
alias: Cycle Gradient Scene Using Same Light Color
description: 'Cycle to the next gradient scene on the given gradient-scene selects and give the plain
  lights (no gradient) one colour from that scene''s palette. Gradient lights that are off get a plain
  turn on first (a scene sent to an off light is stored but does not turn it on). Never sends stop_hue_effect:
  on a Hue gradient light it flattens the gradient to one colour, and a gradient scene replaces a running
  effect by itself (both read back from the lights'' own state, 2026-09-28). The plain-light colour comes
  from script.movie_room_play_bars_match_gradient_scene''s palette table: the gradient colour-list sensor
  does not update when a scene is selected.

  '
fields:
  select_entities:
    description: A comma-separated list of select entities to update
    example: select.basement_movie_hue_gradient_65_gradient_scene, select.basement_movie_hue_gradient_75_gradient_scene
  light_entities:
    description: A comma-separated list of standard lights (no gradient support) to update
    example: light.basement_movie_hue_play_01, light.basement_movie_hue_play_02
sequence:
- variables:
    select_list: '{{ select_entities.split('','') | map(''trim'') | list }}'
    first_select: '{{ select_list[0] }}'
    themes: '{{ state_attr(first_select, ''options'') or [] }}'
    current_theme: "{% set current = states(first_select) %} {% if current in themes %}\n  {{ current\
      \ }}\n{% else %}\n  {{ themes[0] if themes else '' }}\n{% endif %}"
    next_theme: "{% if themes %}\n  {{ themes[(themes.index(current_theme) + 1) % themes|length] }}\n\
      {% else %}\n  NoThemesFound\n{% endif %}"
- choose:
  - conditions:
    - condition: template
      value_template: '{{ next_theme != ''NoThemesFound'' }}'
    sequence:
    - variables:
        lights_list: '{{ light_entities.split('','') | map(''trim'') | reject(''eq'', '''') | list }}'
        gradient_lights: '{{ select_list | map(''regex_replace'', ''^select[.](.*)_gradient_scene$'',
          ''light.\\1'') | list }}'
    - variables:
        gradient_lights_off: '{{ gradient_lights | select(''is_state'', ''off'') | list }}'
    - alias: 'Gradient lights that are off come on with a plain turn on (no colour, no effect), which
        keeps the stored gradient. Do not add stop_hue_effect here: it flattens a Hue gradient to one
        colour, and racing the scene select (both go out within milliseconds) it landed after the scene,
        so the strips showed the gradient briefly and then one colour (2026-09-28). The scene replaces
        a running effect on its own'
      if:
      - condition: template
        value_template: '{{ gradient_lights_off | count > 0 }}'
      then:
      - action: light.turn_on
        target:
          entity_id: '{{ gradient_lights_off }}'
        data: {}
    - data:
        entity_id: '{{ select_entities }}'
        option: '{{ next_theme }}'
      action: select.select_option
    - action: script.movie_room_play_bars_match_gradient_scene
      data:
        scene: '{{ next_theme }}'
        light_entities: '{{ light_entities }}'
mode: single
