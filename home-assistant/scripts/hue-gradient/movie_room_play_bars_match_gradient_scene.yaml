    colors: '{{ palettes.get(scene | default('''') | string, []) }}'
    chosen: '{{ colors | random if colors else '''' }}'
    targets: '{% set l = light_entities | default(''light.basement_movie_hue_play_01, light.basement_movie_hue_play_02'',
      true) %}{{ (l if l is string else l | join('','')).split('','') | map(''trim'') | reject(''eq'',
      '''') | list }}'
- if:
  - condition: template
    value_template: '{{ chosen | length == 7 and targets | length > 0 }}'
  then:
  - action: light.turn_on
    target:
      entity_id: '{{ targets }}'
    data:
      rgb_color:
      - '{{ chosen[1:3] | int(base=16) }}'
      - '{{ chosen[3:5] | int(base=16) }}'
      - '{{ chosen[5:7] | int(base=16) }}'
  else:
  - alias: 'Make a miss visible: both callers start this fire-and-forget, so without this an unknown scene
      (a newer Zigbee2MQTT, a caller that re-spells an option) or no target lights would look exactly
      like success'
    action: system_log.write
    data:
      level: warning
      logger: script.movie_room_play_bars_match_gradient_scene
      message: 'Play bars not changed: {{ ''no palette for scene '' ~ (scene | default('''') | string)
        ~ '' (re-run the decode in the repo header if Zigbee2MQTT added or renamed scenes)'' if not colors
        else ''no target lights'' }}'
