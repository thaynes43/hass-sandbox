# script.movie_room_play_bars_match_gradient_scene ("Movie Room Play Bars Match Gradient Scene") — helper, not a
# voice tool. Created 2026-09-28. Sets the Movie Room play bars (plain colour Hue Play lightbars) to one colour,
# picked at random, from a Hue gradient scene's palette so they match the gradient strips and Signe floor lamps.
# Called by script.voice_movie_room_ambient_scene and script.cycle_gradient_scene_using_same_light_color.
# The palettes are Zigbee2MQTT's own scene table (zigbee-herdsman-converters 26.105.0, lib/philips.js
# gradientScenes) decoded with its decodeGradientColors, read-only inside the zigbee2mqtt pod:
#   node -e 'const p=require("./dist/lib/philips.js"); ... p.decodeGradientColors("4b0101fe00000000"+hex.slice(8), {reverse:true}).colors'
# (the scene payload is the gradient state without its 4b01/on/brightness/unknown header). blue_lagoon decodes
# to exactly the colours sensor.basement_movie_hue_gradient_65_gradient reported for it. Why not read that
# sensor: it does not update when a scene is selected, only when the strip happens to report (seconds later or
# never; a z2m /get {"gradient": ""} and a same-level brightness command did not make it report), so the play
# bars used to get a colour from the previous scene. A newer Zigbee2MQTT with new scenes: re-run the decode.
# A miss (scene not in the table, or no target lights) writes a WARNING to the system log (logger
# script.movie_room_play_bars_match_gradient_scene): both callers fire and forget, so it would look like success.
alias: Movie Room Play Bars Match Gradient Scene
description: 'Sets the Movie Room play bars (plain colour lights, no gradient) to one colour, picked at
  random, from a Hue gradient scene''s palette, so they match the gradient strips and floor lamps. Called
  by script.voice_movie_room_ambient_scene and by script.cycle_gradient_scene_using_same_light_color (scene
  controller button 4). The palettes were decoded from Zigbee2MQTT''s own scene table (zigbee-herdsman-converters
  26.105.0, lib/philips.js gradientScenes, decoded with its decodeGradientColors) on 2026-09-28. The gradient
  colour-list sensor cannot be used instead: it does not update when a scene is selected, only when the
  strip happens to report (seconds later or not at all), so the play bars used to get a colour from the
  previous scene. A scene missing from the table (a newer Zigbee2MQTT) leaves the play bars as they are.'
icon: mdi:led-strip
mode: queued
max: 10
fields:
  scene:
    description: The gradient scene option, as the select shows it (for example blue_lagoon or 'blood
      moon')
    example: blue_lagoon
    required: true
    selector:
      text: {}
  light_entities:
    description: 'The plain colour lights to set (default: the two Movie Room play bars)'
    example: light.basement_movie_hue_play_01, light.basement_movie_hue_play_02
    required: false
    selector:
      text: {}
sequence:
