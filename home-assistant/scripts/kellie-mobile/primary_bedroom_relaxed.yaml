alias: Kellie Mobile - Primary Bedroom Relaxed
description: Set Primary Bedroom lights to a relaxed scene.
mode: single
sequence:
  - action: light.turn_on
    target:
      entity_id: light.upstairs_primary_nightstand_lights
    data:
      brightness_pct: 20
  - action: light.turn_on
    target:
      entity_id: light.upstairs_primary_bed_lights
    data:
      brightness_pct: 30
  - action: light.turn_on
    target:
      entity_id: light.upstairs_primary_nook_lights
    data:
      brightness_pct: 30
  - action: light.turn_off
    target:
      entity_id: light.upstairs_primary_hall_lights
