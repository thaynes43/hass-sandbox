alias: Set LED Color For Outdoor Light Switches
description: >
  Reads a 0-255 LED color value from an input_number helper, updates each
  switch's cached LED-color helper, and applies the value to the configured
  outdoor Inovelli switches so hold restore behavior stays in sync with the
  group color control.
fields:
  color_helper:
    description: input_number entity_id containing the desired 0-255 LED color
    example: input_number.outdoor_light_inovelli_led_color
sequence:
  - variables:
      helper_entity_id: "{{ color_helper | default('input_number.outdoor_light_inovelli_led_color') }}"
      helper_value: "{{ states(helper_entity_id) | int(255) }}"
      switches:
        - switch_name: downstairs_front_porch_inovelli_dimmer
        - switch_name: garage_driveway_inovelli_dimmer
        - switch_name: garage_back_yard_inovelli_dimmer
        - switch_name: downstairs_kitchen_back_yard_spotlight
          cached_color_helper: input_text.downstairs_kitchen_back_yard_spotlight_led_color
        - switch_name: downstairs_front_door_inovelli_on_off
  - repeat:
      for_each: "{{ switches }}"
      sequence:
        - choose:
            - conditions:
                - condition: template
                  value_template: >-
                    {{ repeat.item.cached_color_helper is defined and
                    (repeat.item.cached_color_helper | string | length) > 0 }}
              sequence:
                - action: input_text.set_value
                  target:
                    entity_id: "{{ repeat.item.cached_color_helper }}"
                  data:
                    value: "{{ helper_value }}"
        - action: script.inovelli_set_led_1_7_color_from_input_text
          data:
            switch_name: "{{ repeat.item.switch_name }}"
            color_helper: >-
              {{ repeat.item.cached_color_helper if repeat.item.cached_color_helper
              is defined else helper_entity_id }}
mode: single
icon: mdi:outdoor-lamp
