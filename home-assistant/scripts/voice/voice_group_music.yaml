# script.voice_group_music ("Group Music") — voice tool, created live via MCP 2026-09-19: the same music
# in several rooms in sync (media_player.join on the Music Assistant players, i.e. a native Sonos group),
# and taking rooms out again (media_player.unjoin). Rooms are HA areas. The Rumpus KEFs DO join (Music
# Assistant syncs them with the Sonos players). A join is checked afterwards and rooms that did not
# join are named in the answer. Removing the room that LEADS the group (the one whose music it is)
# is handled explicitly: unjoining the leader alone left the wrong room playing, so the group is
# dissolved, the queue is transferred to the first room that stays and the rest regroup around it.
# A room named for removal that is not in the group is simply stopped. On the guard allowlist since
# v1.18.7 and exposed to Assist since 2026-09-19.
# add: whichever named room is really playing decides, and the LEADER of its group is the source
# (joining onto a member makes Music Assistant tear the group apart and the music stops); rooms that
# already play together are left alone.
# Rooms are a FIXED LIST (select), not an area selector: with an area field Home Assistant 2026.9 crashes
# the whole voice request (IndexError in helpers/llm.py, the box blinks red) when the agent passes a room
# name it cannot match exactly, e.g. "bathroom" for the area "Primary Bathroom" (first voice test, 2026-09-19).
alias: Group Music
description: Voice tool that plays the music of one room in OTHER rooms too, in sync (the same song everywhere),
  or takes rooms out of that group again. Use it for 'play this in the living room too', 'play the music
  in the bedroom and the bathroom', 'play it in the kitchen and the study as well' (name the rooms) with
  action add, and for 'stop it in the living room but keep it here', 'stop it in here but keep it in the
  living room' or 'just the kitchen now' with action remove. source_room is the room where the music is
  playing NOW (the room the request comes from, or the room it was just moved to, unless the user names
  another); rooms are the rooms to add, or the rooms that should stop (that may be the room the request
  comes from). When the user lists the rooms that should play ('in the bedroom and the bathroom') and
  one of them is the source room, pass the others. Use Move Music instead when the music should simply
  go from one room to another.
icon: mdi:speaker-multiple
mode: queued
max: 3
fields:
  source_room:
    name: Source room
    description: 'The room where the music is playing now and whose music is shared. Pick from the list:
      primary_bedroom and primary_bathroom are the main bedroom and its bathroom (from the primary bedroom,
      ''the bathroom'' means primary_bathroom and ''the bedroom'' means primary_bedroom), blue_room is
      Jackson''s room, pink_room is Penelope''s room, white_room is the guest room, rumpus_room has the
      KEF speakers, study is the office.'
    required: true
    selector:
      select:
        options:
        - primary_bedroom
        - primary_bathroom
        - kitchen
        - living_room
        - study
        - movie_room
        - rumpus_room
        - blue_room
        - pink_room
        - white_room
        - kids_bathroom
        - front_porch
        - back_yard
  rooms:
    name: Rooms
    description: 'The rooms to add to the group, or to stop and take out of it. Pick from the list: primary_bedroom
      and primary_bathroom are the main bedroom and its bathroom (from the primary bedroom, ''the bathroom''
      means primary_bathroom and ''the bedroom'' means primary_bedroom), blue_room is Jackson''s room,
      pink_room is Penelope''s room, white_room is the guest room, rumpus_room has the KEF speakers, study
      is the office.'
    required: true
    selector:
      select:
        options:
        - primary_bedroom
        - primary_bathroom
        - kitchen
        - living_room
        - study
        - movie_room
        - rumpus_room
        - blue_room
        - pink_room
        - white_room
        - kids_bathroom
        - front_porch
        - back_yard
        multiple: true
  action:
    name: Action
    description: add = these rooms play the source room's music too; remove = these rooms stop and leave
      the group.
    required: true
    selector:
      select:
        options:
        - add
        - remove
sequence:
- alias: 'Rooms are a fixed list, not an area selector: Home Assistant crashes the whole voice request
    (IndexError in helpers/llm.py) when an LLM passes an area name it cannot match, e.g. ''bathroom''
    for ''Primary Bathroom'''
  variables:
    room_area:
      primary_bedroom: primary_bedroom
      primary_bathroom: main_bed_bath
      kitchen: kitchen
      living_room: living_room
      study: office
      movie_room: movie_room
      rumpus_room: rumpus_room
      blue_room: blue_room
      pink_room: pink_room
      white_room: white_room
      kids_bathroom: kids_bathroom
      front_porch: front_porch
      back_yard: back_yard
- variables:
    source_area: '{{ room_area.get(source_room, '''') }}'
    areas: '{% set ns = namespace(a=[]) %}{% for r in [rooms] | flatten %}{% if r in room_area %}{% set
      ns.a = ns.a + [room_area[r]] %}{% endif %}{% endfor %}{{ ns.a }}'
- variables:
    src: '{{ area_entities(source_area) | select(''in'', integration_entities(''music_assistant'')) |
      select(''match'', ''media_player\.'') | reject(''is_state'', ''unavailable'') | reject(''is_state'',
      ''unknown'') | first | default('''', true) }}'
    members: '{% set ns = namespace(p=[]) %}{% for a in [areas] | flatten %}{% set ns.p = ns.p + (area_entities(a)
      | select(''in'', integration_entities(''music_assistant'')) | select(''match'', ''media_player\.'')
      | reject(''is_state'', ''unavailable'') | reject(''is_state'', ''unknown'') | list) %}{% endfor
      %}{{ ns.p | unique | list }}'
- variables:
    targets: '{{ members | reject(''eq'', src) | list }}'
- choose:
  - conditions:
    - condition: template
      value_template: '{{ action == ''add'' }}'
    sequence:
    - alias: Whichever of the named rooms is really playing is the source (the agent often names the room
        it is in, while the music plays in another room that was named); the others join it
      variables:
        everyone: '{{ (([src] if src != '''' else []) + members) | unique | list }}'
    - if:
      - condition: template
        value_template: '{{ everyone | count < 2 }}'
      then:
      - variables:
          result:
            response: 'Nothing changed: fewer than two of those rooms have a Music Assistant speaker.'
      - stop: No usable speakers
        response_variable: result
    - alias: 'A room that is really PLAYING decides (the source room first, then the others); only when
        nothing plays does a paused room count. The LEADER of that room''s group is the source: joining
        onto a member makes Music Assistant tear the group apart and the music stops'
      variables:
        playing_room: '{% set order = (([src] if src != '''' else []) + everyone) | unique | list %}{{
          order | select(''is_state'', ''playing'') | first | default(order | select(''is_state'', ''paused'')
          | first | default('''', true), true) }}'
    - variables:
        eff_src: '{{ ((state_attr(playing_room, ''group_members'') or []) | first | default(playing_room,
          true)) if playing_room != '''' else '''' }}'
    - if:
      - condition: template
        value_template: '{{ eff_src == '''' }}'
      then:
      - variables:
          result:
            response: 'Nothing changed: nothing is playing in any of those rooms.'
      - stop: Nothing playing in the named rooms
        response_variable: result
    - variables:
        eff_targets: '{{ everyone | reject(''eq'', eff_src) | reject(''in'', state_attr(eff_src, ''group_members'')
          or []) | list }}'
    - alias: 'Already one group: leave it alone'
      if:
      - condition: template
        value_template: '{{ eff_targets | count == 0 }}'
      then:
      - variables:
          result:
            response: 'Nothing to do: those rooms already play the same music together.'
      - stop: Already grouped
        response_variable: result
    - alias: 'A speaker that cannot join must not abort the tool: the result below says who really joined'
      action: media_player.join
      continue_on_error: true
      target:
        entity_id: '{{ eff_src }}'
      data:
        group_members: '{{ eff_targets }}'
    - delay:
        seconds: 3
    - variables:
        joined: '{{ eff_targets | select(''in'', state_attr(eff_src, ''group_members'') or []) | list
          }}'
    - variables:
        result:
          response: '{% set ok = joined | map(''area_name'') | list %}{% set bad = eff_targets | reject(''in'',
            joined) | map(''area_name'') | list %}{{ (''The music from '' ~ area_name(eff_src) ~ '' now
            also plays in '' ~ ok | join('', '') ~ ''.'') if ok else ''No room was added.'' }}{{ ('' Could
            not be added: '' ~ bad | join('', '') ~ ''.'') if bad else '''' }}'
  - conditions:
    - condition: template
      value_template: '{{ action == ''remove'' }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ members | count == 0 }}'
      then:
      - variables:
          result:
            response: 'Nothing changed: none of those rooms has a Music Assistant speaker.'
      - stop: No usable speakers
        response_variable: result
    - alias: The group as the source room's player reports it (leader first); a room that is not grouped
        is its own group
      variables:
        group: '{{ (state_attr(src, ''group_members'') or []) if (state_attr(src, ''group_members'') or
          []) | count > 0 else ([src] if src != '''' else []) }}'
    - variables:
        leader: '{{ group | first | default('''', true) }}'
        remaining: '{{ group | reject(''in'', members) | list }}'
        outside: '{{ members | reject(''in'', group) | list }}'
    - alias: A named room that is not in the group is simply stopped, whichever branch below runs, so
        'stop the music in the study' is true afterwards
      if:
      - condition: template
        value_template: '{{ outside | count > 0 }}'
      then:
      - action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id: '{{ outside }}'
    - choose:
      - alias: 'The leader stays: the leaving rooms simply unjoin'
        conditions:
        - condition: template
          value_template: '{{ leader == '''' or leader not in members }}'
        sequence:
        - action: media_player.unjoin
          continue_on_error: true
          target:
            entity_id: '{{ members | select(''in'', group) | list }}'
      - alias: 'The leader leaves and nobody stays: stop the music'
        conditions:
        - condition: template
          value_template: '{{ remaining | count == 0 }}'
        sequence:
        - action: media_player.media_stop
          continue_on_error: true
          target:
            entity_id: '{{ leader }}'
        - action: media_player.unjoin
          continue_on_error: true
          target:
            entity_id: '{{ group | reject(''eq'', leader) | list }}'
      default:
      - alias: 'The leader leaves but others stay: dissolve the group, hand the queue to the first room
          that stays, regroup the rest around it'
        action: media_player.unjoin
        continue_on_error: true
        target:
          entity_id: '{{ group | reject(''eq'', leader) | list }}'
      - delay:
          seconds: 2
      - action: music_assistant.transfer_queue
        target:
          entity_id: '{{ remaining | first }}'
        data:
          source_player: '{{ leader }}'
          auto_play: true
        continue_on_error: true
      - if:
        - condition: template
          value_template: '{{ remaining | count > 1 }}'
        then:
        - delay:
            seconds: 3
        - action: media_player.join
          continue_on_error: true
          target:
            entity_id: '{{ remaining | first }}'
          data:
            group_members: '{{ remaining[1:] }}'
    - variables:
        result:
          response: '{{ members | map(''area_name'') | join('', '') }} stopped{{ (''; the music carries
            on in '' ~ remaining | map(''area_name'') | join('', '')) if remaining | count > 0 and leader
            in members else '''' }}.'
  default:
  - variables:
      result:
        response: 'Nothing changed: action must be add or remove.'
- stop: Done
  response_variable: result
