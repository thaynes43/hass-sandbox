# script.voice_rumpus_room_bright — voice tool exposed to Assist (created live via MCP, 2026-09-18).
# Mirrors a physical button; see .agents/plans/voice-assist-rollout.md (Phase 2).
alias: Rumpus Room Bright
description: Voice tool. Sets the Rumpus Room recessed lights and the lamp to full brightness warm white
  (2750 K, 100%). Same as double-tapping button 1 on the Rumpus Room scene controller. Use for 'lights
  up', 'full brightness' or 'everything on' in the rumpus room.
icon: mdi:brightness-7
mode: single
sequence:
- action: light.turn_on
  target:
    entity_id:
    - light.basement_rumpus_room_lights
    - light.basement_rumpus_room_lamp
  data:
    color_temp_kelvin: 2750
    brightness_pct: 100
