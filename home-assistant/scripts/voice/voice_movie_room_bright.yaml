# script.voice_movie_room_bright — voice tool exposed to Assist (created live via MCP, 2026-09-18).
# Mirrors a physical button; see .agents/plans/voice-assist-rollout.md (Phase 2).
alias: Movie Room Bright
description: Voice tool. Sets the Movie Room recessed lights to full brightness warm white (2750 K, 100%).
  Same as double-tapping button 1 on the Movie Room scene controller. Use for requests like 'lights up',
  'full brightness' or 'bright mode' in the movie room. Does not change the ambient lights.
icon: mdi:brightness-7
mode: single
sequence:
- action: light.turn_on
  target:
    entity_id: light.basement_movie_room_lights
  data:
    color_temp_kelvin: 2750
    brightness_pct: 100
