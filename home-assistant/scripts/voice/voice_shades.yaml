# script.voice_shades — the one voice tool for the Hunter Douglas shades (created live via MCP, 2026-09-18;
# kids' rooms, kids' bathroom and the whole-upstairs scenes added 2026-09-19 on Tom's ruling).
# Fires the same gateway scenes as the ZEN32 buttons and the schedules. Tom's ruling: a plain
# "open" means tilt-open upstairs and fully open downstairs, like the buttons on each floor.
alias: Window Shades
description: 'Voice tool for the Hunter Douglas window shades. ALWAYS use this tool to move shades or
  blinds. It fires the same gateway scene the wall scene-controller buttons use. Pick the room and the
  position. Position meanings: ''open'' is the normal everyday open that people mean by ''open the shades''
  (upstairs rooms tilt the vanes open with the shade down, downstairs rooms raise the shade); ''fully_open''
  raises the shade all the way in any room (''raise the shades'', ''open them all the way''); ''tilt_open''
  keeps the shade down with the vanes tilted open (''tilt the shades''); ''close'' closes them; ''privacy''
  exists only for the cloffice. If the user does not name a room, use the room they are in.'
icon: mdi:blinds-horizontal
mode: queued
max: 5
fields:
  room:
    name: Room
    description: Which room's shades to move. blue_room is Jackson's room and pink_room is Penelope's
      room. 'upstairs' moves every second-floor shade at once and 'downstairs' every first-floor shade.
    required: true
    selector:
      select:
        options:
        - primary_bedroom
        - primary_bathroom
        - cloffice
        - blue_room
        - white_room
        - pink_room
        - kids_bathroom
        - upstairs
        - kitchen
        - living_room
        - dining_room
        - study
        - first_floor_bathroom
        - downstairs
  position:
    name: Position
    description: open = everyday open (tilt-open upstairs, raised downstairs); fully_open = raised all
      the way; tilt_open = shade down, vanes open; close = closed; privacy = cloffice only.
    required: true
    selector:
      select:
        options:
        - open
        - fully_open
        - tilt_open
        - close
        - privacy
sequence:
- variables:
    scenes:
      primary_bedroom:
        floor: up
        open: scene.laundry_gateway_main_bedroom_open
        tilt: scene.laundry_gateway_main_bedroom_tilt_open
        close: scene.laundry_gateway_main_bedroom_close
      primary_bathroom:
        floor: up
        open: scene.laundry_gateway_main_bed_bath_open
        tilt: scene.laundry_gateway_main_bed_bath_tilt_open
        close: scene.laundry_gateway_main_bed_bath_close
      cloffice:
        floor: up
        open: scene.upstairs_gateway_cloffice_open
        tilt: scene.upstairs_gateway_cloffice_tilt_open
        close: scene.upstairs_gateway_cloffice_close
        privacy: scene.upstairs_gateway_cloffice_privacy
      kitchen:
        floor: down
        open: scene.laundry_gateway_kitchen_open
        tilt: scene.laundry_gateway_kitchen_tilt_open
        close: scene.laundry_gateway_kitchen_close
      living_room:
        floor: down
        open: scene.laundry_gateway_family_room_open
        tilt: scene.laundry_gateway_family_room_tilt_open
        close: scene.laundry_gateway_family_room_close
      dining_room:
        floor: down
        open: scene.laundry_gateway_dining_room_open
        tilt: scene.laundry_gateway_dining_room_tilt_open
        close: scene.laundry_gateway_dining_room_close
      study:
        floor: down
        open: scene.laundry_gateway_office_open
        tilt: scene.laundry_gateway_office_tilt_open
        close: scene.laundry_gateway_office_close
      first_floor_bathroom:
        floor: down
        open: scene.laundry_gateway_1st_floor_bath_open
        tilt: scene.laundry_gateway_1st_floor_bath_tilt_open
        close: scene.laundry_gateway_1st_floor_bath_close
      downstairs:
        floor: down
        open: scene.hunter_douglas_gateway_downstairs_open
        tilt: scene.hunter_douglas_gateway_downstairs_tilt_open
        close: scene.hunter_douglas_gateway_downstairs_close
      blue_room:
        floor: up
        open: scene.laundry_gateway_blue_room_open
        tilt: scene.laundry_gateway_blue_room_tilt_open
        close: scene.laundry_gateway_blue_room_close
      white_room:
        floor: up
        open: scene.laundry_gateway_white_room_open
        tilt: scene.laundry_gateway_white_room_tilt_open
        close: scene.laundry_gateway_white_room_close
      pink_room:
        floor: up
        open: scene.laundry_gateway_pink_room_open
        tilt: scene.laundry_gateway_pink_room_tilt_open
        close: scene.laundry_gateway_pink_room_close
      kids_bathroom:
        floor: up
        open: scene.laundry_gateway_2nd_floor_bath_open
        tilt: scene.laundry_gateway_2nd_floor_bath_tilt_open
        close: scene.laundry_gateway_2nd_floor_bath_close
      upstairs:
        floor: up
        open: scene.hunter_douglas_gateway_upstairs_open
        tilt: scene.hunter_douglas_gateway_upstairs_tilt_open
        close: scene.hunter_douglas_gateway_upstairs_close
    scene_id: '{% set r = scenes.get(room, {}) %}{% if position == ''close'' %}{{ r.get(''close'', '''')
      }}{% elif position == ''privacy'' %}{{ r.get(''privacy'', r.get(''close'', '''')) }}{% elif position
      == ''fully_open'' %}{{ r.get(''open'', '''') }}{% elif position == ''tilt_open'' %}{{ r.get(''tilt'',
      '''') }}{% elif position == ''open'' %}{{ r.get(''tilt'', '''') if r.get(''floor'') == ''up'' else
      r.get(''open'', '''') }}{% endif %}'
- if:
  - condition: template
    value_template: '{{ scene_id | length == 0 or expand(scene_id) | length == 0 }}'
  then:
  - stop: Unknown room or position for the shades, or the gateway scene does not exist
    error: true
- action: scene.turn_on
  data:
    entity_id: '{{ scene_id }}'
