# script.voice_rumpus_room_hold_lights — voice tool exposed to Assist (created live via MCP, 2026-09-18).
# Mirrors a physical button; see .agents/plans/voice-assist-rollout.md (Phase 2).
alias: Rumpus Room Hold Lights
description: Voice tool. Toggles the Rumpus Room lighting hold. While held, the motion automations will
  neither turn the Rumpus Room lights on nor off, and the wall switch LED bar changes colour. Calling
  it again releases the hold. Same as double-pressing the config button on the Rumpus Room wall switch.
  Use for 'hold the lights', 'keep the lights on', 'stop the lights turning off' or 'release the hold'
  in the rumpus room.
icon: mdi:hand-back-left
mode: single
sequence:
- action: script.inovelli_toggle_mmwave_hold_led_indicator
  data:
    switch_name: basement_rumpus_room_inovelli_presence
    normal_mode_input_select: input_select.basement_rumpus_room_mmwave_normal_mode
    hold_color: input_text.inovelli_manual_hold
    prev_led_color_helper: input_text.basement_rumpus_room_led_color
    automation_entity_ids:
    - automation.light_snzb_06p_rumpus_room_motion_detected_lights_on
    - automation.light_snzb_06p_rumpus_room_motion_cleared_lights_off
