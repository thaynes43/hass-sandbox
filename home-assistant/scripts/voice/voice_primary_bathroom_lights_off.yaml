# script.voice_primary_bathroom_lights_off — voice tool exposed to Assist (created live via MCP, 2026-09-19).
# Mirrors a physical control or a ruling; see .agents/plans/voice-assist-rollout.md (Phase 2).
alias: Primary Bathroom Lights Off
description: 'Voice tool. Turns off all the primary bathroom lights together: vanity, shower, fan light
  and the recessed lights. Same as pressing the config button on the bathroom vanity switch. Use for ''turn
  off the bathroom lights'' in the primary bathroom or primary suite.'
icon: mdi:shower
mode: single
sequence:
- action: light.turn_off
  target:
    entity_id:
    - light.upstairs_primary_bath_vanity_inovelli_presence
    - light.upstairs_primary_bath_shower_inovelli_presence
    - light.upstairs_primary_bath_fan_light_inovelli_on_off
    - light.upstairs_primary_bath_lights
- action: input_boolean.turn_off
  target:
    entity_id: input_boolean.upstairs_primary_bathroom_use_shower_delay
