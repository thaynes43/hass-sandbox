# script.voice_oven_timer ("Oven Timer") — voice tool, created live via MCP 2026-10-18 on Tom's request
# (hass-sandbox #255): "I want to be able to ask Ok Nabu to set an oven timer for a duration and have it
# set the timer on the GE oven." It sets, cancels or reads the KITCHEN TIMER of the Café double wall oven
# (NRZ120804Q, HACS ge_home): the oven's own countdown on its display. It never touches cooking, the
# temperature or the cook timer.
# How the LLM is steered: the description says oven-only. A plain "set a timer for 10 minutes" never
# reaches the agent anyway: the pipelines prefer local intents, and HassStartTimer starts a Voice PE timer.
# The reverse is the trap: the built-in timer intents also match "cancel/stop the oven timer", "how long is
# left on the oven timer" and "set a 10 minute timer for the oven" (a Voice PE timer NAMED "oven"), so those
# never reach the agent. automation.voice_oven_timer_sentences catches them first (sentence triggers run
# before local intents) and calls this script. Phrasings neither matches go to the agent, which calls this.
# ge_home.set_timer takes WHOLE minutes, 1 to 360 (vol.Coerce(int) truncates, so 1.9 would become 1): the
# script rounds half up itself, at least 1 minute, and refuses more than 360. Both ge_home services return
# before the cloud write lands and swallow failures (they only log a warning), so the script waits for the
# sensor to show the change: ~1.3 s to set and ~1.9 s to clear, measured 2026-10-18. Without that the reply
# could claim a timer that never reached the oven. The kitchen-timer sensors report a duration in a display
# unit the registry chose (upper s, lower h on 2026-10-18), so values are converted by unit_of_measurement.
# With no oven named, set uses the upper oven, and cancel and check cover whichever timers are running.
# Refusals come back as a `response` sentence with a plain stop (see voice_thermostat.yaml: an
# `error: true` stop reaches the agent as an empty SUCCESS).
# Allowed by the guard pattern script.voice_* (v1.19.2); exposed to Assist 2026-10-18.
alias: Oven Timer
description: 'Voice tool for the kitchen timer on the wall oven: the countdown shown on the oven itself.
  Use it ONLY when the user says oven: ''set an oven timer for 10 minutes'', ''set the lower oven timer
  for an hour and a half'', ''put 20 minutes on the oven timer'', ''cancel the oven timer'', ''how long
  is left on the oven timer''. A timer request that does not mention the oven (''set a timer for 10 minutes'')
  is NOT for this tool. action set starts the oven timer for minutes (replacing a running one), cancel
  stops it, check says how long is left. It does not change cooking, the temperature or the cook time.
  The tool answers with what it did, or why nothing changed: tell the user that.'
icon: mdi:timer-outline
mode: queued
max: 5
fields:
  action:
    name: Action
    description: set starts the oven timer for minutes; cancel stops it; check reads how long is left.
    required: true
    selector:
      select:
        options:
        - set
        - cancel
        - check
  minutes:
    name: Minutes
    description: 'For set: the timer length converted to minutes, for example 10 minutes = 10, an hour
      and a half = 90, 2 hours = 120. The oven takes whole minutes from 1 to 360 (6 hours). Leave empty
      for cancel and check.'
    required: false
    selector:
      number:
        min: 0
        max: 1440
        step: 0.5
        mode: box
        unit_of_measurement: min
  oven:
    name: Oven
    description: upper (the top oven) or lower (the bottom oven). Leave empty unless the user names one.
      With no oven named, set uses the upper oven and cancel and check cover both.
    required: false
    selector:
      select:
        options:
        - upper
        - lower
sequence:
- alias: 'What was asked, and each oven''s timer in seconds (none when the sensor is not readable). The
    sensors report in a registry-chosen display unit, so convert by unit_of_measurement'
  variables:
    ovens:
      upper:
        label: upper oven
        timer: sensor.nrz120804q_kitchen_timer
        remote: binary_sensor.nrz120804q_remote_enabled
      lower:
        label: lower oven
        timer: sensor.kitchen_cafe_oven_nrz120804q_nrz120804q_lower_oven_kitchen_timer
        remote: binary_sensor.nrz120804q_lower_oven_remote_enabled
    wanted: '{{ action | default('''', true) | string | lower | trim }}'
    which: '{{ oven | default('''', true) | string | lower | trim | regex_replace(''^(top|upper)( oven)?$'',
      ''upper'') | regex_replace(''^(bottom|lower)( oven)?$'', ''lower'') | regex_replace(''^(both|all)(
      ovens?)?$'', '''') }}'
    raw_minutes: '{{ minutes | default('''', true) }}'
    asked: '{{ raw_minutes | float(0) if raw_minutes | is_number else 0 }}'
    whole: '{{ [((asked | float) + 0.5) | int, 1] | max if (asked | float) > 0 else 0 }}'
    secs: '{% set f = {''s'': 1, ''min'': 60, ''h'': 3600, ''d'': 86400} %}{% set ns = namespace(pairs=[])
      %}{% for k, o in ovens.items() %}{% set v = states(o.timer) %}{% set ns.pairs = ns.pairs + [(k, (v
      | float) * f.get(state_attr(o.timer, ''unit_of_measurement''), 60) if v | is_number else none)] %}{%
      endfor %}{{ dict(ns.pairs) }}'
    targets: '{{ [which] if which in ovens else ([''upper''] if wanted == ''set'' else [''upper'', ''lower''])
      }}'
    problem: '{% if wanted not in [''set'', ''cancel'', ''check''] %}Nothing was changed: the action must
      be set, cancel or check.{% elif which and which not in ovens %}There is no {{ which }} oven: the wall
      oven has an upper and a lower oven.{% elif targets | reject(''in'', secs | dictsort | rejectattr(1, ''none'')
      | map(attribute=0) | list) | list | count > 0 %}The oven is not responding right now, so its timer was not {{ ''read'' if wanted
      == ''check'' else ''changed'' }}.{% elif wanted == ''set'' and (asked | float) <= 0 %}Nothing was changed:
      say how long the oven timer should run, like ten minutes.{% elif wanted == ''set'' and (whole | int)
      > 360 %}Nothing was changed: the oven timer goes up to 6 hours.{% endif %}'
- if:
  - condition: template
    value_template: '{{ problem | length > 0 }}'
  then:
  - variables:
      result:
        response: '{{ problem }}'
  - stop: Nothing was changed
    response_variable: result
- variables:
    running: '{% set ns = namespace(r=[]) %}{% for k in targets if (secs[k] or 0) > 0 %}{% set ns.r = ns.r
      + [k] %}{% endfor %}{{ ns.r }}'
    confirmed: false
- choose:
  - conditions:
    - condition: template
      value_template: '{{ wanted == ''set'' }}'
    sequence:
    - action: ge_home.set_timer
      target:
        entity_id: '{{ ovens[targets[0]].timer }}'
      data:
        duration: '{{ whole | int }}'
    - alias: The service returns before the cloud write lands and swallows failures; wait for the sensor
        to show the new length (~1.3 s on 2026-10-18). A wait_template, not wait_for_trigger, so an update
        that lands before the wait starts still counts. A running timer already within a minute of the new
        length passes at once; that is accepted, since the oven then shows that length either way
      wait_template: '{% set e = ovens[targets[0]].timer %}{% set f = {''s'': 1, ''min'': 60, ''h'': 3600,
        ''d'': 86400} %}{{ states(e) | is_number and (((states(e) | float) * f.get(state_attr(e, ''unit_of_measurement''),
        60)) - (whole | int) * 60) | abs < 60 }}'
      timeout:
        seconds: 10
      continue_on_timeout: true
    - variables:
        confirmed: '{{ wait.completed }}'
  - conditions:
    - condition: template
      value_template: '{{ wanted == ''cancel'' and running | count > 0 }}'
    sequence:
    - repeat:
        for_each: '{{ running }}'
        sequence:
        - action: ge_home.clear_timer
          target:
            entity_id: '{{ ovens[repeat.item].timer }}'
    - alias: Same as set; clearing took ~1.9 s on 2026-10-18
      wait_template: '{% set ns = namespace(n=0) %}{% for k in running if states(ovens[k].timer) | float(1)
        > 0 %}{% set ns.n = ns.n + 1 %}{% endfor %}{{ ns.n == 0 }}'
      timeout:
        seconds: 10
      continue_on_timeout: true
    - variables:
        confirmed: '{{ wait.completed }}'
- alias: 'Reply. Durations are spoken as hours and minutes. HA trims leading and trailing whitespace from
    each rendered variable, so every sentence is built inside this one template'
  variables:
    result:
      response: '{% macro dur(m) %}{% set h = (m | int) // 60 %}{% set r = (m | int) % 60 %}{{ (h ~ ('' hour''
        if h == 1 else '' hours'')) if h else '''' }}{{ '' and '' if h and r else '''' }}{{ (r ~ ('' minute''
        if r == 1 else '' minutes'')) if r else '''' }}{% endmacro %}{% macro left(s) %}{{ ''less than a
        minute'' if s < 60 else ''about '' ~ dur(((s / 60) + 0.5) | int) }}{% endmacro %}{% set first =
        targets[0] %}{% if wanted == ''set'' %}{% if confirmed | default(false) %}{{ ovens[first].label |
        capitalize }} timer set for {{ dur(whole) }}.{{ '' The oven only takes whole minutes.'' if (whole
        | float) != (asked | float) else '''' }}{{ '' That replaced a timer with '' ~ left(secs[first]) ~
        '' left.'' if secs[first] > 0 else '''' }}{% else %}The {{ ovens[first].label }} timer was sent to the
        oven, but the oven has not confirmed it, so it may not be set.{{ '' Remote Enable is off on the
        oven.'' if not is_state(ovens[first].remote, ''on'') else '''' }}{% endif %}{% elif wanted == ''cancel''
        %}{% if running | count == 0 %}{{ ''The '' ~ ovens[which].label ~ '' timer is not running.'' if which
        else ''No oven timer is running.'' }}{% elif confirmed | default(false) %}{{ ''Both oven timers'' if
        running | count > 1 else (ovens[running[0]].label | capitalize ~ '' timer'') }} cancelled.{% else
        %}{% set ns = namespace(l=[], off=false) %}{% for k in running %}{% set ns.l = ns.l + [ovens[k].label]
        %}{% set ns.off = ns.off or not is_state(ovens[k].remote, ''on'') %}{% endfor %}The oven has not confirmed
        that the {{ ns.l | join('' and '') }} timer{{ ''s were'' if running | count > 1 else '' was'' }} cancelled.{{
        '' Remote Enable is off on the oven.'' if ns.off else '''' }}{% endif %}{% else %}{% if running | count == 0 %}{{ ''The
        '' ~ ovens[which].label ~ '' timer is not running.'' if which else ''No oven timer is running.'' }}{%
        else %}{% set parts = namespace(s=[]) %}{% for k in running %}{% set parts.s = parts.s + [''the ''
        ~ ovens[k].label ~ '' timer has '' ~ left(secs[k]) ~ '' left''] %}{% endfor %}{{ (parts.s | join(''
        and '')) | capitalize }}.{% endif %}{% endif %}'
- stop: Done
  response_variable: result
