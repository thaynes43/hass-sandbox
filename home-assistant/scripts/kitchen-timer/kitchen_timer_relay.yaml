# script.kitchen_timer_relay (created live via the HA config API, 2026-10-18). hass-sandbox #262.
# The one place that changes the kitchen oven timer: timer.oven (restore on) and
# input_boolean.oven_timer_ringing, both live-only helpers. Two callers:
#   - custom:kitchen-timer-card on the unifi-connect dashboard (relay pattern: the card calls this
#     script with {command, payload}; it works for the non-admin display user, fire_event would not);
#   - automation.voice_oven_timer_sentences (kitchen voice), which speaks the `response` this returns.
# Commands (payload is a JSON object string; only start and add read it):
#   start {seconds}  start or restart the timer, ringing off
#   add {seconds}    add time; restarts with a longer duration and moves the end, so the card's
#                    progress bar stays right (timer.change alone refuses to go past the duration
#                    the timer started with). While ringing, add starts a fresh timer ("5 more minutes").
#   cancel | stop    clear everything: timer cancelled, ringing off
#   status           read only
# Ringing on, the Voice PE announcement and the 10-minute ring cap live in
# automation.oven_timer_ring_and_announce.
alias: Kitchen timer relay
description: 'Oven timer commands from the kitchen display card and kitchen voice (hass-sandbox #262):
  start, add, cancel, stop, status. Changes only timer.oven and input_boolean.oven_timer_ringing and returns
  a short spoken reply in `response`.'
icon: mdi:timer-cog-outline
mode: queued
max: 10
fields:
  command:
    name: Command
    description: start, add, cancel, stop or status
    required: true
    selector:
      select:
        options:
        - start
        - add
        - cancel
        - stop
        - status
  payload:
    name: Payload
    description: 'JSON object string, for example {"seconds": 300}. Used by start and add.'
    selector:
      text: {}
sequence:
- alias: Read the request and the timer. HA trims each rendered variable; the replies are built in one dict.
  variables:
    cmd: '{{ command | default('''', true) | string | lower | trim }}'
    seconds: '{% set p = payload | default(''{}'', true) %}{% if p is string %}{% set p = p | from_json(default={})
      %}{% endif %}{{ ((p.get(''seconds'', 0) if p is mapping else 0) | float(0)) | round(0) | int }}'
    st: '{{ states(''timer.oven'') }}'
    ringing: '{{ is_state(''input_boolean.oven_timer_ringing'', ''on'') }}'
    total: '{{ as_timedelta(state_attr(''timer.oven'', ''duration'') | default(''0:00:00'', true) | string).total_seconds()
      | int(0) }}'
    left: '{% if st == ''active'' and state_attr(''timer.oven'', ''finishes_at'') %}{{ [((as_datetime(state_attr(''timer.oven'',
      ''finishes_at'')) - now()).total_seconds()) | round(0) | int, 0] | max }}{% elif st == ''paused'' %}{{
      as_timedelta(state_attr(''timer.oven'', ''remaining'') | default(''0:00:00'', true) | string).total_seconds()
      | int(0) }}{% else %}0{% endif %}'
    say: '{%- macro say(s) -%}{%- set s = s | int(0) -%}{%- set h = s // 3600 -%}{%- set m = (s % 3600) // 60
      -%}{%- set x = s % 60 -%}{%- set ns = namespace(p=[]) -%}{%- if h %}{% set ns.p = ns.p + [h ~ ('' hour''
      if h == 1 else '' hours'')] %}{% endif -%}{%- if m %}{% set ns.p = ns.p + [m ~ ('' minute'' if m == 1
      else '' minutes'')] %}{% endif -%}{%- if x or not ns.p %}{% set ns.p = ns.p + [x ~ ('' second'' if x
      == 1 else '' seconds'')] %}{% endif -%}{{- (ns.p[:-1] | join('', '') ~ '' and '' ~ ns.p[-1]) if ns.p
      | count > 1 else ns.p[0] -}}{%- endmacro -%}{%- set l = left | int(0) -%}{%- set l_said = ((l + 30) //
      60 * 60) if l >= 600 else l -%}{{ {''amount'': say(seconds), ''left'': (''about '' if l >= 600 else '''')
      ~ say(l_said), ''after_add'': (''about '' if l + seconds >= 600 else '''') ~ say(((l + seconds + 30) // 60 *
      60) if l + seconds >= 600 else l + seconds)} }}'
    max_seconds: 43200
    not_caught: 'I didn''t catch how long. Say, for example, set the oven timer for ten minutes.'
    too_long: The oven timer can run for up to 12 hours.
    none_running: There's no oven timer running.
    result:
      response: ''
- choose:
  - alias: start
    conditions:
    - condition: template
      value_template: '{{ cmd == ''start'' }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ seconds <= 0 or seconds > max_seconds }}'
      then:
      - variables:
          result:
            response: '{{ not_caught if seconds <= 0 else too_long }}'
      - stop: Length not usable
        response_variable: result
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.oven_timer_ringing
    - action: timer.start
      target:
        entity_id: timer.oven
      data:
        duration: '{{ seconds }}'
    - variables:
        result:
          response: Oven timer set for {{ say.amount }}.
  - alias: add
    conditions:
    - condition: template
      value_template: '{{ cmd == ''add'' }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ seconds <= 0 or (left | int(0)) + seconds > max_seconds }}'
      then:
      - variables:
          result:
            response: '{{ not_caught if seconds <= 0 else too_long }}'
      - stop: Length not usable
        response_variable: result
    - choose:
      - alias: Running or paused. Restart with the longer duration, then move the end back by the time already
          run, so remaining = left + seconds and the progress bar keeps its place. Paused stays paused.
        conditions:
        - condition: state
          entity_id: timer.oven
          state:
          - active
          - paused
        sequence:
        - alias: In case the timer ran out between reading it and here (ringing would stay on beside a running timer)
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.oven_timer_ringing
        - action: timer.start
          target:
            entity_id: timer.oven
          data:
            duration: '{{ total + seconds }}'
        - if:
          - condition: template
            value_template: '{{ total - (left | int(0)) > 0 }}'
          then:
          - action: timer.change
            target:
              entity_id: timer.oven
            data:
              duration: '{{ (left | int(0)) - total }}'
        - if:
          - condition: template
            value_template: '{{ st == ''paused'' }}'
          then:
          - action: timer.pause
            target:
              entity_id: timer.oven
        - variables:
            result:
              response: Added {{ say.amount }}. {{ 'The oven timer is paused with ' ~ say.after_add ~ ' left.'
                if st == 'paused' else say.after_add[:1] | upper ~ say.after_add[1:] ~ ' left.' }}
      - alias: Ringing. "Five more minutes" starts a fresh timer.
        conditions:
        - condition: template
          value_template: '{{ ringing }}'
        sequence:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.oven_timer_ringing
        - action: timer.start
          target:
            entity_id: timer.oven
          data:
            duration: '{{ seconds }}'
        - variables:
            result:
              response: Oven timer set for {{ say.amount }}.
      default:
      - variables:
          result:
            response: '{{ none_running }}'
  - alias: cancel or stop (both clear everything)
    conditions:
    - condition: template
      value_template: '{{ cmd in [''cancel'', ''stop''] }}'
    sequence:
    - variables:
        result:
          response: '{{ ''Oven timer canceled.'' if st in [''active'', ''paused''] else (''Oven timer stopped.''
            if ringing else none_running) }}'
    - action: timer.cancel
      target:
        entity_id: timer.oven
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.oven_timer_ringing
  - alias: status
    conditions:
    - condition: template
      value_template: '{{ cmd == ''status'' }}'
    sequence:
    - variables:
        result:
          response: '{% if ringing %}The oven timer is done.{% elif st == ''active'' %}{{ say.left[:1] | upper
            }}{{ say.left[1:] }} left on the oven timer.{% elif st == ''paused'' %}The oven timer is paused with
            {{ say.left }} left.{% else %}{{ none_running }}{% endif %}'
  default:
  - variables:
      result:
        response: 'Unknown oven timer command: {{ cmd }}.'
- stop: Done
  response_variable: result
